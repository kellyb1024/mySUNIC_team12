    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   페이지 3 — 캠페인 관리 (담당자)
   · 마케터가 1차 배치해 신청한 건을 확인하고 확정
   · 조정 요청 들어온 건의 일정을 조정해서 확정
   ══════════════════════════════════════════════════════════════════════ */
const byWhen=(a,b)=>a.date<b.date?-1:a.date>b.date?1:a.hour-b.hour;

function renderManage(){
  /* 마케터 화면과 같은 축 — 그 달에 '들어온 신청'을 기준으로 센다.
     발송일 관점은 아래 주간 캐파 현황이 주 단위로 담당한다. */
  const ofMonth=r=>reqMonth(r)===kpiMonth;
  const wait=requests.filter(r=>r.status==='신청'&&ofMonth(r)).sort(byWhen);
  const adj =requests.filter(r=>r.status==='조정 필요'&&ofMonth(r)).sort(byWhen);
  const conf=requests.filter(r=>r.status==='확정'&&ofMonth(r));
  const canc=requests.filter(r=>r.status==='취소'&&ofMonth(r));
  /* 지난달에 들어와 아직 처리 못 한 건 — 월을 넘겨 놓치지 않도록 알린다 */
  const carry=requests.filter(r=>['신청','조정 필요'].includes(r.status)&&reqMonth(r)<kpiMonth);
  const mi=MONTHS.indexOf(kpiMonth);
  return `<div class="wrap wide">
    <div class="kpihd">
      <button class="arw" data-km="${MONTHS[mi-1]||''}" ${mi<=0?'disabled':''}>‹</button>
      <span class="kml num">${kpiMonth.replace('-','. ')}</span>
      <button class="arw" data-km="${MONTHS[mi+1]||''}" ${mi>=MONTHS.length-1?'disabled':''}>›</button>
      <span class="kmn">전체 팀 · 이 달에 들어온 신청 ${wait.length+adj.length+conf.length+canc.length}건</span>
      ${carry.length?`<button class="chip sm" data-km="${MONTHS[MONTHS.indexOf(kpiMonth)-1]||''}">지난달 미처리 ${carry.length}건</button>`:''}
    </div>
    <div class="kpis">
      <div class="kpi${wait.length?' hero':''}"><div class="k">확정 대기</div>
        <div class="v num">${wait.length||'—'}</div></div>
      <div class="kpi"><div class="k">조정 필요</div>
        <div class="v num">${adj.length||'—'}</div></div>
      <div class="kpi"><div class="k">확정</div>
        <div class="v num">${conf.length||'—'}</div></div>
      <div class="kpi"><div class="k">취소</div>
        <div class="v num">${canc.length||'—'}</div></div>
    </div>

    <div class="card">
      <div class="card-hd"><div class="rule"></div>
        <div class="lbl"><span>확정 대기</span></div>
        <h2><span>${wait.length}건</span>
          ${wait.length?`<button class="pill primary sm" id="okAll">전체 확정</button>`:''}</h2></div>
      ${wait.length?`<div class="tblwrap"><table class="list adm">
        <tr><th>캠페인명</th><th>기간</th><th>발송 일시</th><th>채널 / GNB</th>
          <th>주기</th><th>오퍼</th><th class="r">타겟수</th><th>발송일 잔여 캐파</th>
          <th>부서 · 마케터</th><th></th></tr>
        ${wait.map(r=>`<tr class="rw">
          <td class="nm">${esc(r.camp)}</td>
          <td>${fmtD(r.from)} ~ ${fmtD(r.to)}</td>
          <td>${r.cycle==='주기성'?`매일 ${r.hour}:00`:`${fmtD(r.date)} ${r.hour}:00`}</td>
          <td>${r.ch.join('·')||'—'} / ${esc(r.gnb)||'—'}</td>
          <td>${r.cycle}</td><td>${r.offer}</td>
          <td class="r">${man(r.qty)}만</td>
          <td class="cap">${remCell(r)}</td>
          <td>${r.team} ${r.mk}</td>
          <td class="act"><button class="pill primary xs" data-ok="${r.no}">확정</button>
            <button class="pill ghost xs" data-rej="${r.no}">조정 필요</button></td></tr>`).join('')}
      </table></div>`:`<div class="empty">확정을 기다리는 건이 없습니다.</div>`}
    </div>

    <div class="card">
      <div class="card-hd"><div class="rule"></div>
        <div class="lbl"><span>조정 필요</span></div>
        <h2><span>${adj.length}건</span></h2></div>
      ${adj.length?adj.map(r=>admItem(r)).join(''):`<div class="empty">조정할 건이 없습니다.</div>`}
    </div>

    <div class="card">
      <div class="card-hd"><div class="rule"></div>
        <div class="lbl"><span>주간 캐파 현황</span></div>
        <h2><span>채널별 사용량</span>
          <span class="badge">배너 일 ${man(CAPA['배너'].limit)}만 · 쿠폰 일 ${man(CAPA['쿠폰'].limit)}만</span></h2></div>
      ${capaBoard()}
    </div>
  </div>`;
}

/* 이 건을 확정했을 때 그 날짜에 남는 캐파
   (신청 건도 이미 소진에 반영되어 있으므로 = 현재 잔여) */
function remCell(r){
  const parts=[];
  const put=(name,rem,lim)=>{
    const pct=(lim-rem)/lim*100;
    parts.push(`<span class="cp${pct>=90?' hot':pct>=80?' warn':''}">${name} ${man(rem)}<em>/${man(lim)}만</em></span>`);
  };
  if(r.ch.includes('배너')) put('배너',bannerRem(r.date),CAPA['배너'].limit);
  if(r.offer==='쿠폰')      put('쿠폰',couponRem(r.date),CAPA['쿠폰'].limit);
  /* 한도가 없어도 얼마나 나가는지는 보여준다 */
  r.ch.filter(c=>CAPA[c]&&CAPA[c].limit===null).forEach(c=>
    parts.push(`<span class="cp none">${c} ${man(usedOn(r.date,q=>q.ch.includes(c)))}<em>만 · 한도 없음</em></span>`));
  return parts.join('');
}

/* 조정 필요 1건 — 신청 내용, 선점 사유, 일정 조정 */
function admItem(r){
  const open=admFix.no===r.no;
  return `<div class="adjitem${open?' on':''}">
    <div class="adjhd"><b>${esc(r.camp)}</b>
      <span class="st needfix">조정 필요</span>
      <span class="adjwhen">${r.cycle==='주기성'
        ? `${fmtD(r.from)}~${fmtD(r.to)} · 매일 ${r.hour}:00`
        : `${fmtD(r.date)} ${r.hour}:00`}</span></div>
    <div class="cfgrid">
      ${cfRow('발송 일시',r.cycle==='주기성'
        ? `${fmtD(r.from)}~${fmtD(r.to)} 매일 ${r.hour}:00` : `${fmtD(r.date)} ${r.hour}:00`)}
      ${cfRow('기간',`${fmtD(r.from)} ~ ${fmtD(r.to)}`)}
      ${cfRow('채널 / GNB',`${r.ch.join('·')||'—'} / ${esc(r.gnb)||'—'}`)}
      ${cfRow('주기 / 오퍼',`${r.cycle} · ${r.offer}`)}
      ${cfRow(r.cycle==='주기성'?'1일 타겟수':'전체 타겟수',`${man(r.qty)}만 건`)}
      ${cfRow('부서 · 마케터',`${r.team} ${r.mk}`)}
      ${r.reqAt?cfRow('신청 시각',r.reqAt):''}
    </div>
    ${r.reason?`<div class="adjwhy"><span>선점</span>${esc(r.reason)}</div>`:''}
    ${r.note?`<div class="adjnote"><span>마케터 사유</span>${esc(r.note)}</div>`:''}
    ${r.admNote?`<div class="adjnote"><span>담당자 사유</span>${esc(r.admNote)}</div>`:''}
    ${open?admFixPanel(r)
      :admRej.no===r.no?`<div class="reasonfld" style="margin:12px 0 0">
          <label>취소 사유<i class="i" data-tip="마케터 화면에 그대로 남습니다.&#10;왜 진행할 수 없는지 적어 주세요."></i></label>
          <textarea id="rejNote" rows="2"
            placeholder="예: 선점 캠페인의 우선순위가 높아 이번 일정으로는 조정이 어렵습니다">${esc(admRej.text)}</textarea>
          <div class="adjbtns" style="margin-top:9px">
            <button class="pill danger sm" data-rejok="${r.no}">신청 취소</button>
            <button class="pill ghost sm" data-rejno="1">돌아가기</button>
          </div></div>`
      :`<div class="adjbtns">
          <button class="pill primary sm" data-fix="${r.no}">일정 조정</button>
          <button class="pill ghost sm" data-rej2="${r.no}">신청 취소</button>
        </div>`}
  </div>`;
}

/* 확정 대기 건을 조정 필요로 넘긴다.
   마케터가 무엇을 고쳐야 하는지 알 수 있도록 사유를 반드시 받는다. */
function adjAskModal(no){
  const r=requests.find(q=>q.no===no); if(!r) return;
  $('modalSlot').innerHTML=`<div class="modal"><div class="box">
    <h3>조정 필요로 넘길까요?</h3>
    <div class="herocard">
      ${hrow('캠페인명',r.camp)}
      ${hrow('발송 일시',r.cycle==='주기성'?`기간 내 매일 ${r.hour}:00`:`${fmtD(r.date)} ${r.hour}:00`)}
      ${hrow('채널 / GNB',`${r.ch.join(' · ')||'—'} / ${r.gnb||'—'}`)}
      ${hrow(r.cycle==='주기성'?'1일 타겟수':'전체 타겟수',`${man(r.qty)}만 건`)}
      ${hrow('부서 · 마케터',`${r.team} ${r.mk}`)}
    </div>
    <div class="reasonfld" style="margin:14px 0 0">
      <label>조정 사유</label>
      <textarea id="adjNote" rows="2"
        placeholder="예: 8/13 배너 캐파가 빠듯합니다. 발송일을 8/17 이후로 옮겨 주세요"></textarea>
    </div>
    <div class="m-act">
      <button class="pill ghost" id="aNo">돌아가기</button>
      <button class="pill primary" id="aYes">조정 필요로 넘기기</button>
    </div></div></div>`;
  $('aNo').onclick=()=>$('modalSlot').innerHTML='';
  $('aYes').onclick=()=>{
    const t=$('adjNote').value.trim();
    if(!t){toast('조정 사유를 입력해 주세요.',true); $('adjNote').focus(); return}
    r.status='조정 필요'; r.adjBy='adm'; r.admNote=t; r.reason='';
    $('modalSlot').innerHTML='';
    toast(`조정 필요로 넘겼습니다 — ${r.camp}`,true);
    render();
  };
}

/* 그 날들의 그 시각을 이미 쓰고 있는 건 (자기 자신은 제외) */
function fixHolder(r,days,h){
  for(const dd of days){
    const hit=requests.find(q=>inScope(q)&&activeOn(dd,q)&&q.hour===h&&slotClash(r,q));
    if(hit) return hit;
  }
  return null;
}

/* 선점 건 일정 조정 — 담당자·양 팀이 협의를 끝낸 뒤 그 결과를 반영하는 화면.
   합의가 이미 됐으므로 선점 건은 '확정'을 유지한 채 일정만 바뀐다. */
function swapPanel(r,rSpan,h,hd){
  const s=admSwap, sh=s.hour||hd.hour;
  const span=fixSpan(hd,s), rep=hd.cycle==='주기성', hours=rep?REC_HOURS:HOURS;
  /* 조정 요청 건이 넘겨받을 자리는 다시 고를 수 없다 */
  const busy=new Set();
  hours.forEach(x=>{
    const hit=span.some(dd=>(x===h&&rSpan.includes(dd))
      ||requests.some(q=>q.no!==hd.no&&q.no!==r.no&&live(q)&&activeOn(dd,q)&&q.hour===x&&slotClash(hd,q)));
    if(hit) busy.add(x);
  });
  /* 원래 나가던 날이 아닌 날만 캐파를 새로 본다 */
  const capaBad=span.filter(dd=>!activeOn(dd,hd)).some(dd=>
    (hd.ch.includes('배너')&&bannerRem(dd)<hd.qty)||(hd.offer==='쿠폰'&&couponRem(dd)<hd.qty));
  const changed=s.from!==hd.from||sh!==hd.hour;
  const ok=!busy.has(sh)&&!capaBad&&changed;
  const gd=span[0];
  return `<div class="fixpanel">
    <div class="fixhd">선점 건 일정 조정 — ${esc(hd.camp)} (${hd.team} ${hd.mk})</div>
    ${fixDates('sw',hd,s)}
    <div class="fixrow"><span>캐파</span>${gaugeRow(gd,hd,activeOn(gd,hd)?0:hd.qty,'이 건')}</div>
    <div class="fixrow"><span>시간대</span>
      <div class="hgrid ${rep?'rec3':'adm'}">${hours.map(x=>{
        const t=busy.has(x);
        return `<div class="hslot ${t?'taken':''}${x===sh?' on':''}" data-sh="${x}">
          <span class="hh">${x}시</span><span class="hs">${t?'선점':'가능'}</span></div>`}).join('')}</div>
    </div>
    ${capaBad?`<div class="blockbox"><b>캐파를 넘겨 옮길 수 없습니다</b>
      <div>${hd.cycle==='주기성'?'기간 내 어느 날의':fmtD(gd)} 잔여가 부족합니다 · 배너 ${man(bannerRem(gd))}만 / 쿠폰 ${man(couponRem(gd))}만</div></div>`:''}
    <div class="adjbtns">
      <button class="pill primary sm" data-swapok="${hd.no}" ${ok?'':'disabled'}>두 건 함께 확정</button>
      <button class="pill ghost sm" data-swapno="1">취소</button>
      ${busy.has(sh)?`<span class="note" style="margin:0">이미 찬 시간대입니다.</span>`
        :!changed?`<span class="note" style="margin:0">조정할 자리를 골라 주세요.</span>`:''}
    </div>
  </div>`;
}

/* 일정 조정 — 기간·시간대를 다시 고른다 (자기 자신은 충돌에서 제외) */
/* 일정 이동 — 담당자가 고른 기간·시간대를 그대로 반영한다.
   발송일은 늘 기간 첫 날이다 (일회성은 시작일 1회, 주기성은 시작일부터 매일) */
function moveTo(r,s){
  r.from=s.from; r.to=s.to; r.date=s.from; r.hour=s.hour;
}
/* 그 설정으로 실제 발송이 걸리는 날들 */
const fixSpan=(r,s)=>r.cycle==='주기성'?rangeDays(s.from,s.to):[s.from];

/* 발송 시작일만 고른다. 기간 길이는 그대로이므로 종료일이 따라 움직인다. */
function fixDates(id,r,s){
  return `<div class="fixrow"><span>발송 시작일</span>
      <div class="fdates">
        <input type="date" id="${id}From" value="${s.from}" min="${TODAY}" max="2026-09-30">
        <span class="tl">~ ${fmtD(s.to)}</span>
      </div></div>`;
}
function admFixPanel(r){
  const s=admFix, h=s.hour||r.hour;
  const span=fixSpan(r,s), rep=r.cycle==='주기성', hours=rep?REC_HOURS:HOURS;
  const busy=new Set();
  hours.forEach(x=>{ if(span.some(dd=>blockedHours(dd,r).has(x))) busy.add(x) });
  const capaBad=span.some(dd=>
    (r.ch.includes('배너')&&bannerRem(dd)<r.qty)||(r.offer==='쿠폰'&&couponRem(dd)<r.qty));
  const ok=!busy.has(h)&&!capaBad;
  const gd=span[0];
  return `<div class="fixpanel">
    <div class="fixhd">일정 조정</div>
    ${fixDates('fx',r,s)}
    <div class="fixrow"><span>캐파</span>${gaugeRow(gd,r,r.qty,'이 건')}</div>
    <div class="fixrow"><span>시간대</span>
      <div class="hgrid ${rep?'rec3':'adm'}">${hours.map(x=>{
        const t=busy.has(x);
        return `<div class="hslot ${t?'taken':''}${x===h?' on':''}" data-fh="${x}">
          <span class="hh">${x}시</span><span class="hs">${t?'선점':'가능'}</span></div>`}).join('')}</div>
    </div>
    ${capaBad?`<div class="blockbox"><b>캐파를 넘겨 배정할 수 없습니다</b>
      <div>${r.cycle==='주기성'?'기간 내 어느 날의':fmtD(gd)} 잔여가 부족합니다 · 배너 ${man(bannerRem(gd))}만 / 쿠폰 ${man(couponRem(gd))}만</div></div>`:''}
    <div class="adjbtns">
      <button class="pill primary sm" data-fixok="${r.no}" ${ok?'':'disabled'}>이 일정으로 확정</button>
      <button class="pill ghost sm" data-fixno="1">취소</button>
    </div>
    ${(()=>{
      if(!busy.has(h)) return '';
      const hd=fixHolder(r,span,h);
      if(!hd) return '<div class="segnote" style="margin-top:11px">선점된 시간대입니다. 다른 시간대를 골라 주세요.</div>';
      if(admSwap.no===hd.no) return swapPanel(r,span,h,hd);
      return `<div class="adjbtns" style="margin-top:11px">
        <button class="pill ghost sm" data-swapon="${hd.no}">선점 건 일정 조정</button>
      </div>`})()}
  </div>`;
}

/* 주간 캐파 현황 — 채널(행) × 요일(열) 매트릭스
   한 주가 한 화면에 들어오도록 하고, 주 단위로 넘긴다 */
const CH_COLOR={'TV팝업':'var(--ch-tv)','배너':'var(--ch-banner)',
  '토스트팝업':'var(--ch-toast)','쿠폰':'var(--ch-coupon)'};
const usedByName=(d,name)=>name==='쿠폰'
  ? couponUsed(d) : usedOn(d,r=>r.ch.includes(name));
const mondayOf=d=>{const t=new Date(d+'T00:00:00');return addDays(d,-((t.getDay()+6)%7))};

function capaBoard(){
  const days=[...Array(7)].map((_,i)=>addDays(capaFrom,i));
  const order=['TV팝업','배너','토스트팝업','쿠폰'];
  const first=ALL[0].d, last=ALL[ALL.length-1].d;
  const lv=p=>p>=95?4:p>=80?3:p>=50?2:1;
  /* 한도 없는 채널은 그 주 최대치를 기준으로 상대 비교 */
  const freeMax=Math.max(1,...days.flatMap(d=>
    order.filter(n=>CAPA[n].limit===null).map(n=>usedByName(d,n))));

  return `<div class="wknav">
      <button class="arw" id="cwPrev" ${capaFrom<=first?'disabled':''}>‹</button>
      <span class="lab">${fmtD(days[0])} ~ ${fmtD(days[6])}</span>
      <button class="arw" id="cwNext" ${addDays(capaFrom,7)>last?'disabled':''}>›</button>
      <button class="chip sm" id="cwToday">이번 주</button>
    </div>
    <table class="capamx">
      <tr><th></th>${days.map(d=>{
        const o=dayOf(d);
        return `<th class="${o&&o.dow===0?'sun':o&&o.dow===6?'sat':''}${d===TODAY?' today':''}">
          <span>${o?o.w:''}</span>${+d.slice(8)}</th>`}).join('')}</tr>
      ${order.map(n=>{
        const lim=CAPA[n].limit;
        return `<tr>
          <td class="chn"><i class="sw" style="background:${CH_COLOR[n]}"></i>${n}
            <small>${lim?`일 ${man(lim)}만`:'제한 없음'}</small></td>
          ${days.map(d=>{
            const u=usedByName(d,n);
            if(!u) return `<td class="mx zero">—</td>`;
            const pct=lim?u/lim*100:u/freeMax*100;
            return `<td class="mx ${lim?'lv'+lv(pct):'free'}">
              <b>${man(u)}</b>${lim?`<small>${Math.round(pct)}%</small>`:''}</td>`}).join('')}
        </tr>`}).join('')}
    </table>
    <div class="legend">
      <span class="lgt">한도 대비</span>
      <span><i class="cellsw lv1"></i>50% 미만</span>
      <span><i class="cellsw lv2"></i>50~80%</span>
      <span><i class="cellsw lv3"></i>80~95%</span>
      <span><i class="cellsw lv4"></i>95% 이상</span>
      <span class="sep2"></span>
      <span><i class="cellsw free"></i>한도 없음 — 사용량만</span>
    </div>`;
}

/* ── 담당자 화면 이벤트 ── */
function bindManage(){
  const re=()=>{$('page').innerHTML=renderManage();bindManage()};
  document.querySelectorAll('[data-km]').forEach(x=>x.onclick=()=>{
    if(x.dataset.km){kpiMonth=x.dataset.km;admFix={no:null,from:null,to:null,hour:null};noSwap();re()}});

  document.querySelectorAll('[data-ok]').forEach(x=>x.onclick=()=>{
    const r=requests.find(q=>q.no===+x.dataset.ok); if(!r) return;
    r.status='확정'; toast(`확정했습니다 — ${r.camp}`); re()});

  const all=$('okAll'); if(all) all.onclick=()=>{
    const n=requests.filter(r=>r.status==='신청').length;
    requests.forEach(r=>{if(r.status==='신청') r.status='확정'});
    toast(`${n}건을 확정했습니다`); re()};

  document.querySelectorAll('[data-rej]').forEach(x=>x.onclick=()=>adjAskModal(+x.dataset.rej));

  document.querySelectorAll('[data-rej2]').forEach(x=>x.onclick=()=>{
    admRej={no:+x.dataset.rej2,text:''}; admFix={no:null,from:null,to:null,hour:null}; noSwap(); re()});
  document.querySelectorAll('[data-rejno]').forEach(x=>x.onclick=()=>{admRej={no:null,text:''};re()});
  const rn=$('rejNote'); if(rn) rn.oninput=e=>admRej.text=e.target.value;
  document.querySelectorAll('[data-rejok]').forEach(x=>x.onclick=()=>{
    const r=requests.find(q=>q.no===+x.dataset.rejok); if(!r) return;
    if(!admRej.text.trim()){toast('취소 사유를 입력해 주세요.',true); if(rn) rn.focus(); return}
    /* 담당자 취소 — 사유(admNote)가 남아 마케터 취소와 구분된다 */
    r.status='취소'; r.admNote=admRej.text.trim(); admRej={no:null,text:''};
    toast(`신청을 취소했습니다 — ${r.camp}`,true); re()});

  document.querySelectorAll('[data-fix]').forEach(x=>x.onclick=()=>{
    const r=requests.find(q=>q.no===+x.dataset.fix); if(!r) return;
    admFix={no:r.no,from:r.from,to:r.to,len:rangeDays(r.from,r.to).length,hour:r.hour}; noSwap(); re()});
  document.querySelectorAll('[data-fixno]').forEach(x=>x.onclick=()=>{
    admFix={no:null,from:null,to:null,hour:null}; noSwap(); re()});
  /* 발송 시작일 — 기간 길이를 유지한 채 종료일이 따라 움직인다 */
  const bindDates=(id,st,after)=>{
    const f=$(id+'From'); if(!f) return;
    const lo=TODAY;
    f.onchange=e=>{
      st.from=e.target.value<lo?lo:e.target.value;
      st.to=addDays(st.from,st.len-1);
      after&&after(); re();
    };
  };
  bindDates('fx',admFix,noSwap);
  bindDates('sw',admSwap);
  document.querySelectorAll('[data-fh]').forEach(x=>x.onclick=()=>{admFix.hour=+x.dataset.fh;noSwap();re()});

  document.querySelectorAll('[data-swapon]').forEach(x=>x.onclick=()=>{
    const hd=requests.find(q=>q.no===+x.dataset.swapon); if(!hd) return;
    admSwap={no:hd.no,from:hd.from,to:hd.to,len:rangeDays(hd.from,hd.to).length,hour:hd.hour}; re()});
  document.querySelectorAll('[data-sh]').forEach(x=>x.onclick=()=>{admSwap.hour=+x.dataset.sh;re()});
  document.querySelectorAll('[data-swapno]').forEach(x=>x.onclick=()=>{noSwap();re()});

  /* 두 건 함께 반영 — 선점 건은 합의된 자리로, 조정 요청 건은 원하던 자리로 */
  document.querySelectorAll('[data-swapok]').forEach(x=>x.onclick=()=>{
    const r=requests.find(q=>q.no===admFix.no), hd=requests.find(q=>q.no===+x.dataset.swapok);
    if(!r||!hd) return;
    const when=q=>q.cycle==='주기성'
      ? `${fmtD(q.from)}~${fmtD(q.to)} 매일 ${q.hour}:00` : `${fmtD(q.date)} ${q.hour}:00`;
    const hWas=when(hd), rWas=when(r);
    moveTo(hd,admSwap);
    hd.moved={from:hWas,to:when(hd),peer:r.camp};
    moveTo(r,admFix);
    r.status='확정'; r.reason=''; r.note=''; r.admNote=''; r.adjBy=null;
    r.memo=`담당자 일정 조정 (${rWas} → ${when(r)})`;
    admFix={no:null,from:null,to:null,hour:null}; noSwap();
    toast(`두 건을 확정했습니다 — ${r.camp} · ${hd.camp} ${when(hd)}`);
    re()});

  const cp=$('cwPrev'), cn=$('cwNext'), ct=$('cwToday');
  if(cp) cp.onclick=()=>{capaFrom=addDays(capaFrom,-7);re()};
  if(cn) cn.onclick=()=>{capaFrom=addDays(capaFrom,7);re()};
  if(ct) ct.onclick=()=>{capaFrom=mondayOf(TODAY);re()};

  document.querySelectorAll('[data-fixok]').forEach(x=>x.onclick=()=>{
    const r=requests.find(q=>q.no===+x.dataset.fixok); if(!r) return;
    const was=r.cycle==='주기성'
      ? `${fmtD(r.from)}~${fmtD(r.to)} 매일 ${r.hour}:00` : `${fmtD(r.date)} ${r.hour}:00`;
    moveTo(r,admFix);
    r.status='확정';
    r.memo=`담당자 일정 조정 (${was} → ${r.cycle==='주기성'?`매일 ${r.hour}:00`:`${fmtD(r.date)} ${r.hour}:00`})`;
    r.reason=''; r.note=''; r.admNote=''; r.adjBy=null;
    admFix={no:null,from:null,to:null,hour:null}; noSwap();
    toast(`일정을 조정해 확정했습니다 — ${r.camp}`); re()});
}

/* ══════════════════════════════════════════════════════════════════════
   렌더
   ══════════════════════════════════════════════════════════════════════ */
function render(){
  $('roleMkt').classList.toggle('on',role==='mkt');
  $('roleAdm').classList.toggle('on',role==='adm');
  renderTabs();
  if(tab==='apply'){ $('page').innerHTML=renderApply(); bindApply(); }
  else if(tab==='cal'&&calDay){
    $('page').innerHTML=renderDay(calDay);
    $('backCal').onclick=()=>{calDay=null;render()};
    $('prevD').onclick=()=>{calDay=addDays(calDay,-1);calMonth=calDay.slice(0,7);render()};
    $('nextD').onclick=()=>{calDay=addDays(calDay,1);calMonth=calDay.slice(0,7);render()};
    const ah=$('applyHere');
    if(ah) ah.onclick=()=>{
      draft.date=calDay; draft.hour=null;
      if(draft.from>calDay) draft.from=calDay;
      if(draft.to<calDay) draft.to=calDay;
      calDay=null; tab='apply'; found=true; render();
    };
  }
  else if(tab==='cal'){
    $('page').innerHTML=renderCal();
    const mi=MONTHS.indexOf(calMonth);
    $('pm').onclick=()=>{calMonth=MONTHS[mi-1];render()};
    $('nm').onclick=()=>{calMonth=MONTHS[mi+1];render()};
    $('todayBtn').onclick=()=>{calMonth=TODAY.slice(0,7);render()};
    document.querySelectorAll('[data-cd]').forEach(x=>x.onclick=()=>{calDay=x.dataset.cd;render()});
    document.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{calFilter.mode=x.dataset.m;render()});
    document.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{
      const v=x.dataset.f;
      if(v==='__clear'){calFilter.ch=[];calFilter.offer=''}
      else{const i=calFilter.ch.indexOf(v); i<0?calFilter.ch.push(v):calFilter.ch.splice(i,1)}
      render()});
    /* 오퍼는 한 번 더 누르면 해제된다 */
    document.querySelectorAll('[data-fo]').forEach(x=>x.onclick=()=>{
      calFilter.offer=calFilter.offer===x.dataset.fo?'':x.dataset.fo; render()});
  }
  else { $('page').innerHTML=renderManage(); bindManage(); }
}
$('roleMkt').onclick=()=>{role='mkt';$('roleMkt').classList.add('on');$('roleAdm').classList.remove('on');
  if(tab==='manage') tab='apply'; render()};
$('roleAdm').onclick=()=>{role='adm';$('roleAdm').classList.add('on');$('roleMkt').classList.remove('on');render()};
render();
</script>
