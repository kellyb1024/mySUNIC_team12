<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>캠페인 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sk-orange:#EE7501; --sk-orange-text:#B35700; --sk-orange-dk:#D06600;
  --sk-orange-t25:#FBD9B4; --sk-orange-t10:#FDEFE0; --sk-red:#EA002C;
  --l1:#EEF0F2; --l1t:#1F1F1F; --l2:#FBD9B4; --l2t:#5A3400;
  --l3:#EE7501; --l3t:#1F1F1F; --l4:#EA002C; --l4t:#FFFFFF;
  --cell-border:#85898C; --bg:#F5F6F7; --surface:#FFF; --border:#E5E7E8; --motif:#F0F1F2;
  --text-strong:#1F1F1F; --text:#4A4E52; --text-muted:#6E7276;
  --locked-fill:#9A9EA2; --locked-text:#5F6368;
  --waiting-bg:#FFF3CC; --waiting-text:#5C4700; --waiting-border:#C9A227;
  --confirmed:#1F1F1F;
  --ch-banner:#B35700; --ch-tv:#EE7501; --ch-toast:#F7A85C; --ch-coupon:#FBD0A0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);
  color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;min-width:1180px}
.num{font-family:Roboto,sans-serif;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px}

/* ── GNB ── */
.gnb{height:58px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:28px;padding:0 40px;position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:center;gap:12px}
.brand .ci{height:26px;width:auto;display:block}
.brand .div{width:1px;height:18px;background:var(--border)}
.brand b{font-size:19px;font-weight:500;color:var(--text-strong);letter-spacing:-.02em}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button{padding:6px 15px;font-size:12px;font-weight:500;color:var(--text-muted)}
.seg button.on{background:var(--sk-orange);color:#1F1F1F}
.demo-cap{font-size:10.5px;color:var(--text-muted)}

/* ── 상단 3탭 ── */
.tabbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 40px;
  display:flex;gap:4px;position:sticky;top:58px;z-index:59}
.tabbar a{padding:13px 20px 11px;font-size:14px;color:var(--text-muted);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar a.on{color:var(--sk-orange-text);font-weight:500;border-bottom-color:var(--sk-orange)}
.tabbar a:hover:not(.on){color:var(--text-strong)}

.wrap{padding:24px 40px 90px;max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wrap.wide{max-width:1560px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:17px 19px 19px}
.card-hd{margin-bottom:15px}
.card-hd .rule{height:1px;background:var(--sk-orange);margin-bottom:8px}
.card-hd .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--sk-orange-text)}
.card-hd h2{font-size:17px;font-weight:500;color:var(--text-strong);margin-top:3px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card-hd h2 .badge{font-size:11px;font-weight:400;color:var(--text-muted);border:1px solid var(--border);
  border-radius:999px;padding:2px 9px}

/* ── i 아이콘 툴팁 ── */
.i{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:999px;
  border:1px solid var(--text-muted);color:var(--text-muted);font-size:9px;font-style:normal;
  font-family:Roboto;cursor:help;position:relative;vertical-align:1px;margin-left:4px;flex:0 0 14px}
.i::before{content:'i';font-family:Roboto;font-weight:500;line-height:1}
.i:hover{border-color:var(--sk-orange-text);color:var(--sk-orange-text)}
.i::after{content:attr(data-tip);position:absolute;left:calc(100% + 9px);top:50%;transform:translateY(-50%);
  background:var(--text-strong);color:#fff;font-size:11.5px;font-weight:400;line-height:1.55;
  padding:8px 11px;border-radius:5px;width:220px;text-align:left;white-space:pre-line;
  opacity:0;visibility:hidden;transition:opacity .12s;z-index:120;pointer-events:none;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}
/* 꼬리 */
.i::marker{content:''}
.i:hover::after{opacity:1;visibility:visible}

/* ── 스텝 인디케이터 ── */
.steps{display:flex;align-items:center;gap:0;margin-bottom:20px}
.stp{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted)}
.stp .sn{width:22px;height:22px;border-radius:999px;background:var(--motif);color:var(--text-muted);
  display:grid;place-items:center;font-size:11px;font-family:Roboto;font-weight:500;flex:0 0 22px}
.stp.on{color:var(--text-strong);font-weight:500}
.stp.on .sn{background:var(--sk-orange);color:#1F1F1F}
.stp.done .sn{background:var(--text-strong);color:#fff}
.stp.done{color:var(--text)}
.stp-line{flex:1;height:1px;background:var(--border);margin:0 12px;min-width:22px}

/* ── 폼 ── */
.frow{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > label{font-size:11.5px;font-weight:500;color:var(--sk-orange-text);display:flex;align-items:center}
.fld input[type=date],.fld input[type=text],.fld input[type=number],.fld select{
  padding:9px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;width:100%}
.fld input:focus,.fld select:focus{outline:2px solid var(--sk-orange);outline-offset:-1px}
.fld input[type=number]{text-align:right;font-family:Roboto;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:12.5px;
  background:#fff;color:var(--text);white-space:nowrap}
.chip.on{border-color:var(--text-strong);background:var(--text-strong);color:#fff}
.chip.sm{padding:5px 11px;font-size:11.5px}
.chip.sm.on{background:var(--sk-orange-t10);border-color:var(--sk-orange-text);color:var(--sk-orange-text)}
.unit{display:flex;align-items:center;gap:7px}
.unit span{font-size:12px;color:var(--text-muted);white-space:nowrap}
.hintline{font-size:11px;color:var(--text-muted);margin-top:3px;line-height:1.5}

/* ── 날짜 선택 그리드 (Step 2) ── */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dgrid .dh{font-size:11px;color:var(--text-muted);text-align:center;padding-bottom:3px}
.dgrid .dh.sun{color:var(--sk-red)}
.dcell{border:1px solid var(--cell-border);border-radius:5px;padding:8px 6px;min-height:74px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:#fff;cursor:pointer;position:relative;transition:transform .1s}
.dcell .dd{font-size:14px;font-weight:500;font-family:Roboto;color:var(--text-strong)}
.dcell .dm{font-size:10.5px;color:var(--text-muted);text-align:center;line-height:1.35}
.dcell.ok:hover{transform:translateY(-1px);border-color:var(--sk-orange-text)}
.dcell.ok .dm{color:var(--sk-orange-text)}
.dcell.on{background:var(--text-strong);border-color:var(--text-strong)}
.dcell.on .dd{color:#fff} .dcell.on .dm{color:#D6D8DA}
.dcell.no{background:var(--motif);border-style:dashed;border-color:var(--border);cursor:not-allowed}
.dcell.no .dd{color:var(--locked-text);font-weight:400} .dcell.no .dm{color:var(--locked-text)}
.dcell.blank{border:none;background:none;cursor:default;min-height:0}
.dcell.busy{background:var(--waiting-bg);border-color:var(--waiting-border)}
.dcell.start{border-color:var(--sk-orange);border-width:2px}
.dcell.start .wk{color:var(--sk-orange-text);font-weight:500}
.dcell.busy .dm{color:var(--waiting-text)}
.blockbox{border:1px solid var(--sk-red);border-radius:6px;padding:13px 15px;margin-top:16px}
.blockbox b{display:block;font-size:13px;font-weight:500;color:var(--sk-red);margin-bottom:6px}
.blockbox div{font-size:11.5px;color:var(--text);line-height:1.6}
.blockbox .bm{color:var(--text-muted);margin-top:5px}
.dcell .wk{position:absolute;top:4px;right:6px;font-size:9px;color:var(--text-muted)}
.dcell.sun .dd{color:var(--sk-red)}
.dcell.on.sun .dd{color:#fff}

/* ── 시간대 슬롯 (Step 3) ── */
.hgrid{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.hgrid.rec3{grid-template-columns:repeat(3,minmax(0,180px))}
.hslot{border:1px solid var(--cell-border);border-radius:4px;height:52px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.hslot .hh{font-size:12px;font-family:Roboto;font-weight:500;color:var(--text-strong)}
.hslot .hs{font-size:9.5px;color:var(--text-muted)}
.hslot:hover:not(.taken):not(.on){border-color:var(--sk-orange-text);background:var(--sk-orange-t10)}
.hslot.on{background:var(--text-strong);border-color:var(--text-strong)}
.hslot.on .hh{color:#fff} .hslot.on .hs{color:#D6D8DA}
/* 선점 = 남이 쓰고 있지만 조정 요청은 가능 → 비활성처럼 보이지 않게 */
.hslot.taken{background:var(--l1);border-color:var(--locked-fill);cursor:pointer}
.hslot.taken .hh{color:var(--locked-text)}
.hslot.taken .hs{color:var(--locked-text);font-weight:400}
.hslot.taken .swap{display:none}
.hslot.taken:hover:not(.on){background:var(--waiting-bg);border-color:var(--waiting-border)}
.hslot.taken:hover:not(.on) .hh{color:var(--waiting-text)}
.hslot.taken:hover:not(.on) .keep{display:none}
.hslot.taken:hover:not(.on) .swap{display:inline;color:var(--waiting-text);font-weight:500}
/* 읽기 전용(일자 상세) — 호버 반응 없음 */
.hslot.ro{cursor:default}
.hslot.ro:hover{background:var(--l1);border-color:var(--locked-fill)}
.hslot.ro:hover .hh{color:var(--locked-text)}
.hslot.rec{border-color:var(--sk-orange);border-width:2px}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.t3{border:1px solid var(--border);border-radius:6px;padding:11px 12px}
.t3 .r{font-size:10px;color:var(--sk-orange-text);font-weight:500}
.t3 .h{font-size:16px;font-weight:500;color:var(--text-strong);font-family:Roboto;margin:2px 0}
.t3 .m{font-size:11px;color:var(--text-muted)}
.t3 button{margin-top:8px;width:100%;padding:7px;border-radius:999px;border:1px solid var(--sk-orange-text);
  color:var(--sk-orange-text);font-size:11.5px;font-weight:500;background:#fff}
.t3 button:hover{background:var(--sk-orange-t10)}

/* ── 요약 / 게이지 ── */
.sumbox{border:1px solid var(--border);border-radius:6px;padding:14px 16px;background:var(--sk-orange-t10);
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.sumbox .sv{font-size:11px;color:var(--sk-orange-text);font-weight:500;margin-bottom:3px}
.sumbox .sd{font-size:14px;color:var(--text-strong);font-weight:500}
.gauges{display:flex;gap:22px;flex-wrap:wrap;margin:4px 0 14px}
.gauge{display:flex;gap:10px;align-items:flex-end}
.gtube{width:40px;height:84px;border:1px solid var(--cell-border);border-radius:3px;position:relative;overflow:hidden;background:var(--l1)}
/* 소진된 캐파 = SK 오렌지 / 내가 신청하려는 분량 = 연한 톤 빗금 */
.gfill{position:absolute;left:0;right:0;bottom:0;background:var(--sk-orange)}
.gghost{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,
  var(--sk-orange-t25) 0 4px,#FFFFFF 4px 8px);border-top:1px solid var(--sk-orange-t25)}
.gmeta{font-size:11.5px;line-height:1.6}
.gmeta .gt{font-size:11px;font-weight:500;color:var(--sk-orange-text);margin-bottom:2px;display:flex;align-items:center}
.gmeta .gn{font-family:Roboto;font-variant-numeric:tabular-nums;color:var(--text-strong)}

/* ── 캘린더 ── */
.calnav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.calnav button.arw{width:30px;height:30px;border:1px solid var(--border);border-radius:6px;background:#fff}
.calnav button.arw:hover:not(:disabled){background:var(--motif)}
.calnav button.arw:disabled{opacity:.3;cursor:not-allowed}
.calnav .lab{font-size:16px;font-weight:500;color:var(--text-strong);min-width:130px;text-align:center;font-family:Roboto}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);margin-bottom:15px}
.filters .fl{font-size:11.5px;color:var(--text-muted);margin-right:2px}
.filters .sep{width:1px;height:18px;background:var(--border);margin:0 4px}

.calhd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calwk{position:relative;margin-bottom:5px}
.wcells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.lanegap{flex:0 0 auto}
.wspans{position:absolute;left:0;right:0;top:25px;display:grid;
  grid-template-columns:repeat(7,1fr);gap:5px;grid-auto-rows:19px;row-gap:3px;
  pointer-events:none}
/* 주기성 바는 배치만 담당 — 생김새는 일회성 칩(.ev) 규칙을 그대로 쓴다 */
.span{pointer-events:auto;min-width:0}
/* 주 경계에서 이어지는 쪽은 좌측 액센트와 모서리를 없앤다 */
.span:not(.head){border-left:none;border-radius:0 3px 3px 0}
.span:not(.tail){border-radius:3px 0 0 3px}
.span:not(.head):not(.tail){border-radius:0}
.cal{display:block}
.cal .ch{font-size:11.5px;color:var(--text-muted);text-align:center;padding:4px 0 6px;font-weight:500}
.cal .ch.sun{color:var(--sk-red)}
.ccell{border:1px solid var(--border);border-radius:5px;min-height:112px;padding:6px 7px;background:#fff;
  display:flex;flex-direction:column;gap:3px;position:relative}
.ccell.out{background:var(--motif);opacity:.55}
.ccell.today{border-color:var(--sk-orange);border-width:2px;padding:5px 6px}
.ccell .cd{font-size:12px;font-family:Roboto;font-weight:500;color:var(--text-strong);margin-bottom:1px}
.ccell.sun .cd{color:var(--sk-red)}
.ccell .cmore{font-size:10px;color:var(--text-muted);margin-top:auto}
.ev{font-size:10.5px;padding:2px 5px;border-radius:3px;line-height:1.4;cursor:pointer;position:relative;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--text-muted)}
.ev.start{background:var(--sk-orange-t10);border-left-color:var(--sk-orange);color:var(--sk-orange-text)}
.ev.end{background:var(--l1);border-left-color:var(--locked-fill);color:var(--text)}
.ev.rep{background:var(--waiting-bg);border-left-color:var(--waiting-border);color:var(--waiting-text)}
.ev:hover{overflow:visible;z-index:80}
.ev.rt .tip{left:auto;right:0}
.ev.up .tip{top:auto;bottom:100%;border-top:none;border-bottom:6px solid transparent}
.ev .tip{display:none;position:absolute;top:100%;left:0;background:var(--text-strong);color:#fff;
  padding:9px 11px;border-radius:5px;font-size:11px;line-height:1.6;width:222px;white-space:normal;
  z-index:130;box-shadow:0 4px 14px rgba(0,0,0,.2);
  border-top:6px solid transparent;background-clip:padding-box}
.ev:hover .tip{display:block}
.ev .tip b{display:block;font-weight:500;margin-bottom:4px;font-size:11.5px}
.ev .tip .tr{display:flex;justify-content:space-between;gap:10px;color:#D6D8DA}
.ev .tip .tr span:last-child{font-family:Roboto;color:#fff}

.ccell[data-cd]{cursor:pointer}
.ccell[data-cd]:hover{border-color:var(--sk-orange-text);background:#FFFDFA}

/* ── 일자 상세 리스트 ── */
.daylist{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.dayrow{display:grid;grid-template-columns:58px minmax(0,1fr) 150px 78px 84px 76px;gap:12px;
  align-items:center;padding:11px 13px;background:#fff;font-size:12.5px}
.dayrow .dh2{color:var(--sk-orange-text);font-weight:500}
.dayrow .dnm{color:var(--text-strong);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow .dch,.dayrow .dw{color:var(--text-muted);font-size:11.5px}
.dayrow .dq{text-align:right;color:var(--text-strong)}

/* ── 월간 발송 현황 차트 ── */
.chartbox{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;align-items:start}
.cbar{display:flex;flex-direction:column;gap:9px}
.cbrow{display:flex;align-items:center;gap:11px}
.cbrow .cl{width:70px;flex:0 0 70px;font-size:11.5px;color:var(--text-strong);display:flex;align-items:center;gap:5px}
.cbrow .cl i.sw{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 9px}
.cbtrack{flex:1;height:20px;background:var(--l1);border-radius:3px;overflow:hidden;position:relative}
.cbtrack b{display:block;height:100%;border-radius:3px}
.cbrow .cn{width:104px;text-align:right;font-family:Roboto;font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--text-strong);flex:0 0 104px}
.sparkwrap{border:1px solid var(--border);border-radius:6px;padding:13px 14px}
.sparkwrap .st2{font-size:11.5px;color:var(--sk-orange-text);font-weight:500;margin-bottom:9px;display:flex;align-items:center}
.spark{display:flex;align-items:stretch;gap:2px;height:86px}
.spark .sb{flex:1;background:var(--l1);border-radius:2px;position:relative}
.spark .sb b{position:absolute;left:0;right:0;bottom:0;background:var(--sk-orange);border-radius:2px;min-height:1px}
.spark .sb:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;
  transform:translateX(-50%);background:var(--text-strong);color:#fff;font-size:10.5px;padding:5px 8px;
  border-radius:4px;white-space:nowrap;z-index:50}
.sparkx{display:flex;gap:2px;margin-top:5px}
.sparkx span{flex:1;text-align:center;font-size:8.5px;color:var(--text-muted);font-family:Roboto}

/* ── 공통 ── */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:11.5px;color:var(--text-muted);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid var(--cell-border);margin-right:5px;vertical-align:-1px}
.note{font-size:11.5px;color:var(--text-muted);margin-top:9px;line-height:1.6}
.segnote{font-size:11.5px;color:var(--text-muted);margin-bottom:11px;line-height:1.55}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:18px}
.pill{border-radius:999px;padding:10px 21px;font-size:13.5px;font-weight:500}
.pill.primary{background:var(--sk-orange);color:#1F1F1F}
.pill.primary:hover{background:var(--sk-orange-dk)}
.pill.primary:disabled{background:var(--motif);color:var(--locked-text);cursor:not-allowed}
.pill.ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
.pill.danger{background:var(--sk-red);color:#fff}
.pill.danger:hover{background:#C4001F}
.pill.ghost:hover{background:var(--motif)}
.empty{font-size:12.5px;color:var(--text-muted);text-align:center;padding:26px 0;line-height:1.7}
.st{display:inline-block;font-size:11px;font-weight:500;border-radius:4px;padding:2px 9px;white-space:nowrap}
.st.confirmed{border:1px solid var(--confirmed);color:var(--confirmed)}
.st.applied{background:var(--waiting-bg);color:var(--waiting-text);border:1px solid var(--waiting-border)}
.st.sent{background:var(--l1);color:var(--text-muted)}
.st.cancel{background:var(--motif);color:var(--locked-text);border:1px dashed var(--locked-fill)}

.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:9px;z-index:200}
.toast{background:var(--text-strong);color:#fff;padding:12px 16px;border-radius:6px;font-size:12.5px;
  max-width:400px;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.16);animation:tin .2s}
.toast.warn{background:var(--sk-red)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.modal{position:fixed;inset:0;background:rgba(31,31,31,.42);display:grid;place-items:center;z-index:300;padding:20px}
.modal .box{background:#fff;border-radius:8px;padding:22px 24px;max-width:520px;width:100%}
.modal h3{font-size:16px;font-weight:500;color:var(--text-strong);margin-bottom:4px}
.modal .m-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px;line-height:1.6}
.modal .m-act{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.herocard{border:1px solid var(--sk-orange);border-radius:7px;background:var(--sk-orange-t10);padding:15px 17px}
.herocard .hr{display:flex;gap:14px;padding:6px 0;font-size:12.5px;
  border-bottom:1px dashed var(--sk-orange-t25)}
.herocard .hr:last-child{border-bottom:none}
/* 항목은 한 줄로 고정 폭, 내용도 같은 왼쪽 정렬 */
.herocard .hr span:first-child{color:var(--sk-orange-text);flex:0 0 104px;white-space:nowrap}
.herocard .hr span:last-child{color:var(--text-strong);font-weight:500;text-align:left}
.hide{display:none!important}


/* ── 2단 배치 (좌 조건 / 우 카드) ── */
.shell{display:flex;align-items:flex-start;gap:20px}
.side{width:250px;flex:0 0 250px;position:sticky;top:112px;z-index:40}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.fgroup{margin-bottom:13px}
.ftitle{font-size:11px;font-weight:500;color:var(--sk-orange-text);margin-bottom:5px;display:flex;align-items:center}
.side input[type=date],.side input[type=text]{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:4px;background:#fff}
.side input:focus{outline:2px solid var(--sk-orange);outline-offset:-1px}
.opt{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12.5px;color:var(--text-strong);cursor:pointer}
.opt input{accent-color:var(--sk-orange);width:14px;height:14px;cursor:pointer}
.qtyrow{display:flex;align-items:center;gap:6px}
.qtyrow input{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:4px;text-align:right;
  font-family:Roboto;font-variant-numeric:tabular-nums}
.qtyrow span{font-size:12px;color:var(--text-muted);white-space:nowrap}
.findbtn{width:100%;padding:11px;border-radius:999px;background:var(--sk-orange);color:#1F1F1F;
  font-size:13.5px;font-weight:500;margin-top:4px}
.findbtn:hover{background:var(--sk-orange-dk)}
.resetbtn{width:100%;padding:7px;font-size:11px;color:var(--text-muted);text-decoration:underline;margin-top:5px}

/* ── 이번주 신청 가능 / 가장 빠른 슬롯 ── */
.quicks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.qk{border:1px solid var(--border);border-radius:6px;padding:12px 14px;background:var(--sk-orange-t10)}
.qk .qt{font-size:11px;font-weight:500;color:var(--sk-orange-text);margin-bottom:4px}
.qk .qv{font-size:18px;font-weight:500;color:var(--text-strong);line-height:1.2}
.qk .qv small{font-size:12px;color:var(--text-muted);font-weight:400}
.qk .qm{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.5}
.qk .qb{margin-top:9px;width:100%;padding:6px;border-radius:999px;border:1px solid var(--sk-orange-text);
  color:var(--sk-orange-text);font-size:11.5px;font-weight:500;background:#fff}
.qk .qb:hover{background:#fff}

/* ── 카드 안에서 펼쳐지는 단계 ── */
.drill{border-top:1px solid var(--border);margin-top:18px;padding-top:16px}
.drill.final{border-top:1px dashed var(--sk-orange-text)}
.drill-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px}
.drill-hd b{font-size:14.5px;font-weight:500;color:var(--text-strong)}
.drill-hd span{font-size:11.5px;color:var(--text-muted)}
.frow3{display:grid;grid-template-columns:minmax(0,2fr) 1fr 1fr;gap:14px}
.frow3 .fld label{font-size:11.5px;font-weight:500;color:var(--sk-orange-text)}
.frow3 .fld input{padding:9px 10px;border:1px solid var(--border);border-radius:4px;width:100%}
.frow3 .fld input:focus{outline:2px solid var(--sk-orange);outline-offset:-1px}

/* ── 맨 위 · 내 캠페인 월간 현황 요약 ── */
.hslot.taken.on{background:var(--waiting-bg);border-color:var(--waiting-border);border-width:2px}
.hslot.taken.on .hh{color:var(--waiting-text);font-weight:500}
.hslot.taken.on .hs{color:var(--waiting-text)}
.drill.final.warn{border-top:1px dashed var(--waiting-border)}
.conflict{border:1px solid var(--waiting-border);background:var(--waiting-bg);border-radius:6px;
  padding:12px 14px;margin-bottom:14px}
.conflict .cft{font-size:12.5px;font-weight:500;color:var(--waiting-text);margin-bottom:7px}
.conflict .cfbox{background:#fff;border:1px solid var(--waiting-border);border-radius:5px;
  padding:11px 13px;margin-bottom:9px}
.conflict .cfhd{display:flex;align-items:center;gap:9px;margin-bottom:9px;
  padding-bottom:8px;border-bottom:1px dashed var(--waiting-border)}
.conflict .cfhd b{font-size:13.5px;font-weight:500;color:var(--text-strong)}
.conflict .cfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 22px}
.conflict .cfg{display:flex;gap:10px;font-size:12px;min-width:0}
.conflict .cfg span{color:var(--text-muted);flex:0 0 82px}
.conflict .cfg b{font-weight:400;color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conflict .cfm{font-size:11.5px;color:var(--waiting-text);margin-top:7px;line-height:1.55}
table.list td.rsn{color:var(--text-muted);font-size:11.5px;max-width:230px;white-space:normal;line-height:1.5}
table.list td.rsn .src{color:var(--waiting-text)}
.reasonfld label{font-size:11.5px;font-weight:500;color:var(--sk-orange-text);
  display:flex;align-items:center;margin-bottom:5px}
.reasonfld{margin-bottom:14px}
.reasonfld textarea{width:100%;padding:9px 10px;border:1px solid var(--waiting-border);border-radius:4px;
  font-family:inherit;font-size:12.5px;resize:vertical;background:#FFFDF5}
.reasonfld textarea:focus{outline:2px solid var(--sk-orange);outline-offset:-1px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;position:relative}
.kpi .k{font-size:11.5px;color:var(--text-muted);margin-bottom:5px}
.kpi .v{font-size:26px;font-weight:500;color:var(--text-strong);line-height:1.15;letter-spacing:-.02em}
.kpi .k{display:flex;align-items:center;gap:5px}
.kpi.hero{background:var(--sk-orange-t10);padding-left:19px}
.kpi.hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--sk-orange);border-radius:8px 0 0 8px}
.kpi.hero .k{color:var(--sk-orange-text);font-weight:500}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{border-color:var(--sk-orange-text)}
.kpi.clickable .s{color:var(--sk-orange-text)}
.kpi.open{outline:2px solid var(--sk-orange);outline-offset:-1px}
.adjitem{border:1px solid var(--border);border-radius:6px;padding:13px 15px;margin-bottom:11px}
.adjitem:last-child{margin-bottom:0}
.adjhd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.adjhd b{font-size:13.5px;font-weight:500;color:var(--text-strong)}
.adjhd .adjwhen{margin-left:auto;font-size:11.5px;color:var(--text-muted);font-family:Roboto}
.cfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 22px}
.cfg{display:flex;gap:10px;font-size:12px;min-width:0}
.cfg span{color:var(--text-muted);flex:0 0 82px}
.cfg b{font-weight:400;color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adjwhy{margin-top:10px;font-size:12px;color:var(--waiting-text);background:var(--waiting-bg);
  border-radius:4px;padding:7px 10px;display:flex;gap:8px}
.adjwhy span{font-weight:500;flex:0 0 auto}
.adjnote{margin-top:7px;font-size:12px;color:var(--text);background:var(--motif);
  border-radius:4px;padding:7px 10px;display:flex;gap:8px;line-height:1.55}
.adjnote span{font-weight:500;color:var(--text-muted);flex:0 0 auto}
.adjrej{margin-top:7px;font-size:12px;color:var(--sk-red);background:#FFF5F6;
  border:1px solid #F5C2C8;border-radius:4px;padding:7px 10px;display:flex;gap:8px;line-height:1.55}
.adjrej span{font-weight:500;flex:0 0 auto}
.adjbtns{display:flex;gap:8px;margin-top:11px}
.pill.sm{padding:7px 14px;font-size:12px}
.kpihd{display:flex;align-items:center;gap:9px;margin-bottom:-6px}
.kpihd .arw{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:12px}
.kpihd .arw:hover:not(:disabled){background:var(--motif)}
.kpihd .arw:disabled{opacity:.3;cursor:not-allowed}
.kpihd .kml{font-size:14px;font-weight:500;color:var(--text-strong);min-width:74px;text-align:center}
.kpihd .kmn{font-size:11.5px;color:var(--text-muted)}
.monthnav{display:flex;align-items:center;gap:7px}
.monthnav .mlab{font-size:16px;font-weight:500;color:var(--text-strong);min-width:66px;text-align:center}
.arw.sm{width:24px;height:24px;border:1px solid var(--border);border-radius:5px;background:#fff;font-size:11px}
.arw.sm:hover:not(:disabled){background:var(--motif)}
.arw.sm:disabled{opacity:.3;cursor:not-allowed}

/* ── 추천 카드 ── */
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.rec-card{border:1px solid var(--border);border-radius:6px;padding:12px 13px}
.rec-card .rt{font-size:13.5px;font-weight:500;color:var(--text-strong);margin-bottom:5px}
.rec-card .rl{font-size:11.5px;color:var(--text-muted);line-height:1.6}
.rec-card button{width:100%;margin-top:9px;padding:7px;border-radius:999px;border:1px solid var(--sk-orange-text);
  color:var(--sk-orange-text);font-size:11.5px;font-weight:500;background:#fff}
.rec-card button:hover{background:var(--sk-orange-t10)}

/* ── 리스트 ── */
.tabs{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;width:max-content}
.tabs button{padding:6px 15px;font-size:12px;color:var(--text-muted);white-space:nowrap}
.tabs button.on{background:var(--text-strong);color:#fff}
.tabs.sm button{padding:5px 12px;font-size:11.5px}
.tblwrap{overflow-x:auto}
table.list{width:100%;min-width:1080px;border-collapse:collapse;font-size:12.5px}
table.list th{font-size:11px;font-weight:400;color:var(--text-muted);text-align:left;padding:8px 9px;
  border-bottom:1px solid var(--cell-border);white-space:nowrap}
table.list td{padding:10px 9px;border-bottom:1px solid var(--border);vertical-align:middle;
  color:var(--text-strong);white-space:nowrap}
table.list td.nm{white-space:normal;min-width:200px}
table.list tr.rw:hover td{background:#FCFCFD}
table.list tr.rw.clk{cursor:pointer}
.stfil{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.stfil .chip{display:inline-flex;align-items:center;gap:5px}
.stfil .chip .num{font-family:Roboto;font-variant-numeric:tabular-nums;color:var(--text-muted)}
.stfil .chip.on .num{color:inherit}
.stfil .chip:disabled{opacity:.4;cursor:default}
table.list .r{text-align:right;font-family:Roboto;font-variant-numeric:tabular-nums}
.st.needfix{background:var(--waiting-bg);color:var(--waiting-text);border:1px solid var(--waiting-border)}

/* ── 담당자 화면 ── */
.pill.xs{padding:5px 11px;font-size:11.5px;border-radius:999px}
table.list.adm td.cap{white-space:nowrap;line-height:1.6}
.cp{display:block;font-size:11.5px;font-family:Roboto;font-variant-numeric:tabular-nums;color:var(--text-strong)}
.cp em{font-style:normal;color:var(--text-muted);font-size:10.5px}
.cp.warn{color:var(--sk-orange-text);font-weight:500}
.cp.hot{color:var(--sk-red);font-weight:500}
.cp.none{color:var(--text-muted);font-family:inherit;font-size:11px}
table.list td.act{white-space:nowrap;text-align:right;width:1%}
table.list.adm td.act{white-space:nowrap;text-align:right}
table.list.adm td.act .pill{margin-left:5px}
table.list.adm th:last-child,table.list.adm td.act{width:1%}
.adjitem.on{border-color:var(--sk-orange)}
.fixpanel{margin-top:12px;padding-top:12px;border-top:1px dashed var(--sk-orange)}
.fixhd{font-size:12px;font-weight:500;color:var(--sk-orange-text);margin-bottom:10px}
.fixrow{display:flex;gap:12px;align-items:flex-start;margin-bottom:11px}
.fixrow > span{flex:0 0 56px;font-size:11.5px;color:var(--text-muted);padding-top:6px}
.fdates{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:1px}
.fdates input[type=date]{padding:7px 9px;border:1px solid var(--border);border-radius:4px;
  font-size:12px;font-family:inherit;color:var(--text-strong);background:#fff}
.fdates input[type=date]:focus{outline:2px solid var(--sk-orange);outline-offset:-1px}
.fdates .tl{font-size:11.5px;color:var(--text-muted)}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.hgrid.adm{grid-template-columns:repeat(11,minmax(0,1fr));flex:1}
/* 주간 캐파 매트릭스 */
.wknav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wknav .arw{width:30px;height:30px;border:1px solid var(--border);border-radius:6px;background:#fff}
.wknav .arw:hover:not(:disabled){background:var(--motif)}
.wknav .arw:disabled{opacity:.3;cursor:not-allowed}
.wknav .lab{font-size:14px;font-weight:500;color:var(--text-strong);min-width:170px;text-align:center}
table.capamx{width:100%;border-collapse:separate;border-spacing:5px;margin:-5px;table-layout:fixed}
table.capamx th:first-child{width:104px}
table.capamx th{font-size:11.5px;font-weight:400;color:var(--text-muted);text-align:center;padding-bottom:2px}
table.capamx th span{display:block;font-size:10.5px}
table.capamx th.sun{color:var(--sk-red)}
table.capamx th.today{color:var(--sk-orange-text);font-weight:500}
table.capamx td.chn{width:104px;font-size:12px;color:var(--text-strong);white-space:nowrap;padding-right:6px}
table.capamx td.chn small{display:block;font-size:10px;color:var(--text-muted);margin-left:14px}
table.capamx td.chn .sw{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
td.mx{height:50px;border-radius:4px;border:1px solid var(--cell-border);text-align:center;
  font-family:Roboto;font-variant-numeric:tabular-nums;background:var(--l1)}
td.mx b{display:block;font-size:14px;font-weight:500;line-height:1.1}
td.mx small{font-size:10px;opacity:.8}
/* 소진율 4단계는 오렌지 한 색의 농도로만 말한다. 회색은 '비어 있음' 하나에만 쓴다 */
td.mx.zero{background:#fff;border-style:dashed;border-color:var(--border);
  color:var(--text-muted);font-size:11px}
td.mx.lv1{background:var(--sk-orange-t10);color:var(--l2t)}
td.mx.lv2{background:var(--l2);color:var(--l2t)}
td.mx.lv3{background:var(--l3);color:var(--l3t)}
td.mx.lv4{background:var(--l4);color:var(--l4t)}
/* 한도가 없으면 소진율이 없다 — 농도로 말할 수 없으니 숫자만 둔다 */
td.mx.free{background:#fff;color:var(--text-strong)}
.cellsw{display:inline-block;width:11px;height:11px;border-radius:2px;
  border:1px solid var(--cell-border);margin-right:5px;vertical-align:-1px}
.cellsw.lv1{background:var(--sk-orange-t10)} .cellsw.lv2{background:var(--l2)}
.cellsw.lv3{background:var(--l3)} .cellsw.lv4{background:var(--l4)}
.cellsw.free{background:#fff}
.legend .lgt{color:var(--text-strong);font-weight:500}
.legend .sep2{width:1px;height:12px;background:var(--border);display:inline-block}

/* ── 수정 중 배너 ── */
.editbar{background:var(--sk-orange-t10);border:1px solid var(--sk-orange);border-radius:6px;
  padding:10px 14px;font-size:12.5px;color:var(--sk-orange-text);display:flex;align-items:center;gap:8px}
.editbar b{font-weight:500}
.editbar button{margin-left:auto;font-size:11.5px;color:var(--sk-orange-text);
  text-decoration:underline;padding:2px 4px}

/* ── 데이터 재정의 예정 배너 ── */
.wipbar{background:var(--waiting-bg);border:1px solid var(--waiting-border);border-radius:6px;
  padding:10px 14px;font-size:12px;color:var(--waiting-text);line-height:1.6}
.wipbar b{font-weight:500}
</style>

<body>

<script>
/* ══════════════════════════════════════════════════════════════════════

const TODAY='2026-07-31';
const HOURS=Array.from({length:22},(_,i)=>i+1);   /* 1시 ~ 22시 (0시·23시 미발송) */
const WD=['일','월','화','수','목','금','토'];

/* ══════════════════════════════════════════════════════════════════════
   캐파 정의 — 0728 피드백 반영 · 2026-07-29 확정
   · 배너       : 일 400만                      (1차원 · 날짜)
   · 쿠폰       : 일 440만 (시간당 20만 × 22시간)  (1차원 · 날짜)  ← '시간당 20만 신청 제한' 폐지
   · TV팝업     : 제한 없음                                    ← '노드당 100만' 폐지, 노드 개념 제거
   · 토스트팝업  : 제한 없음
   · 시간대      : 1개 시간대에 1개 캠페인만 배치
   신청 규칙 (1안)
   · 일 캐파 초과  : 시스템이 발송 자체를 못 하므로 신청 불가 (조정 대상 아님)
   · 시간대 선점   : 선택은 가능하되 '조정 요청' → 상태 '조정 필요'
   숫자·산식 확정 후 이 블록만 교체하면 됩니다.
   ══════════════════════════════════════════════════════════════════════ */
const CAPA={
  배너:{limit:400, unit:'일', dim:'날짜'},
  쿠폰:{limit:440, unit:'일', dim:'날짜'},
  TV팝업:{limit:null, unit:'—', dim:'제한 없음'},
  토스트팝업:{limit:null, unit:'—', dim:'제한 없음'},
};
const CH_LIST=['TV팝업','배너','토스트팝업'];

/* ── 날짜 축 (주말 포함) ── */
function buildDays(){
  const out=[], s=new Date('2026-07-01T00:00:00'), e=new Date('2026-09-30T00:00:00');
  for(let t=new Date(s); t<=e; t.setDate(t.getDate()+1)){
    out.push({d:iso(t), w:WD[t.getDay()], dow:t.getDay()});
  }
  return out;
}
function iso(t){return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}
const ALL=buildDays();
const dayOf=d=>ALL.find(x=>x.d===d);
const fmtD=d=>`${+d.slice(5,7)}/${+d.slice(8)}(${dayOf(d)?.w??''})`;
const man=n=>(Math.round(n*10)/10).toLocaleString('ko-KR');
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00');t.setDate(t.getDate()+n);return iso(t)};

/* ══════════════════════════════════════════════════════════════════════
   신청 데이터
   ══════════════════════════════════════════════════════════════════════ */
let seq=0; const ME={team:'A팀',mk:'철수'};
/* adjBy — '조정 필요' 로 들어온 경로. 다음에 움직일 사람이 다르다.

   'adm' 담당자가 확정 대기 건을 넘김        → 마케터가 수정해 재신청 */
/* 신청 시각(reqAt) — 요약 4칸의 집계 기준이자 알림 D-1 판정의 근거.

const mkReq=o=>{
  const r=Object.assign({no:++seq,gnb:'홈',cycle:'일회성',memo:'',status:'확정',adjBy:null},o);

/* ── 시간대 겹침 규칙 ──
   시스템이 막는 제약은 '일 캐파' 하나뿐이다. 같은 시각에 여러 건이 나가도

      그러면 B팀한테 양보하는 경우도 있긴 있어요."  — 0728 미팅

   그래서 시간대 겹침은 '신청 불가'가 아니라 '조정 요청' 대상으로 둔다.
     · 같은 채널 + 같은 시각  → 조정 대상
     · 채널이 다르면          → 동시 가능 (주기성도 동일 — 0730 담당자 확인)
     · 쿠폰은 오퍼라 시간대 자원이 아니다 (0728 피드백 · 일 440만 기준)
   GNB 는 데이터·화면에는 남지만 겹침 판정에는 쓰지 않는다. */
const slotKeys=r=>r.ch||[];
function slotClash(a,b){
  const bk=slotKeys(b);
  return slotKeys(a).some(k=>bk.includes(k));
}
function clashWhy(a,b){
  const bk=slotKeys(b), dup=slotKeys(a).filter(k=>bk.includes(k));
  return `${dup.join('·')} 채널이 겹칩니다`;
}

const liveAt=(d,h)=>requests.filter(r=>inScope(r)&&activeOn(d,r)&&r.hour===h);
const takenHours=d=>new Set(requests.filter(r=>live(r)&&activeOn(d,r)).map(r=>r.hour));
/* 조건 c 로 신청할 때 실제로 막히는 시간대 (판정용) */
const blockedHours=(d,c)=>new Set(requests.filter(r=>inScope(r)&&activeOn(d,r)&&slotClash(c,r)).map(r=>r.hour));
/* 오늘은 아직 안 지났다 — 오늘 발송 예정 건도 조정·신청할 수 있어야 한다 */
const isPast=d=>d<TODAY;

   1안 — 가능한 날짜 / 시간대만 신청 가능
   ══════════════════════════════════════════════════════════════════════ */
function dayCheck(c,d){
  if(isPast(d)) return {ok:false,why:'지난 날짜'};
  if(c.ch.includes('배너')&&bannerRem(d)<c.qty) return {ok:false,why:`배너 잔여 ${man(bannerRem(d))}만`};
  if(c.offer==='쿠폰'&&couponRem(d)<c.qty) return {ok:false,why:`쿠폰 잔여 ${man(couponRem(d))}만`};
  const free=HOURS.filter(h=>!blockedHours(d,c).has(h));
  if(!free.length) return {ok:false,why:'시간대 마감'};
  return {ok:true,free};
}
const rangeDays=(from,to)=>ALL.filter(x=>x.d>=from&&x.d<=to).map(x=>x.d);

/* 주기성: 기간 전체를 한 번에 판정 (매일 1일치 캐파 · 17~19시 중 1칸) */
function periodCheck(c){
  const days=rangeDays(c.from,c.to), blocked=[];
  days.forEach(d=>{
    /* 캐파는 매일 1일치씩 소진되므로 기간 내 모든 날을 검사 */
    if(isPast(d)){blocked.push({d,why:'지난 날짜'});return}
    if(c.ch.includes('배너')&&bannerRem(d)<c.qty){blocked.push({d,why:`배너 잔여 ${man(bannerRem(d))}만`});return}
    if(c.offer==='쿠폰'&&couponRem(d)<c.qty){blocked.push({d,why:`쿠폰 잔여 ${man(couponRem(d))}만`});return}
  });
  /* 주기성은 기간 내내 같은 시간대를 잡으므로, 17~19시 각각이 기간 전체에서 비었는지 본다 */
  const hours=REC_HOURS.map(h=>{
    const hits=[], onDays=[];
    days.forEach(d=>{const r=holderOf(d,h,c); if(r){onDays.push(d); if(!hits.includes(r))hits.push(r)}});
    return {h, free:!hits.length, hits, onDays};
  });
  return {days, blocked, hours, ok:blocked.length===0};
}

  {k:'cal',   n:'캘린더',      roles:['mkt','adm']},
];
function renderTabs(){
  $('tabbar').innerHTML=TABS.filter(t=>t.roles.includes(role))
    .map(t=>`<a data-k="${t.k}" class="${tab===t.k?'on':''}">${t.n}</a>`).join('');
  $('tabbar').querySelectorAll('a').forEach(a=>a.onclick=()=>{tab=a.dataset.k;render()});
}

/* ══════════════════════════════════════════════════════════════════════
   페이지 1 — 캠페인 신청 (마케터 화면)
   좌: 잔여 일정 확인하기 / 우: 캠페인 신청하기 · 추천 · 캠페인 리스트
   ══════════════════════════════════════════════════════════════════════ */
function renderApply(){
  return `<div class="wrap wide">
    ${draft.editNo?(()=>{const o=requests.find(r=>r.no===draft.editNo);
      return `<div class="editbar">
        <b>수정 중</b> ${o?esc(o.camp):''}
        <button id="cancelEdit">수정 취소</button></div>`})():''}
    <div class="shell">
      <aside class="side">${sideCond()}</aside>

        ${cardApply()}
        ${found?cardRec():''}
        ${cardList()}
      </div>
    </div>

}

/* ── 맨 위 · 내 캠페인 월간 현황 요약 ── */
function kpiRow(){
  const m=kpiMonth;
  /* 집계 기준은 발송일이 아니라 '신청한 날' — 이번 달에 내가 넣은 건이 한눈에 들어온다 */
  const mine=requests.filter(r=>r.mk===ME.mk&&r.team===ME.team&&reqMonth(r)===m);
  const cnt=s=>mine.filter(r=>r.status===s).length;
  /* 신청 → 담당자 처리 → 조정 필요 | 확정  (발송 완료는 확정을 거친 건) */
  /* 각 캠페인은 정확히 한 칸에만 속한다. 네 칸의 합이 그 달 신청 건수 */
  const wait=cnt('신청'), adj=cnt('조정 필요'),
        conf=cnt('확정')+cnt('발송 완료'), canc=cnt('취소');
  const applied=wait+adj+conf+canc;
  const box=(k,v,hero,attr)=>`<div class="kpi${hero?' hero':''}${attr?' clickable':''}${
      attr&&adjOpen?' open':''}" ${attr||''}>
    <div class="k">${k}</div>
    <div class="v num">${v||'—'}</div></div>`;
  const mi=MONTHS.indexOf(m);
  return `<div class="kpihd">
      <button class="arw" data-km="${MONTHS[mi-1]||''}" ${mi<=0?'disabled':''}>‹</button>
      <span class="kml num">${m.replace('-','. ')}</span>
      <button class="arw" data-km="${MONTHS[mi+1]||''}" ${mi>=MONTHS.length-1?'disabled':''}>›</button>
      <span class="kmn">내가 신청한 캠페인 · ${applied}건</span>
    </div>
    <div class="kpis">
      ${box('확정 대기',wait)}
      ${box('확정',conf)}
      ${box('조정 필요',adj,adj>0,'data-adj')}
      ${box('취소',canc)}
    </div>
    ${adjOpen?adjPanel(m):''}`;
}

/* 조정 필요 내역 — 정보·사유 확인과 수정 */
function adjPanel(m){
  const rows=requests.filter(r=>r.mk===ME.mk&&r.team===ME.team
    &&reqMonth(r)===m&&r.status==='조정 필요');
  if(!rows.length) return `<div class="card"><div class="empty">이 달에 조정 필요 건이 없습니다.</div></div>`;
  return `<div class="card adjcard">
    <div class="card-hd"><div class="rule"></div>
      <div class="lbl"><span>조정 필요 내역</span><span>${m.replace('-','.')}</span></div>
      <h2><span>${rows.length}건</span>
        <span class="badge">담당자 조정 대기</span></h2></div>
    ${rows.map(r=>`<div class="adjitem">
      <div class="adjhd"><b>${esc(r.camp)}</b>
        <span class="st needfix">조정 필요</span>
        <span class="adjwhen">${r.cycle==='주기성'
          ? `${fmtD(r.from)}~${fmtD(r.to)} · 매일 ${r.hour}:00`
          : `${fmtD(r.date)} ${r.hour}:00`}</span></div>
      <div class="cfgrid">
        ${cfRow('기간',`${fmtD(r.from)} ~ ${fmtD(r.to)}`)}
        ${cfRow('채널 / GNB',`${r.ch.join('·')||'—'} / ${esc(r.gnb)||'—'}`)}
        ${cfRow('주기 / 오퍼',`${r.cycle} · ${r.offer}`)}
        ${cfRow(r.cycle==='주기성'?'1일 타겟수':'전체 타겟수',`${man(r.qty)}만 건`)}
      </div>
      ${r.reason&&!(r.adjBy==='adm'&&r.admNote)
        ?`<div class="adjwhy"><span>${r.adjBy==='adm'?'사유':'선점'}</span>${
          esc(r.adjBy==='adm'?r.reason:r.reason.replace(/\s*선점$/,''))}</div>`:''}
      ${r.note?`<div class="adjnote"><span>신청 시 작성한 사유</span>${esc(r.note)}</div>`:''}
      ${r.admNote?`<div class="adjnote"><span>담당자 사유</span>${esc(r.admNote)}</div>`:''}
      <div class="adjbtns">
        <button class="pill ghost sm" data-move="${r.no}">수정하기</button>
        <button class="pill ghost sm" data-cancel="${r.no}">신청 취소</button>
      </div>
    </div>`).join('')}
  </div>`;
}

/* ── 이번 주 신청 가능 / 가장 빠른 슬롯 ── */
function thisWeekDays(){
  const t=new Date(TODAY+'T00:00:00'), off=(t.getDay()+6)%7;   /* 월요일 시작 */
  const mon=addDays(TODAY,-off);
  return ALL.filter(x=>x.d>=mon&&x.d<=addDays(mon,6)).map(x=>x.d);
}
function earliestSlot(c){
  for(const x of ALL){
    if(x.d<draft.from||x.d>draft.to) continue;
    const r=dayCheck(c,x.d);
    if(r.ok) return {d:x.d,h:[...r.free].sort((a,b)=>prefRank(a)-prefRank(b))[0]};
  }
  return null;
}

/* ── 우측 상단 · 캠페인 신청하기 ── */
function cardApply(){
  const head=`<div class="card-hd"><div class="rule"></div>
    <div class="lbl"><span>캠페인 신청하기</span></div>
    <h2><span>신청 가능한 날짜</span>
      <span class="badge">선점 시간대는 조정 요청으로 신청</span></h2></div>`;
  if(!found) return `<div class="card">${head}
    <div class="empty">좌측에서 조건을 입력하고 <b>가능한 날 찾기</b>를 눌러 주세요.</div></div>`;
  if(draft.cycle==='주기성') return recurringBody(head);

  const days=rangeDays(draft.from,draft.to);
  const okDays=days.filter(d=>dayCheck(draft,d).ok);
  const wk=thisWeekDays().filter(d=>okDays.includes(d));
  const es=earliestSlot(draft);
  const first=days[0], lead=dayOf(first)?.dow??0;

  const grid=[...Array(lead)].map(()=>`<div class="dcell blank"></div>`).concat(
    days.map(d=>{
      const c=dayCheck(draft,d), o=dayOf(d);
      return `<div class="dcell ${c.ok?'ok':'no'}${draft.date===d?' on':''}${o.dow===0?' sun':''}"
          ${c.ok?`data-d="${d}"`:''}>
        <span class="wk">${o.w}</span><span class="dd">${+d.slice(8)}</span>
        <span class="dm">${c.ok?`${c.free.length}개 시간대`:c.why}</span></div>`})).join('');

  return `<div class="card">${head}
    <div class="quicks">
      <div class="qk"><div class="qt">이번 주 신청 가능</div>
        <div class="qv num">${wk.length}일</div>
        <div class="qm">${wk.length?wk.map(fmtD).join(' · '):'이번 주에는 가능한 날이 없습니다'}</div></div>
      <div class="qk"><div class="qt">가장 빠른 슬롯</div>
        <div class="qv num">${es?`${fmtD(es.d)} ${es.h}:00`:'—'}</div>
        <div class="qm">${es?'이 날짜·시간대로 바로 신청할 수 있습니다':'조건을 완화해 주세요'}</div>
        ${es?`<button class="qb" id="takeEarly">이 슬롯으로 신청</button>`:''}</div>
      <div class="qk"><div class="qt">기간 내 가능한 날</div>
        <div class="qv num">${okDays.length}일 <small>/ ${days.length}일</small></div>
        <div class="qm">${draft.ch.join('·')} / ${draft.offer} · ${man(draft.qty)}만 건 기준</div></div>
    </div>
    <div class="dgrid">${WD.map((w,i)=>`<div class="dh${i===0?' sun':''}">${w}</div>`).join('')}${grid}</div>
    ${okDays.length?'':`<div class="empty">이 기간에는 신청 가능한 날짜가 없습니다.<br>기간을 넓히거나 타겟수를 줄여 보세요.</div>`}
    ${draft.date?secHour():''}
    ${draft.date&&draft.hour?secFinal():''}
  </div>`;
}

/* ── 주기성: 기간 전체를 한 건으로 신청 ── */
function recurringBody(head){
  const pc=periodCheck(draft);
  const total=draft.qty*pc.days.length;
  const first=pc.days[0], lead=dayOf(first)?.dow??0;
  const blockedOn=Object.fromEntries(pc.blocked.map(x=>[x.d,x.why]));
  const sel=pc.hours.find(x=>x.h===draft.hour);
  const busyDays=new Set(sel?sel.onDays:[]);
  const grid=[...Array(lead)].map(()=>`<div class="dcell blank"></div>`).concat(
    pc.days.map(d=>{
      const o=dayOf(d), bl=blockedOn[d], bu=busyDays.has(d), isStart=d===draft.from;
      const cls=bl?'no':bu?'busy':'ok';
      return `<div class="dcell ${cls}${o.dow===0?' sun':''}${isStart?' start':''}" style="cursor:default">
        <span class="wk">${isStart?'시작':o.w}</span><span class="dd">${+d.slice(8)}</span>
        <span class="dm">${bl||(bu?`${draft.hour}시 선점`:`${draft.hour}시 발송`)}</span></div>`})).join('');
  return `<div class="card">${head}
    <div class="quicks">
      <div class="qk"><div class="qt">발송 기간</div>
        <div class="qv num">${pc.days.length}일</div>
        <div class="qm">${fmtD(draft.from)} ~ ${fmtD(draft.to)} · 매일 발송</div></div>
      <div class="qk"><div class="qt">발송 시간대</div>
        <div class="qv num">${draft.hour}:00</div>
        <div class="qm">기간 내내 매일 이 시간대에 발송합니다</div></div>
      <div class="qk"><div class="qt">1일 발송 모수</div>
        <div class="qv num">${man(draft.qty)}만 <small>건</small></div>
        <div class="qm">기간 합계 ${man(total)}만 · 매일 ${man(draft.qty)}만씩 캐파 소진</div></div>
    </div>
    <div class="dgrid">${WD.map((w,i)=>`<div class="dh${i===0?' sun':''}">${w}</div>`).join('')}${grid}</div>
    <div class="legend">
      <span><i style="background:#fff;border-color:var(--cell-border)"></i>발송 가능</span>
      <span><i style="background:var(--waiting-bg);border-color:var(--waiting-border)"></i>선택한 시간대 선점</span>
      <span><i style="background:var(--motif);border-style:dashed"></i>캐파 부족 · 발송 불가</span>
    </div>
    <div class="drill">
      <div class="drill-hd"><b>발송 시간대</b><span>주기성은 17~19시에만 배치됩니다</span></div>
      <div class="hgrid rec3">${pc.hours.map(x=>{
        const on=draft.hour===x.h;
        return `<div class="hslot ${x.free?'':'taken'}${on?' on':''}" data-h="${x.h}">
          <span class="hh">${x.h}시</span>
          <span class="hs">${x.free?'기간 내내 가능'
            :`<span class="keep">${x.onDays.length}일 선점</span><span class="swap">조정 요청</span>`}</span>
        </div>`}).join('')}</div>
      ${sel&&!sel.free?`<div class="note">${sel.hits.map(r=>
        `${esc(r.camp)} (${r.team} ${r.mk} · ${r.cycle})`).join(' · ')} 와 겹칩니다.</div>`:''}
    </div>
    ${pc.blocked.length
      ? `<div class="blockbox"><b>${pc.blocked.length}일이 캐파를 넘겨 신청할 수 없습니다</b>
          <div>${pc.blocked.slice(0,6).map(x=>`${fmtD(x.d)} ${x.why}`).join(' · ')}${pc.blocked.length>6?` 외 ${pc.blocked.length-6}일`:''}</div>
          <div class="bm">1일 타겟수를 줄이거나 기간을 조정해 주세요.</div></div>`
      : secFinal()}
  </div>`;
}

/* ── 날짜 클릭 후 펼쳐지는 시간대 선택 ── */
function secHour(){
  const d=draft.date, taken=blockedHours(d,draft);
  const free=HOURS.filter(h=>!taken.has(h));
  const rec=[...free].sort((a,c)=>prefRank(a)-prefRank(c)).slice(0,3);
  return `<div class="drill">
    <div class="drill-hd"><b>${fmtD(d)} · 잔여 시간대</b>
      <span>빈 시간대 ${free.length}개 / 22개</span></div>
    ${gaugeRow(d)}
    <div class="hgrid">${HOURS.map(h=>{
      const t=taken.has(h), on=draft.hour===h, r=rec.includes(h);
      return `<div class="hslot ${t?'taken':''}${on?' on':''}${r&&!on?' rec':''}" data-h="${h}">
        <span class="hh">${h}시</span>
        <span class="hs">${t?'<span class="keep">선점</span><span class="swap">조정 요청</span>':'가능'}</span></div>`}).join('')}</div>
    ${occupancyList(d)}
    <div class="segnote" style="margin:14px 0 0">잔여 시간대 추천</div>
    <div class="top3">${rec.map((h,i)=>`<div class="t3"><div class="r">추천 ${i+1}</div>
      <div class="h">${h}:00</div><div class="m">${prefRank(h)<2?'반응률이 가장 높은 시간대'
        :prefRank(h)<4?'선호도가 높은 시간대':'남아 있는 시간대'}</div>
      <button data-pick="${h}">이 시간대 선택</button></div>`).join('')
      ||'<div class="empty">남은 시간대가 없습니다.</div>'}</div>
  </div>`;
}
/* 이 날 시간대를 차지하고 있는 캠페인 — 주기성은 캐파가 시작일에만 잡혀
   게이지가 비어 보이므로 점유 사유를 목록으로 드러낸다 */
function occupancyList(d){
  const on=requests.filter(r=>live(r)&&activeOn(d,r))
    .sort((a,b)=>a.hour-b.hour);
  if(!on.length) return '';
  return `<div class="segnote" style="margin:16px 0 0">이 날 배치된 캠페인</div>
  <div class="daylist">${on.map(r=>{
    const rep=r.cycle==='주기성';
    return `<div class="dayrow">
      <span class="dh2 num">${r.hour}:00</span>
      <span class="dnm">${esc(r.camp)}</span>
      <span class="dch">${rep?`주기성 · ${fmtD(r.from)}~${fmtD(r.to)}`:r.ch.join('·')+' / '+r.offer}</span>
      <span class="dq num">${man(r.qty)}만</span>
      <span class="dw">${r.team} ${r.mk}</span>
      <span class="st ${r.status==='신청'?'applied':r.status==='조정 필요'?'needfix'
        :r.status==='발송 완료'?'sent':'confirmed'}">${r.status}</span>
    </div>`}).join('')}</div>
  `;
}

/* 캐파 게이지 — 신청 화면과 담당자 조정 화면이 같이 쓴다.
   add = 이 건이 아직 그 날 소진에 안 잡혀 있을 때 더해질 분량 (0 이면 숨김) */
function gaugeRow(d,c=draft,add=c.qty,lab='내 신청'){
  const g=(name,used,lim)=>{
    /* 한도가 없어도 얼마나 나가는지는 보여준다 */
    if(lim===null) return `<div class="gauge"><div class="gtube"></div>
      <div class="gmeta"><div class="gt">${name}</div>
      <div class="gn">${man(used)}만 사용</div>
      <div style="color:var(--text-muted)">한도 없음</div></div></div>`;
    const p=Math.min(100,used/lim*100), mine=Math.min(100-p,add/lim*100);
    return `<div class="gauge"><div class="gtube">
        <div class="gfill" style="height:${p}%"></div>
        <div class="gghost" style="bottom:${p}%;height:${mine}%"></div></div>
      <div class="gmeta"><div class="gt">${name}</div>
        <div class="gn">${man(used)} / ${man(lim)}만</div>
        <div style="color:var(--text-muted)">${add?`${lab} +${man(add)}만`:'이미 반영됨'}</div></div></div>`;
  };
  const rows=[];
  if(c.ch.includes('배너')) rows.push(g('배너',bannerUsed(d),CAPA['배너'].limit));
  if(c.offer==='쿠폰')      rows.push(g('쿠폰',couponUsed(d),CAPA['쿠폰'].limit));
  c.ch.filter(x=>CAPA[x]&&CAPA[x].limit===null)
      .forEach(x=>rows.push(g(x,usedOn(d,q=>q.ch.includes(x)),null)));
  return `<div class="gauges">${rows.join('')}</div>`;
}

/* 선택한 날짜·시간대를 이미 점유한 캠페인 */
const holderOf=(d,h,c)=>liveAt(d,h).find(r=>slotClash(c||draft,r))||null;
const conflict=()=>{
  if(draft.cycle==='주기성'){
    if(!draft.hour) return null;
    const h=periodCheck(draft).hours.find(x=>x.h===draft.hour);
    return h&&h.hits.length?h.hits[0]:null;
  }
  return draft.date&&draft.hour?holderOf(draft.date,draft.hour,draft):null;
};

/* ── 우측 중단 · 추천 ── */
function cardRec(){
  const head=`<div class="card-hd"><div class="rule"></div>
    <div class="lbl"><span>추천</span></div></div>`;
  if(draft.cycle==='주기성') return recRecurring(head);
  const okDays=rangeDays(draft.from,draft.to).filter(d=>dayCheck(draft,d).ok);
  if(!okDays.length) return `<div class="card">${head}
    <div class="empty">추천할 날짜가 없습니다.</div></div>`;
  const room=d=>(draft.ch.includes('배너')?bannerRem(d):999)+(draft.offer==='쿠폰'?couponRem(d):999);
  const roomy=[...okDays].sort((a,b)=>room(b)-room(a))[0];
  const freest=[...okDays].sort((a,b)=>dayCheck(draft,b).free.length-dayCheck(draft,a).free.length)[0];
  const soon=okDays[0];
  const uniq=[...new Set([soon,roomy,freest])];
  const label={[soon]:'가장 빠른 날',[roomy]:'캐파가 가장 여유로운 날',[freest]:'시간대가 가장 많이 빈 날'};
  return `<div class="card">${head}
    <div class="recs">${uniq.map(d=>`<div class="rec-card">
      <div class="rt">${fmtD(d)}</div>
      <div class="rl">${label[d]}<br>빈 시간대 ${dayCheck(draft,d).free.length}개</div>
      <button data-rec="${d}">이 날짜 보기</button></div>`).join('')}</div>
  </div>`;
}

/* 주기성 추천 — 기간이 고정이므로 '쓸 수 있는 시간대'와 '충돌 없는 시작일'을 제안 */
function recRecurring(head){
  const pc=periodCheck(draft);
  const cards=[];
  pc.hours.filter(x=>x.free&&x.h!==draft.hour).forEach(x=>cards.push({
    t:`${x.h}:00`, l:'기간 내내 비어 있는 시간대', act:`data-rh="${x.h}"`, btn:'이 시간대로'}));

  /* 지금 고른 시간대가 막혔다면, 같은 길이로 충돌 없는 가장 빠른 시작일 */
  const sel=pc.hours.find(x=>x.h===draft.hour);
  if(sel&&!sel.free){
    const len=pc.days.length;
    for(const x of ALL){
      if(x.d<=TODAY) continue;
      const to=addDays(x.d,len-1);
      if(to>'2026-09-30') break;
      const cand={...draft,from:x.d,to};
      const c=periodCheck(cand);
      const hh=c.hours.find(y=>y.h===draft.hour);
      if(c.ok&&hh&&hh.free){
        cards.push({t:`${fmtD(x.d)} 시작`, l:`${draft.hour}시로 ${len}일간 신청 가능`,
          act:`data-rf="${x.d}"`, btn:'이 기간으로'});
        break;
      }
    }
  }
  if(!cards.length) return `<div class="card">${head}
    <div class="empty">현재 조건이 가장 적절합니다.</div></div>`;
  return `<div class="card">${head}
    <div class="recs">${cards.slice(0,3).map(c=>`<div class="rec-card">
      <div class="rt">${c.t}</div><div class="rl">${c.l}</div>
      <button ${c.act}>${c.btn}</button></div>`).join('')}</div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   캠페인 상태 정의
   ══════════════════════════════════════════════════════════════════════

   ── 확정 대기 ──
   신청 가능한 일정과 캐파 내 범위에 신청한 캠페인. 담당자의 '확정'을 기다린다.

   ── 조정 필요 ──  두 경로로 들어오고, 이후 흐름은 같다
     (1) 마케터가 선점된 시간대에 신청하며 '조정 요청'      (adjBy 'mkt')
     (2) 담당자가 확정 대기 건을 '조정 필요'로 넘김          (adjBy 'adm')
   두 경우 모두
     · 마케터  — 캠페인 신청하기 메인에 '조정 필요' 한 건 증가
     · 담당자  — 캠페인 관리하기에 '조정 필요' 한 건 증가
   → 관계자들과 일정 협의 (시스템 밖)
   → 담당자가 셋 중 하나로 처리
       1) 일정 조정 — 빈자리로 옮기기
       2) 선점 건 이동 + 조정 요청 건 수락
       3) 신청 취소

   ── 확정 ──
   담당자가 확정 대기 건을 '확정'함.

   ── 취소 ──
   담당자가 논의 없이 마케터의 신청을 임의로 취소하지 못하게 두 갈래로만 연다.
     1. 마케터 — 확정 이전(확정 대기 · 조정 필요) 본인 건을 스스로 철회. 사유 없음
     2. 담당자 — 조정 요청이 들어온 건만, 당사자와 논의한 뒤 담당자 탭에서 취소. 사유 필수
   확정된 건은 어느 쪽도 손대지 않는다. 이미 캐파와 시간대가 잡혀 있어
   담당자와 협의해 처리한다 (0728 미팅: "취소는 보통 안 하긴 해요 …
   급히 취소하는 경우에는 시스템상에서 캠페인을 중단하거나").
   그래서 '사유가 남아 있으면 담당자 취소'가 성립한다 — 담당자 취소는 논의 결과라
   사유가 필수이고, 마케터 취소는 스스로 철회라 사유를 받지 않는다.

   ── 발송 완료 ──
   실제 발송이 끝난 뒤 발송 시스템이 찍는 상태. 이 대시보드는 그 전이를 만들지 않고
   더미 데이터로만 존재한다.
   ══════════════════════════════════════════════════════════════════════ */
const CANCELABLE=['신청','조정 필요'];

/* 확정 전인 건을 신청 폼으로 불러온다 (조정 필요 패널·리스트 상세 공통) */
function editReq(no){
  const r=requests.find(q=>q.no===no); if(!r) return;
  Object.assign(draft,{cycle:r.cycle,from:r.from,to:r.to,ch:[...r.ch],gnb:r.gnb,
    offer:r.offer,qty:r.qty,camp:r.camp,dept:r.team,mk:r.mk,note:r.note||'',
    date:r.cycle==='주기성'?r.from:r.date,hour:r.hour,editNo:r.no});
  adjOpen=false; found=true; tab='apply';
  $('modalSlot').innerHTML='';
  toast(`수정 중 — ${r.camp}`); render();
}
const canCancel=r=>role==='mkt'&&CANCELABLE.includes(r.status)&&r.mk===ME.mk&&r.team===ME.team;

function cancelModal(no,ask){
  const r=requests.find(q=>q.no===no); if(!r) return;
  const ok=canCancel(r);
  $('modalSlot').innerHTML=`<div class="modal"><div class="box">
    <h3>${ask?'이 신청을 취소하시겠습니까?':esc(r.camp)}</h3>
    <div class="m-sub">${ask
      ? '취소하면 신청이 철회되고, 해당 날짜의 캐파와 시간대가 다시 예약 가능 상태로 변경됩니다. 이 작업은 되돌릴 수 없습니다.'
      : r.status==='확정' ? (r.moved
          ? `협의에 따라 담당자가 일정을 조정했습니다. (${r.moved.from} → ${r.moved.to})`
          : '확정된 캠페인입니다. 일정을 바꾸려면 담당자에게 문의해 주세요.')
      : r.status==='발송 완료' ? '발송이 완료된 캠페인입니다.'
      : r.status==='취소' ? (r.admNote
          ? '담당자가 취소한 캠페인입니다. 사유를 확인하고 필요하면 새로 신청해 주세요.'
          : '취소된 캠페인입니다.')
      : r.status==='조정 필요' ? (r.adjBy==='adm'
          ? '담당자가 조정을 요청했습니다. 사유를 확인하고 수정해 주세요.'
          : '담당자가 시간대를 조정하고 있습니다.')
      : '담당자 확정을 기다리는 중입니다.'}</div>
    <div class="herocard">
      ${ask?hrow('캠페인명',r.camp):''}
      ${hrow('상태',r.status==='신청'?'확정 대기':r.status)}
      ${hrow('기간',`${fmtD(r.from)} ~ ${fmtD(r.to)}`)}
      ${hrow('발송 일시',r.cycle==='주기성'?`기간 내 매일 ${r.hour}:00`:`${fmtD(r.date)} ${r.hour}:00`)}
      ${hrow('채널 / GNB',`${r.ch.join(' · ')||'—'} / ${r.gnb||'—'}`)}
      ${hrow('주기 / 오퍼',`${r.cycle} / ${r.offer}`)}
      ${hrow(r.cycle==='주기성'?'1일 타겟수':'전체 타겟수',`${man(r.qty)}만 건`)}
      ${hrow('부서 · 마케터',`${r.team} ${r.mk}`)}
      ${r.status==='취소'&&r.admNote?hrow('취소 사유',r.admNote):''}
      ${r.moved?hrow('일정 조정',`${r.moved.from} → ${r.moved.to}`):''}
      ${r.reason?hrow('사유',r.reason+(r.note?` — ${r.note}`:'')):''}
    </div>
    <div class="m-act">
      <button class="pill ghost" id="cNo">${ask?'돌아가기':'닫기'}</button>
      ${ok&&!ask?`<button class="pill ghost" id="cEdit">수정하기</button>`:''}
      ${ok?`<button class="pill danger" id="cYes">신청 취소</button>`:''}
    </div></div></div>`;
  if(ok) $('cYes').onclick=()=>{
    if(!ask) return cancelModal(no,true);
    r.status='취소'; r.reason=''; r.note=''; r.admNote='';
    $('modalSlot').innerHTML='';
    toast(`신청을 취소했습니다 — ${r.camp}`,true);
    render();
  };
  if(ok&&!ask) $('cEdit').onclick=()=>editReq(no);
  $('cNo').onclick=()=>$('modalSlot').innerHTML='';
}

  $('mNo').onclick=()=>$('modalSlot').innerHTML='';
  $('mYes').onclick=()=>{
    /* 일회성은 시작일에 1회 발송한다 — 고른 날이 곧 캠페인 시작일이다.
       노출 기간의 길이는 마케터가 입력한 그대로 유지하고, 기간을 통째로 옮긴다. */
    const rep=draft.cycle==='주기성', len=rangeDays(draft.from,draft.to).length;
    const from=rep?draft.from:draft.date;
    const to  =rep?draft.to  :addDays(from,len-1);
    const body={camp:draft.camp,from,to,ch:[...draft.ch],gnb:draft.gnb,
      cycle:draft.cycle,offer:draft.offer,qty:draft.qty,team:draft.dept,mk:draft.mk,
      date:draft.date,hour:draft.hour,
      status:c?'조정 필요':'신청', adjBy:c?'mkt':null,
      reason:c?`${c.camp} (${c.team} ${c.mk}) 선점`:'',
      note:c?draft.note.trim():'', admNote:'',
      reqAt:`${TODAY} ${(()=>{const t=new Date();
        return `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`})()}`};
    const ex=draft.editNo!=null?requests.find(r=>r.no===draft.editNo):null;
    if(ex) Object.assign(ex,body); else requests.push(mkReq(body));
    $('modalSlot').innerHTML='';
    toast(ex ? `수정되었습니다 — ${body.camp}`
             : c ? `조정 요청되었습니다 — ${c.camp} 선점`
                 : `신청되었습니다 — ${fmtD(draft.date)} ${draft.hour}:00`, !!c);
    draft.camp=''; draft.note=''; draft.date=null; draft.hour=null; draft.editNo=null;
    scope='mine'; render();
  };
}

/* ── 캠페인 신청 탭 이벤트 바인딩 ── */
function syncCycleTarget(){
  if(draft.cycle==='주기성'){draft.date=draft.from;draft.hour=REC_HOURS[0]}
  else{draft.date=null;draft.hour=null}
}
function bindApply(){
  const re=()=>{$('page').innerHTML=renderApply();bindApply()};
  $('fFrom').onchange=e=>{draft.from=e.target.value;if(draft.to<draft.from)draft.to=draft.from;
    syncCycleTarget();re()};
  $('fTo').onchange=e=>{draft.to=e.target.value;if(draft.to<draft.from)draft.from=draft.to;
    syncCycleTarget();re()};
  document.querySelectorAll('[data-ch]').forEach(x=>x.onchange=()=>{
    const v=x.dataset.ch, i=draft.ch.indexOf(v);
    if(x.checked){if(i<0)draft.ch.push(v)} else if(i>=0){draft.ch.splice(i,1)}
    syncCycleTarget();re()});
  document.querySelectorAll('[data-cy]').forEach(x=>x.onchange=()=>{draft.cycle=x.dataset.cy;
    if(draft.cycle==='주기성'){draft.date=draft.from;draft.hour=REC_HOURS[0]}
    else{draft.date=null;draft.hour=null}
    re()});
  document.querySelectorAll('[data-of]').forEach(x=>x.onchange=()=>{draft.offer=x.dataset.of;
    draft.date=null;draft.hour=null;re()});
  $('fGnb').oninput=e=>draft.gnb=e.target.value;
  $('fQty').oninput=e=>{draft.qty=Math.max(0,+e.target.value||0)};
  $('findBtn').onclick=()=>{
    const miss=[];

    if(!draft.cycle)           miss.push('주기');
    if(!draft.offer)           miss.push('오퍼');
    if(!draft.qty)             miss.push('타겟수');
    if(miss.length){toast(`${miss.join(' · ')}를 입력해 주세요.`,true); return}
    found=true;
    if(draft.cycle==='주기성'){draft.date=draft.from;draft.hour=REC_HOURS[0]}
    else{draft.date=null;draft.hour=null}
    re()};
  const rb=$('resetBtn'); if(rb) rb.onclick=()=>{
    const n=draft.editNo; draft=EMPTY_DRAFT(); draft.editNo=n; found=false; re()};

  document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{draft.date=x.dataset.d;draft.hour=null;re()});
  document.querySelectorAll('[data-h]').forEach(x=>x.onclick=()=>{draft.hour=+x.dataset.h;re()});
  document.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{draft.hour=+x.dataset.pick;re()});
  document.querySelectorAll('[data-rec]').forEach(x=>x.onclick=()=>{draft.date=x.dataset.rec;draft.hour=null;re()});
  document.querySelectorAll('[data-rh]').forEach(x=>x.onclick=()=>{draft.hour=+x.dataset.rh;re()});
  document.querySelectorAll('[data-rf]').forEach(x=>x.onclick=()=>{
    const len=rangeDays(draft.from,draft.to).length;
    draft.from=x.dataset.rf; draft.to=addDays(draft.from,len-1);
    draft.date=draft.from; re()});
  document.querySelectorAll('[data-sc]').forEach(x=>x.onclick=()=>{scope=x.dataset.sc;re()});
  document.querySelectorAll('[data-ls]').forEach(x=>x.onclick=()=>{listSt=x.dataset.ls;render()});
  document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>cancelModal(+x.dataset.open,false));
  document.querySelectorAll('[data-cancel]').forEach(x=>x.onclick=e=>{
    e.stopPropagation(); cancelModal(+x.dataset.cancel,true)});
  document.querySelectorAll('[data-km]').forEach(x=>x.onclick=()=>{
    if(x.dataset.km) {kpiMonth=x.dataset.km; re()}});
  document.querySelectorAll('[data-adj]').forEach(x=>x.onclick=()=>{adjOpen=!adjOpen;re()});
  document.querySelectorAll('[data-move]').forEach(x=>x.onclick=()=>editReq(+x.dataset.move));
  const ce=$('cancelEdit'); if(ce) ce.onclick=()=>{
    draft.editNo=null; draft.camp=''; draft.note=''; draft.date=null; draft.hour=null;
    found=false; toast('수정을 취소했습니다. 기존 신청은 그대로 있습니다.'); re()};
  const te=$('takeEarly'); if(te) te.onclick=()=>{
    const es=earliestSlot(draft); if(!es) return;
    draft.date=es.d; draft.hour=es.h; re()};

  const cf=$('fCamp');
  if(cf){
    cf.oninput=e=>draft.camp=e.target.value;
    $('fDept').oninput=e=>draft.dept=e.target.value;
    $('fMk').oninput=e=>draft.mk=e.target.value;
    const nt=$('fNote'); if(nt) nt.oninput=e=>draft.note=e.target.value;
    $('submitBtn').onclick=()=>{
      if(!draft.camp.trim()){toast('캠페인명을 입력해 주세요.',true);cf.focus();return}
      if(conflict()&&!draft.note.trim()){
        toast('조정 요청 사유를 입력해 주세요.',true); if(nt) nt.focus(); return}
      confirmModal();
    };
  }
}

/* ══════════════════════════════════════════════════════════════════════
   페이지 2 — 캘린더

const MONTHS=['2026-07','2026-08','2026-09'];
const monthDayList=m=>ALL.filter(x=>x.d.slice(0,7)===m).map(x=>x.d);
function monthDays(m){
  const [y,mm]=m.split('-').map(Number);
  const first=new Date(y,mm-1,1), lastD=new Date(y,mm,0).getDate();
  const lead=first.getDay(), cells=[];
  for(let i=lead;i>0;i--) cells.push({d:iso(new Date(y,mm-1,1-i)),out:true});
  for(let i=1;i<=lastD;i++) cells.push({d:iso(new Date(y,mm-1,i)),out:false});
  while(cells.length%7) cells.push({d:iso(new Date(y,mm,cells.length-lead-lastD+1)),out:true});
  return cells;
}
/* 채널은 여럿 중 하나(OR), 오퍼는 별개 축이므로 채널과 AND 로 건다 */
const passFilter=r=>{
  if(calFilter.ch.length&&!calFilter.ch.some(c=>r.ch.includes(c))) return false;
  if(calFilter.offer&&r.offer!==calFilter.offer) return false;
  return true;
};
/* 일회성 — 시작·종료 시점만 칸 안에 표기 */
function eventsOn(d){
  const out=[], m=calFilter.mode;
  requests.filter(r=>onCal(r)&&r.cycle!=='주기성'&&passFilter(r)).forEach(r=>{
    if(r.from===d&&m!=='end') out.push({r,t:'start'});
    else if(r.to===d&&m!=='start') out.push({r,t:'end'});
  });
  return out;
}

/* 주기성 — 기간 내내 매일 발송되므로 주 단위로 이어진 바를 그린다 */
function weekSpans(week){
  const a=week[0].d, b=week[6].d, m=calFilter.mode, segs=[];
  requests.filter(r=>onCal(r)&&r.cycle==='주기성'&&passFilter(r)).forEach(r=>{
    if(r.to<a||r.from>b) return;
    if(m==='start'&&!(r.from>=a&&r.from<=b)) return;
    if(m==='end'&&!(r.to>=a&&r.to<=b)) return;
    const si=week.findIndex(x=>x.d===r.from), ei=week.findIndex(x=>x.d===r.to);
    segs.push({r, s:si<0?0:si, e:ei<0?6:ei, head:r.from>=a, tail:r.to<=b});
  });
  const lanes=[];
  segs.forEach(g=>{
    let L=0;
    while(lanes[L]&&lanes[L].some(o=>!(g.e<o.s||g.s>o.e))) L++;
    (lanes[L]=lanes[L]||[]).push(g); g.lane=L;
  });
  return {segs, lanes:lanes.length};
}

        ${[['all','시작+종료'],['start','시작만'],['end','종료만']].map(([k,n])=>

        <span class="sep"></span>

        ${(()=>{const wks=[];for(let i=0;i<cells.length;i+=7)wks.push(cells.slice(i,i+7));
          return wks.map((wk,wi)=>{

            segs.forEach(g=>{for(let i=g.s;i<=g.e;i++) colLanes[i]=Math.max(colLanes[i],g.lane+1)});

            return `<div class="calwk">

              ${segs.length?`<div class="wspans">${segs.map(g=>spanBar(g,wi,wks.length)).join('')}</div>`:''}
            </div>`}).join('')})()}

        <span><i style="background:var(--l1);border-left:2px solid var(--locked-fill)"></i>종료 캠페인</span>
        <span><i style="background:var(--waiting-bg);border-left:2px solid var(--waiting-border)"></i>↻ 주기성 (기간 내 매일 같은 시간)</span>
      </div>
    </div>
  </div>`;
}
function calCell(c,idx,rows,lanes){
  const col=idx%7, row=Math.floor(idx/7);
  const flip=(col>=5?' rt':'')+(row>=rows-2?' up':'');
  const o=dayOf(c.d), evs=c.out?[]:eventsOn(c.d);
  const show=evs.slice(0,3), rest=evs.length-show.length;
  return `<div class="ccell${c.out?' out':''}${o&&o.dow===0?' sun':''}${c.d===TODAY?' today':''}"
      ${c.out?'':`data-cd="${c.d}"`}>
    <div class="cd">${+c.d.slice(8)}</div>
    ${lanes?`<div class="lanegap" style="height:${lanes*22}px"></div>`:''}
    ${show.map(e=>`<div class="ev ${e.rep?'rep':e.t}${flip}">${
        e.rep?'↻ ':e.t==='end'?'▪ ':''}${esc(e.r.camp)}
      <div class="tip"><b>${esc(e.r.camp)}</b>
        <div class="tr"><span>구분</span><span>${e.rep
          ? '주기성 · '+(e.t==='start'?'시작':e.t==='end'?'종료':'발송 중')
          : '일회성 · '+(e.t==='start'?'시작':'종료')}</span></div>
        <div class="tr"><span>기간</span><span>${fmtD(e.r.from)}~${fmtD(e.r.to)}</span></div>
        <div class="tr"><span>채널</span><span>${e.r.ch.join('·')||'—'}</span></div>
        <div class="tr"><span>오퍼</span><span>${e.r.offer}</span></div>
        <div class="tr"><span>${e.rep?'1일 모수':'모수'}</span><span>${man(e.r.qty)}만 건</span></div>
        <div class="tr"><span>발송</span><span>${e.r.hour}:00${e.rep?' 매일':''}</span></div>
        <div class="tr"><span>담당</span><span>${e.r.team} ${e.r.mk}</span></div>
      </div></div>`).join('')}
    ${rest>0?`<div class="cmore">+${rest}건 더</div>`:''}
  </div>`;
}
function spanBar(g,wi,rows){
  const r=g.r, flip=(g.s>=5?' rt':'')+(wi>=rows-2?' up':'');
  return `<div class="ev rep span${g.head?' head':''}${g.tail?' tail':''}${flip}" data-cd="${r.from}"
      style="grid-column:${g.s+1}/${g.e+2};grid-row:${g.lane+1}">↻ ${esc(r.camp)}
    <div class="tip"><b>${esc(r.camp)}</b>
      <div class="tr"><span>구분</span><span>주기성 · 매일 발송</span></div>
      <div class="tr"><span>기간</span><span>${fmtD(r.from)}~${fmtD(r.to)}</span></div>
      <div class="tr"><span>채널</span><span>${r.ch.join('·')||'—'}</span></div>
      <div class="tr"><span>오퍼</span><span>${r.offer}</span></div>
      <div class="tr"><span>1일 모수</span><span>${man(r.qty)}만 건</span></div>
      <div class="tr"><span>발송</span><span>${r.hour}:00 매일</span></div>
      <div class="tr"><span>담당</span><span>${r.team} ${r.mk}</span></div>
    </div></div>`;
}

function chartFor(rows){
  const mDays=monthDayList(calMonth);
  const chStat=CH_LIST.concat('쿠폰').map(c=>{
    const rs=c==='쿠폰'?rows.filter(r=>r.offer==='쿠폰'):rows.filter(r=>r.ch.includes(c));
    /* 모수는 그 달에 실제로 나가는 물량 — 주기성은 걸친 일수만큼 합산 */
    const q=rs.reduce((s,r)=>s+r.qty*mDays.filter(d=>activeOn(d,r)).length,0);
    return {c,n:rs.length,q};
  });
  const maxQ=Math.max(1,...chStat.map(s=>s.q));
  const color={'배너':'var(--ch-banner)','TV팝업':'var(--ch-tv)','토스트팝업':'var(--ch-toast)','쿠폰':'var(--ch-coupon)'};
  const [y,mm]=calMonth.split('-').map(Number), lastD=new Date(y,mm,0).getDate();
  const perDay=[...Array(lastD)].map((_,i)=>{
    const d=iso(new Date(y,mm-1,i+1));
    return {d,q:requests.filter(r=>onCal(r)&&activeOn(d,r)&&passFilter(r)).reduce((s,r)=>s+r.qty,0)};
  });
  const maxD=Math.max(1,...perDay.map(x=>x.q));
  return `<div class="chartbox">
    <div class="cbar">
      ${chStat.map(s=>`<div class="cbrow">
        <div class="cl"><i class="sw" style="background:${color[s.c]}"></i>${s.c}</div>
        <div class="cbtrack"><b style="width:${s.q/maxQ*100}%;background:${color[s.c]}"></b></div>
        <div class="cn">${s.n}건 · ${man(s.q)}만</div></div>`).join('')}
    </div>
    <div class="sparkwrap">
      <div class="st2">일자별 발송 모수</div>
      <div class="spark">${perDay.map(x=>
        `<div class="sb" data-tip="${+x.d.slice(8)}일 · ${man(x.q)}만 건">
          <b style="height:${x.q/maxD*100}%"></b></div>`).join('')}</div>
      <div class="sparkx">${perDay.map((x,i)=>
        `<span>${(i+1)%5===0||i===0?i+1:''}</span>`).join('')}</div>
    </div>
  </div>`;
}
