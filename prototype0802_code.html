      <div class="calnav">
        <button class="arw" id="pm" ${mi<=0?'disabled':''}>‹</button>
        <span class="lab">${calMonth.replace('-','. ')}</span>
        <button class="arw" id="nm" ${mi>=MONTHS.length-1?'disabled':''}>›</button>
        <button class="chip sm" id="todayBtn">오늘</button>
      </div>
      <div class="filters">
        <span class="fl">표시</span>
        ${[['all','시작+종료'],['start','시작만'],['end','종료만']].map(([k,n])=>
          `<button class="chip sm ${calFilter.mode===k?'on':''}" data-m="${k}">${n}</button>`).join('')}
        <span class="sep"></span>
        <span class="fl">채널</span>
        ${CH_LIST.map(c=>
          `<button class="chip sm ${calFilter.ch.includes(c)?'on':''}" data-f="${c}">${c}</button>`).join('')}
        <span class="sep"></span>
        <span class="fl">오퍼</span>
        ${['쿠폰','없음'].map(o=>
          `<button class="chip sm ${calFilter.offer===o?'on':''}" data-fo="${o}">${o}</button>`).join('')}
        ${calFilter.ch.length||calFilter.offer?`<button class="chip sm" data-f="__clear">필터 해제</button>`:''}
      </div>
      <div class="cal">
        <div class="calhd">${WD.map((w,i)=>`<div class="ch${i===0?' sun':''}">${w}</div>`).join('')}</div>
        ${(()=>{const wks=[];for(let i=0;i<cells.length;i+=7)wks.push(cells.slice(i,i+7));
          return wks.map((wk,wi)=>{
            const {segs}=weekSpans(wk);
            const colLanes=[0,0,0,0,0,0,0];
            segs.forEach(g=>{for(let i=g.s;i<=g.e;i++) colLanes[i]=Math.max(colLanes[i],g.lane+1)});
            /* 레인 1개 = 바 19px + 간격 3px (일회성 칩과 같은 높이) */
            return `<div class="calwk">
              <div class="wcells">${wk.map((c,ci)=>calCell(c,wi*7+ci,wks.length,colLanes[ci])).join('')}</div>
              ${segs.length?`<div class="wspans">${segs.map(g=>spanBar(g,wi,wks.length)).join('')}</div>`:''}
            </div>`}).join('')})()}
      </div>
      <div class="legend">
        <span><i style="background:var(--sk-orange-t10);border-left:2px solid var(--sk-orange)"></i>시작 캠페인</span>
        <span><i style="background:var(--l1);border-left:2px solid var(--locked-fill)"></i>종료 캠페인</span>
        <span><i style="background:var(--waiting-bg);border-left:2px solid var(--waiting-border)"></i>↻ 주기성 (기간 내 매일 같은 시간)</span>
      </div>
    </div>
  </div>`;
}
function calCell(c,idx,rows,lanes){
  const col=idx%7, row=Math.floor(idx/7);
  const flip=(col>=5?' rt':'')+(row>=rows-2?' up':'');
  const o=dayOf(c.d), evs=c.out?[]:eventsOn(c.d);
  const show=evs.slice(0,3), rest=evs.length-show.length;
  return `<div class="ccell${c.out?' out':''}${o&&o.dow===0?' sun':''}${c.d===TODAY?' today':''}"
      ${c.out?'':`data-cd="${c.d}"`}>
    <div class="cd">${+c.d.slice(8)}</div>
    ${lanes?`<div class="lanegap" style="height:${lanes*22}px"></div>`:''}
    ${show.map(e=>`<div class="ev ${e.rep?'rep':e.t}${flip}">${
        e.rep?'↻ ':e.t==='end'?'▪ ':''}${esc(e.r.camp)}
      <div class="tip"><b>${esc(e.r.camp)}</b>
        <div class="tr"><span>구분</span><span>${e.rep
          ? '주기성 · '+(e.t==='start'?'시작':e.t==='end'?'종료':'발송 중')
          : '일회성 · '+(e.t==='start'?'시작':'종료')}</span></div>
        <div class="tr"><span>기간</span><span>${fmtD(e.r.from)}~${fmtD(e.r.to)}</span></div>
        <div class="tr"><span>채널</span><span>${e.r.ch.join('·')||'—'}</span></div>
        <div class="tr"><span>오퍼</span><span>${e.r.offer}</span></div>
        <div class="tr"><span>${e.rep?'1일 모수':'모수'}</span><span>${man(e.r.qty)}만 건</span></div>
        <div class="tr"><span>발송</span><span>${hh(e.r.hour)}${e.rep?' 매일':''}</span></div>
        <div class="tr"><span>담당</span><span>${e.r.team} ${e.r.mk}</span></div>
      </div></div>`).join('')}
    ${rest>0?`<div class="cmore">+${rest}건 더</div>`:''}
  </div>`;
}
function spanBar(g,wi,rows){
  const r=g.r, flip=(g.s>=5?' rt':'')+(wi>=rows-2?' up':'');
  return `<div class="ev rep span${g.head?' head':''}${g.tail?' tail':''}${flip}" data-cd="${r.from}"
      style="grid-column:${g.s+1}/${g.e+2};grid-row:${g.lane+1}">↻ ${esc(r.camp)}
    <div class="tip"><b>${esc(r.camp)}</b>
      <div class="tr"><span>구분</span><span>주기성 · 매일 발송</span></div>
      <div class="tr"><span>기간</span><span>${fmtD(r.from)}~${fmtD(r.to)}</span></div>
      <div class="tr"><span>채널</span><span>${r.ch.join('·')||'—'}</span></div>
      <div class="tr"><span>오퍼</span><span>${r.offer}</span></div>
      <div class="tr"><span>1일 모수</span><span>${man(r.qty)}만 건</span></div>
      <div class="tr"><span>발송</span><span>${hh(r.hour)} 매일</span></div>
      <div class="tr"><span>담당</span><span>${r.team} ${r.mk}</span></div>
    </div></div>`;
}

function chartFor(rows){
  const mDays=monthDayList(calMonth);
  const chStat=CH_LIST.concat('쿠폰').map(c=>{
    const rs=c==='쿠폰'?rows.filter(r=>r.offer==='쿠폰'):rows.filter(r=>r.ch.includes(c));
    /* 모수는 그 달에 실제로 나가는 물량 — 주기성은 걸친 일수만큼 합산 */
    const q=rs.reduce((s,r)=>s+r.qty*mDays.filter(d=>activeOn(d,r)).length,0);
    return {c,n:rs.length,q};
  });
  const maxQ=Math.max(1,...chStat.map(s=>s.q));
  const color={'배너':'var(--ch-banner)','TV팝업':'var(--ch-tv)','토스트팝업':'var(--ch-toast)','쿠폰':'var(--ch-coupon)'};
  const [y,mm]=calMonth.split('-').map(Number), lastD=new Date(y,mm,0).getDate();
  const perDay=[...Array(lastD)].map((_,i)=>{
    const d=iso(new Date(y,mm-1,i+1));
    return {d,q:requests.filter(r=>onCal(r)&&activeOn(d,r)&&passFilter(r)).reduce((s,r)=>s+r.qty,0)};
  });
  const maxD=Math.max(1,...perDay.map(x=>x.q));
  return `<div class="chartbox">
    <div class="cbar">
      ${chStat.map(s=>`<div class="cbrow">
        <div class="cl"><i class="sw" style="background:${color[s.c]}"></i>${s.c}</div>
        <div class="cbtrack"><b style="width:${s.q/maxQ*100}%;background:${color[s.c]}"></b></div>
        <div class="cn">${s.n}건 · ${man(s.q)}만</div></div>`).join('')}
    </div>
    <div class="sparkwrap">
      <div class="st2">일자별 발송 모수</div>
      <div class="spark">${perDay.map(x=>
        `<div class="sb" data-tip="${+x.d.slice(8)}일 · ${man(x.q)}만 건">
          <b style="height:${x.q/maxD*100}%"></b></div>`).join('')}</div>
      <div class="sparkx">${perDay.map((x,i)=>
        `<span>${(i+1)%5===0||i===0?i+1:''}</span>`).join('')}</div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   페이지 3 — 캠페인 관리 (담당자)
   · 마케터가 1차 배치해 신청한 건을 확인하고 확정
   · 조정 요청 들어온 건의 일정을 조정해서 확정
   ══════════════════════════════════════════════════════════════════════ */

function renderManage(){
  /* 담당자 화면은 캘린더가 주인공이므로 요약도 같은 축을 쓴다 — 발송 시작일 기준.
     (마케터 화면은 '내가 이 달에 넣은 것'이라 신청일 기준으로 다르다) */
  const ofMonth=r=>r.from.slice(0,7)===kpiMonth;
  const wait=requests.filter(r=>r.status==='신청'&&ofMonth(r));
  const adj =requests.filter(r=>r.status==='조정 필요'&&ofMonth(r));
  const conf=requests.filter(r=>r.status==='확정'&&ofMonth(r));
  const canc=requests.filter(r=>r.status==='취소'&&ofMonth(r));
  /* 지난달에 시작하는데 아직 확정 못 한 건 — 월을 넘겨 놓치지 않도록 알린다 */
  const carry=requests.filter(r=>['신청','조정 필요'].includes(r.status)&&r.from.slice(0,7)<kpiMonth);
  const mi=MONTHS.indexOf(kpiMonth);
  const box=(k,v,hero)=>`<div class="kpi${hero?' hero':''}">
    <div class="k">${k}</div><div class="v num">${v||'—'}</div></div>`;
  return `<div class="wrap wide">
    <div class="kpihd">
      <button class="arw" data-km="${MONTHS[mi-1]||''}" ${mi<=0?'disabled':''}>‹</button>
      <span class="kml num">${kpiMonth.replace('-','. ')}</span>
      <button class="arw" data-km="${MONTHS[mi+1]||''}" ${mi>=MONTHS.length-1?'disabled':''}>›</button>
      <span class="kmn">이 달 발송 ${wait.length+adj.length+conf.length+canc.length}건</span>
      ${carry.length?`<button class="chip sm" data-km="${MONTHS[mi-1]||''}">지난달 미처리 ${carry.length}건</button>`:''}
    </div>
    <div class="kpis">
      ${box('확정 대기',wait.length,wait.length>0)}
      ${box('조정 필요',adj.length,adj.length>0)}
      ${box('확정',conf.length)}
      ${box('취소',canc.length)}
    </div>
    <div class="card">
      <div class="card-hd"><div class="rule"></div>
        <div class="lbl"><span>캠페인 관리</span><span>${kpiMonth.replace('-','.')} 발송 시작</span></div></div>
      ${admCal()}
    </div>
  </div>`;
}

/* 발송 시작일 기준 월간 캘린더.
   칸마다 그 날 소진되는 캐파와, 그 날 시작하는 캠페인을 신청순으로 보여준다. */
function admCal(){
  const cells=monthDays(kpiMonth);
  /* 발송 완료는 이미 나간 건 — 확정과 섞이지 않게 따로 본다 */
  const dot=s=>s==='신청'?'wait':s==='조정 필요'?'need'
    :s==='취소'?'canc':s==='발송 완료'?'sent':'conf';
  const wks=[]; for(let i=0;i<cells.length;i+=7) wks.push(cells.slice(i,i+7));
  return `<div class="cal">
    <div class="calhd">${WD.map((w,i)=>`<div class="ch${i===0?' sun':''}">${w}</div>`).join('')}</div>
    ${wks.map(wk=>`<div class="calrow">${wk.map(c=>{
      if(c.out) return `<div class="ccell out"></div>`;
      const d=c.d, o=dayOf(d);
      /* 그 날 시작하는 건. 확정된 건은 발송 시각 순, 아직 처리 못 한 건은
         신청 순으로 아래에 따로 모은다 (0801 피드백) */
      const day=requests.filter(r=>r.status!=='취소'&&r.from===d);
      const done=day.filter(r=>r.hour!=null).sort((a,b)=>a.hour-b.hour);
      const todo=day.filter(r=>r.hour==null).sort((a,b)=>a.reqAt<b.reqAt?-1:1);
      /* 요약 숫자는 '마케터가 신청한 값' 그대로 — 아래 나열한 건들의 합과 같아야 한다.
         캐파 판정(live)에서는 조정 필요를 빼지만, 이 요약에서는 더해서 보여준다. */
      const bu=appliedOn(d,q=>q.ch.includes('배너'));
      const cu=appliedOn(d,q=>q.offer==='쿠폰');
      /* 빨강은 '이 날 조정이 필요한 건이 있다'는 신호다 */
      const adj=requests.filter(q=>q.status==='조정 필요'&&activeOn(d,q));
      const bOver=adj.some(q=>q.ch.includes('배너'));
      const cOver=adj.some(q=>q.offer==='쿠폰');
      return `<div class="ccell${d===TODAY?' today':''}${o&&o.dow===0?' sun':''}">
        <div class="cd num">${+d.slice(8)}</div>
        <div class="ccap">
          <span class="${bOver?'over':''}">배너 <b>${man(bu)}</b>/${man(CAPA['배너'].limit)}만</span>
          <span class="${cOver?'over':''}">쿠폰 <b>${man(cu)}</b>/${man(CAPA['쿠폰'].limit)}만</span>
        </div>
        ${(()=>{const on=requests.filter(r=>live(r)&&activeOn(d,r)&&r.from!==d).length;
          return on?`<div class="cgo">진행 중 ${on}건</div>`:''})()}
        ${done.map(r=>`<div class="crow ${dot(r.status)}" data-am="${r.no}"
            title="${esc(r.camp)} · ${r.status}">
          <i></i><span class="cn">${esc(r.camp)}</span>
          <span class="cq num">${man(r.qty)}만</span>
          <span class="cs num">${hh(r.hour)}</span>
        </div>`).join('')}
        ${done.length&&todo.length?`<div class="csep"></div>`:''}
        ${todo.map(r=>`<div class="crow ${dot(r.status)}" data-am="${r.no}">
          <i></i><span class="cn">${esc(r.camp)}</span>
          <span class="cq num">${man(r.qty)}만</span>
          <span class="cs">${r.status==='신청'?'확정 대기':r.status}</span>
        </div>`).join('')}
      </div>`}).join('')}</div>`).join('')}
  </div>`;
}

/* ── 캐파가 모자랄 때 자리를 만드는 길 (0731 플로우를 캐파 기준으로 옮긴 것) ──
   0731 은 '그 시간대를 잡은 한 건'을 자동으로 찾아왔지만, 지금 제약은 하루 캐파라
   자리를 차지한 건이 하나로 특정되지 않는다. 그래서 그 날 건들을 세우고 담당자가 고른다. */

/* 어느 채널이 얼마나 모자란지 — 기간 중 가장 빠듯한 날 기준.
   배너와 쿠폰이 함께 넘칠 수 있으므로 채널별로 따로 돌려준다. */
function shortOf(r,span){
  const out=[];
  const scan=(name,remFn)=>{
    let amt=0, worst=span[0];
    span.forEach(d=>{const g=r.qty-remFn(d); if(g>amt){amt=g; worst=d}});
    if(amt>0) out.push({ch:name,amt,d:worst});
  };
  if(r.ch.includes('배너')) scan('배너',bannerRem);
  if(r.offer==='쿠폰')      scan('쿠폰',couponRem);
  return out;
}

/* 그 날 캐파를 쓰고 있는 다른 건들 — 하나를 옮기면 자리가 난다 */
function moversOn(r,span,byHour){
  return requests.filter(q=>q.no!==r.no&&live(q)&&q.status!=='조정 필요'
      /* 옮기는 중인 건은 이미 그 날·그 시간에서 빠졌어도 목록에 남겨 둔다 */
      &&(q.no===admSwap.no||span.some(d=>activeOn(d,q)))
      &&(byHour
          ? REC_HOURS.includes(swapView(q).hour)&&slotClash(r,q)
          : (r.ch.includes('배너')&&q.ch.includes('배너'))||(r.offer==='쿠폰'&&q.offer==='쿠폰')))
    .sort((a,b)=>byHour?(swapView(a).hour-swapView(b).hour):(b.qty-a.qty));
}

function moverList(r,span,byHour){
  const ms=moversOn(r,span,byHour);
  if(!ms.length) return '';
  return `<div class="movers">
    <div class="mvhd">확정 건 일정 변경</div>
    ${ms.map(q=>`<div class="mv${admSwap.no===q.no?' on':''}">
      <span class="mvn">${esc(q.camp)}</span>
      <span class="mvq num">${man(q.qty)}만</span>
      <span class="mvt num">${hh(swapView(q).hour)}</span>
      <button class="pill ghost sm" data-swapon="${q.no}">일정 조정</button>
    </div>${admSwap.no===q.no?swapPanel(r,q,span):''}`).join('')}</div>`;
}

/* 비켜 줄 건의 새 자리 — 여기서 고르면 캐파 계산이 바로 옮긴 결과로 바뀐다 */
function swapPanel(r,hd,rSpan){
  const rep=hd.cycle==='주기성', hours=rep?REC_HOURS:HOURS;
  const n=rangeDays(hd.from,hd.to).length||1;
  const to=admSwap.from||hd.from;
  const hSpan=rangeDays(to,addDays(to,n-1));
  const sel=admSwap.hour!=null?admSwap.hour:(hd.hour??hours[0]);
  /* 옮길 자리의 시간대 현황 — 자기 자신과 조정 요청 건은 빼고 센다 */
  const hAt={};
  hours.forEach(h=>hAt[h]=hSpan.reduce((n,d)=>n+requests.filter(q=>
    inScope(q)&&q.no!==hd.no&&activeOn(d,q)&&swapView(q).hour===h&&slotClash(hd,q)).length,0));
  /* 날짜를 옮겨도, 시간만 옮겨도 자리가 난다 — 17~19시가 다 찬 경우는 시간만 바꾸면 된다 */
  const moved=to!==hd.from, movedH=admSwap.hour!=null&&admSwap.hour!==hd.hour;
  const changed=moved||movedH;
  /* 옮길 자리가 이 건을 받아낼 수 있나 (swapView 가 이미 옮긴 것으로 세고 있다) */
  const badTo=hSpan.some(d=>(hd.ch.includes('배너')&&bannerRem(d)<0)
                          ||(hd.offer==='쿠폰'&&couponRem(d)<0));
  /* 옮기고 나면 조정 요청 건이 들어가나 */
  const fits=!rSpan.some(d=>(r.ch.includes('배너')&&bannerRem(d)<r.qty)
                          ||(r.offer==='쿠폰'&&couponRem(d)<r.qty));
  return `<div class="swap">
    <div class="fixrow"><span>옮길 기간</span>
      <div class="fdates">
        <input type="date" id="swFrom" value="${to}" min="${TODAY}" max="2026-09-30">
        <span class="tl">~ <b>${fmtD(addDays(to,n-1))}</b> · ${n}일${rep?' 매일 발송':''}</span>
        ${moved?`<span class="tl moved">지금은 ${fmtD(hd.from)} ~ ${fmtD(hd.to)}</span>`:''}
      </div></div>
    <div class="fixrow"><span>${capLabel(hd)}</span>${gaugeRow(hSpan[0],hd,0,'')}</div>
    <div class="fixrow"><span>시간대</span>
      <div class="hgrid ${rep?'rec3':'adm'}">${hours.map(h=>
        `<div class="hslot ${hAt[h]?'busy':''}${h===sel?' on':''}" data-swh="${h}">
          <span class="hh">${h}시</span>
          <span class="hs">${h===sel?`선택`:hAt[h]?`${hAt[h]}건`:`가능`}</span></div>`).join('')}</div></div>
    ${badTo?`<div class="blockbox"><b>옮길 날짜도 캐파를 넘습니다</b>
      <div>다른 날짜를 골라 주세요.</div></div>`:''}
    <div class="adjbtns">
      <button class="pill primary sm" data-swapok="${hd.no}"
        ${changed&&!badTo&&fits?'':'disabled'}>두 건 함께 확정</button>
      <button class="pill ghost sm" data-swapno="1">되돌리기</button>
      ${!changed?`<span class="note">옮길 날짜나 시간을 골라 주세요.</span>`
        :fits?'':`<span class="note">아직 자리가 모자랍니다.</span>`}
    </div></div>`;
}

/* ── 담당자 처리 팝업 ──
   상태에 따라 할 수 있는 일만 보여준다.
     확정 대기 · 조정 필요 → 발송일·시간대를 정해 확정 (필요하면 신청 취소)
     확정                  → 일정만 다시 조정
   신청한 날과 달라지면 moved 에 남겨 마케터가 바뀐 것을 알 수 있게 한다. */
function admModal(no,st){
  const r=requests.find(q=>q.no===no); if(!r) return;
  if(r.status==='취소'||r.status==='발송 완료') return cancelModal(no,false);
  admFix.no=no;                       /* 이 건은 잔여 계산에서 뺀다 */
  const rep=r.cycle==='주기성', hours=rep?REC_HOURS:HOURS;
  const len=rangeDays(r.from,r.to).length||1;
  const s=st||{from:r.from,hour:r.hour,ask:false,why:''};
  const span=rep?rangeDays(s.from,addDays(s.from,len-1)):[s.from];
  /* 같은 시각에 같은 채널로 이미 배정된 건수 — 잠그지 않고 참고로만 보여준다.
     시스템이 막는 제약은 일 캐파 하나뿐이다 (0730 담당자 확인) */
  const at={};
  hours.forEach(h=>at[h]=span.reduce((n,d)=>n+requests.filter(q=>
    inScope(q)&&activeOn(d,q)&&swapView(q).hour===h&&slotClash(r,q)).length,0));
  const sel=s.hour!=null?s.hour:(r.hour??hours[0]);
  const moved=s.from!==r.from;
  /* 자기 자신을 뺀 잔여로 본다 — 이 건을 그 날에 넣을 수 있나 */
  const overCap=span.some(d=>(r.ch.includes('배너')&&bannerRem(d)<r.qty)
                           ||(r.offer==='쿠폰'&&couponRem(d)<r.qty));
  const done=r.status==='확정';
  /* 확정 건은 요약만 보여준다. 이미 자리를 잡은 건이라 캐파·시간대를 늘어놓을 이유가 없고,
     여는 이유는 대개 조정 요청 건에 자리를 내주려는 것이다 — 그때 '수정하기'로 펼친다. */
  const edit=!done||!!s.edit;
  /* 자리를 비켜 줄 건을 고르는 중이면 목록을 열어 두고, 단독 확정은 막는다 */
  const swapOn=admSwap.no!=null&&requests.some(q=>q.no===admSwap.no);
  /* 주기성은 17~19시에서만 배정한다. 세 칸이 다 차 있으면 담당자가 한 건을 옮길 수 있게 한다.
     시간대는 제약이 아니므로(0730 담당자 확인) 막지 않고 알려만 준다. */
  const hourJam=!overCap&&rep&&hours.every(h=>at[h]>0);

  if(s.ask) return $('modalSlot').innerHTML=`<div class="modal"><div class="box">
      <h3>이 신청을 취소하시겠습니까?</h3>
      <div class="m-sub">취소하면 해당 날짜의 캐파가 다시 확보됩니다. 이 작업은 되돌릴 수 없습니다.</div>
      <div class="herocard">
        ${hrow('캠페인명',r.camp)}
        ${hrow('부서 · 마케터',`${r.team} ${r.mk}`)}
        ${hrow('발송 기간',`${fmtD(r.from)} ~ ${fmtD(r.to)}`)}
        ${hrow(rep?'1일 타겟수':'전체 타겟수',`${man(r.qty)}만 건`)}
      </div>
      <div class="reasonfld" style="margin-top:14px">
        <label>취소 사유</label>
        <textarea id="amWhy" rows="2"
          placeholder="예: 마케터와 협의해 이번 건은 진행하지 않기로 했습니다">${esc(s.why)}</textarea>
      </div>
      <div class="m-act">
        <button class="pill ghost" id="amBack">돌아가기</button>
        <button class="pill danger" id="amCancelOk">신청 취소</button>
      </div></div></div>`, bindAm(no,s);

  $('modalSlot').innerHTML=`<div class="modal"><div class="box wide">
    <h3>${esc(r.camp)}</h3>
    <div class="m-sub">${r.team} ${r.mk} · 신청 ${fmtReq(r.reqAt)}
      <span class="st ${r.status==='신청'?'applied':r.status==='조정 필요'?'needfix':'confirmed'}"
        style="margin-left:8px">${r.status==='신청'?'확정 대기':r.status}</span></div>
    <div class="herocard">
      ${hrow('신청 기간',`${fmtD(r.from)} ~ ${fmtD(r.to)} · ${len}일`)}
      ${hrow('신청 발송일',rep?`${fmtD(r.from)} 부터 매일`:fmtD(r.from))}
      ${hrow('채널 / GNB',`${r.ch.join(' · ')||'—'} / ${r.gnb||'—'}`)}
      ${hrow('주기 / 오퍼',`${r.cycle} · ${r.offer}`)}
      ${hrow(rep?'1일 타겟수':'전체 타겟수',`${man(r.qty)}만 건`)}
      ${done?hrow('발송 시각',rep?`${hh(r.hour)} 매일`:`${fmtD(r.from)} ${hh(r.hour)}`):''}
      ${r.note?hrow('마케터 사유',r.note):''}
      ${r.reason?hrow('조정 요청',r.reason):''}
    </div>
    ${edit?`
    <div class="fixrow" style="margin-top:14px"><span>발송 기간</span>
      <div class="fdates">
        <input type="date" id="amFrom" value="${s.from}" min="${TODAY}" max="2026-09-30">
        <span class="tl">~ <b>${fmtD(addDays(s.from,len-1))}</b> · ${len}일${
          rep?' 매일 발송':''}</span>
        ${moved?`<span class="tl moved">신청은 ${fmtD(r.from)} ~ ${fmtD(r.to)}</span>`:''}
      </div></div>
    <div class="fixrow"><span>${capLabel(r)}</span>${gaugeRow(span[0],r,r.qty,'이 건')}</div>
    ${overCap?shortOf(r,span).map(g=>
      `<div class="capover">${g.ch} 캐파 ${man(g.amt)}만 초과${
        span.length>1?` · ${fmtD(g.d)}`:''}</div>`).join(''):''}
    <div class="fixrow"><span>시간대</span>
      <div class="hgrid ${rep?'rec3':'adm'}">${hours.map(h=>
        `<div class="hslot ${at[h]?'busy':''}${h===sel?' on':''}" data-amh="${h}">
          <span class="hh">${h}시</span>
          <span class="hs">${h===sel?`선택`:at[h]?`${at[h]}건`:`가능`}</span></div>`).join('')}</div>
    </div>
    ${rep?`<div class="segnote">주기성은 17~19시 중에서 배정합니다.</div>`:''}
    ${hourJam?`<div class="segnote">17~19시가 모두 차 있습니다.</div>`:''}
    ${overCap||hourJam||swapOn?moverList(r,span,hourJam):''}`:''}
    <div class="m-act">
      <button class="pill ghost" id="amNo">닫기</button>
      ${/* 확정 전(확정 대기·조정 필요)은 바로, 확정 건은 '수정하기'를 거친 뒤에만 —
            이미 마케터에게 확정을 알린 건이라 한 단계를 더 둔다 */
        ['신청','조정 필요'].includes(r.status)||(done&&edit)
        ?`<button class="pill ghost" id="amCancel">신청 취소</button>`:''}
      ${done&&!edit
        ?`<button class="pill primary" id="amEdit">수정하기</button>`
        :`<button class="pill primary" id="amOk" ${overCap||swapOn?'disabled':''}>${
            done?'일정 조정':moved?'일정을 조정해 확정':'확정'}</button>`}
    </div></div></div>`;
  bindAm(no,s);
}

function bindAm(no,s){
  const r=requests.find(q=>q.no===no);
  const rep=r.cycle==='주기성', len=rangeDays(r.from,r.to).length||1;
  const close=()=>{admFix.no=null; noSwap(); $('modalSlot').innerHTML=''};
  /* 옮기던 중에 바깥으로 나가면 그 선택도 함께 버린다 (close 가 noSwap 을 한다) */
  bindOverlay(close);

  /* ── 선점 건 일정 조정 (0731 플로우) ── */
  document.querySelectorAll('[data-swapon]').forEach(x=>x.onclick=()=>{
    const hd=requests.find(q=>q.no===+x.dataset.swapon); if(!hd) return;
    admSwap={no:hd.no,from:hd.from,hour:hd.hour}; admModal(no,s)});
  document.querySelectorAll('[data-swh]').forEach(x=>x.onclick=()=>{
    admSwap.hour=+x.dataset.swh; admModal(no,s)});
  document.querySelectorAll('[data-swapno]').forEach(x=>x.onclick=()=>{
    noSwap(); admModal(no,s)});
  const sf=$('swFrom'); if(sf) sf.onchange=e=>{
    admSwap.from=e.target.value<TODAY?TODAY:e.target.value; admModal(no,s)};

  /* 두 건 함께 — 비켜 준 건은 확정을 유지한 채 옮기고, 조정 요청 건은 그 자리에 확정 */
  document.querySelectorAll('[data-swapok]').forEach(x=>x.onclick=()=>{
    const hd=DB.find(+x.dataset.swapok); if(!hd) return;
    const hn=rangeDays(hd.from,hd.to).length||1, hWas=`${fmtD(hd.from)} ~ ${fmtD(hd.to)}`;
    const hf=admSwap.from, ht=addDays(admSwap.from,hn-1);
    const hp={from:hf,to:ht,date:hf,
      moved:{from:hWas,to:`${fmtD(hf)} ~ ${fmtD(ht)}`,by:'adm',peer:r.camp}};
    if(admSwap.hour!=null) hp.hour=admSwap.hour;

    const rWas=`${fmtD(r.from)} ~ ${fmtD(r.to)}`;
    const rp={hour:s.hour!=null?s.hour:(r.hour??(rep?REC_HOURS[0]:HOURS[0])),
      status:'확정',reason:'',note:'',adjBy:null};
    if(s.from!==r.from){const nf=s.from, nt=addDays(s.from,len-1);
      Object.assign(rp,{from:nf,to:nt,date:nf,
        moved:{from:rWas,to:`${fmtD(nf)} ~ ${fmtD(nt)}`,by:'adm'}})}
    /* 두 건은 한 번에 반영한다 — 하나만 들어가면 그 날 캐파가 잠깐 어긋난다 */
    DB.setMany([[hd,hp],[r,rp]]);
    close(); toast(`두 건을 확정했습니다 — ${r.camp} · ${hd.camp} ${fmtD(hd.from)}`); render()});
  const wy=$('amWhy'); if(wy) wy.oninput=e=>s.why=e.target.value;
  const bk=$('amBack'); if(bk) bk.onclick=()=>admModal(no,{...s,ask:false});
  const ck=$('amCancelOk'); if(ck) ck.onclick=()=>{
    if(!s.why.trim()){toast('취소 사유를 입력해 주세요.',true); wy&&wy.focus(); return}
    DB.set(r,{status:'취소',admNote:s.why.trim(),reason:'',adjBy:null});
    close(); toast(`신청을 취소했습니다 — ${r.camp}`,true); render()};
  const nf=$('amFrom'); if(nf) nf.onchange=e=>
    admModal(no,{...s,from:e.target.value<TODAY?TODAY:e.target.value});
  document.querySelectorAll('[data-amh]').forEach(x=>x.onclick=()=>
    admModal(no,{...s,hour:+x.dataset.amh}));
  const cn=$('amCancel'); if(cn) cn.onclick=()=>admModal(no,{...s,ask:true});
  const ed=$('amEdit'); if(ed) ed.onclick=()=>admModal(no,{...s,edit:true});
  const no2=$('amNo'); if(no2) no2.onclick=close;
  const ok=$('amOk'); if(ok) ok.onclick=()=>{
    const hours=rep?REC_HOURS:HOURS;
    const sel=s.hour!=null?s.hour:(r.hour??hours[0]);
    if(sel==null){toast('시간대를 골라 주세요.',true); return}
    const was=`${fmtD(r.from)}${rep?` ~ ${fmtD(r.to)}`:''}`;
    const patch={hour:sel,status:'확정',reason:'',note:'',adjBy:null};
    if(s.from!==r.from){
      const nf=s.from, nt=addDays(s.from,len-1);
      Object.assign(patch,{from:nf,to:nt,date:nf,
        moved:{from:was,to:`${fmtD(nf)}${rep?` ~ ${fmtD(nt)}`:''}`,by:'adm'}});
    }
    DB.set(r,patch);
    close(); toast(`${fmtD(r.from)} ${hh(sel)} 로 확정했습니다 — ${r.camp}`); render()};
}

function bindManage(){
  document.querySelectorAll('[data-km]').forEach(x=>x.onclick=()=>{
    if(x.dataset.km){kpiMonth=x.dataset.km; render()}});
  document.querySelectorAll('[data-am]').forEach(x=>x.onclick=()=>admModal(+x.dataset.am));
}

/* ══════════════════════════════════════════════════════════════════════
   렌더
   ══════════════════════════════════════════════════════════════════════ */
function render(){
  $('roleMkt').classList.toggle('on',role==='mkt');
  $('roleAdm').classList.toggle('on',role==='adm');
  renderTabs();
  if(tab==='apply'){ $('page').innerHTML=renderApply(); bindApply(); }
  else if(tab==='cal'&&calDay){
    $('page').innerHTML=renderDay(calDay);
    $('backCal').onclick=()=>{calDay=null;render()};
    $('prevD').onclick=()=>{calDay=addDays(calDay,-1);calMonth=calDay.slice(0,7);render()};
    $('nextD').onclick=()=>{calDay=addDays(calDay,1);calMonth=calDay.slice(0,7);render()};
    const ah=$('applyHere');
    if(ah) ah.onclick=()=>{
      draft.date=calDay; draft.hour=null;
      if(!draft.qFrom||draft.qFrom>calDay) draft.qFrom=calDay;
      if(!draft.qTo||draft.qTo<calDay) draft.qTo=calDay;
      if(!draft.days) draft.days=1;
      COND.forEach(k=>form[k]=Array.isArray(draft[k])?[...draft[k]]:draft[k]);
      calDay=null; tab='apply'; found=true; render();
    };
  }
  else if(tab==='cal'){
    $('page').innerHTML=renderCal();
    const mi=MONTHS.indexOf(calMonth);
    $('pm').onclick=()=>{calMonth=MONTHS[mi-1];render()};
    $('nm').onclick=()=>{calMonth=MONTHS[mi+1];render()};
    $('todayBtn').onclick=()=>{calMonth=TODAY.slice(0,7);render()};
    document.querySelectorAll('[data-cd]').forEach(x=>x.onclick=()=>{calDay=x.dataset.cd;render()});
    document.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{calFilter.mode=x.dataset.m;render()});
    document.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{
      const v=x.dataset.f;
      if(v==='__clear'){calFilter.ch=[];calFilter.offer=''}
      else{const i=calFilter.ch.indexOf(v); i<0?calFilter.ch.push(v):calFilter.ch.splice(i,1)}
      render()});
    /* 오퍼는 한 번 더 누르면 해제된다 */
    document.querySelectorAll('[data-fo]').forEach(x=>x.onclick=()=>{
      calFilter.offer=calFilter.offer===x.dataset.fo?'':x.dataset.fo; render()});
  }
  else { $('page').innerHTML=renderManage(); bindManage(); }
}
$('roleMkt').onclick=()=>{role='mkt';$('roleMkt').classList.add('on');$('roleAdm').classList.remove('on');
  if(tab==='manage') tab='apply'; render()};
$('roleAdm').onclick=()=>{role='adm';$('roleAdm').classList.add('on');$('roleMkt').classList.remove('on');
  tab='manage'; render()};

/* 먼저 더미로 한 번 그려서 화면이 비지 않게 하고, 서버가 있으면 받아서 다시 그린다.
   실시간 변경도 같은 자리로 들어온다 (DB.onChange → render). */
DB.onChange(()=>{if(DB.isRemote()&&DB.isReady()) render()});
render();
if(DB.isRemote()) DB.connect().then(ok=>{
  if(ok) console.log('[DB] 서버 연결 · 실시간 구독 시작');
}).catch(e=>{console.error('[DB] 연결 실패',e);
  toast('서버에 연결하지 못해 로컬 데이터로 표시합니다.',true)});
</script>
</body>
</html>
