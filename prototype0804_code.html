      <h2>${(()=>{const mi=MONTHS.indexOf(kpiMonth);
          return `<span class="monthnav">
            <button class="arw sm" data-km="${MONTHS[mi-1]||''}" ${mi<=0?'disabled':''}>‹</button>
            <span class="mlab num">${kpiMonth.replace('-','.')}</span>
            <button class="arw sm" data-km="${MONTHS[mi+1]||''}" ${mi>=MONTHS.length-1?'disabled':''}>›</button>
          </span>`})()}
        ${role==='mkt'?`<span class="tabs">${[['mine','내 신청'],['team','우리 팀'],['all','전체']].map(([k,n])=>
          `<button data-sc="${k}" class="${scope===k?'on':''}">${n}</button>`).join('')}</span>`:''}</h2>
      <div class="stfil">${ST.map(([k,n])=>{
        const c=k==='all'?base.length:base.filter(r=>r.status===k).length;
        return `<button class="chip sm ${listSt===k?'on':''}" data-ls="${k}" ${c?'':'disabled'}>
          ${n}<span class="num">${c}</span></button>`}).join('')}</div></div>
    <div class="tblwrap"><table class="list">
      <tr><th>캠페인명</th><th>기간</th><th>발송 일시</th><th>채널</th><th>GNB</th>
        <th>주기</th><th>오퍼</th><th class="r">타겟수</th><th>부서 · 마케터</th>
        <th>신청 시각</th><th>상태</th><th>사유</th></tr>
      ${(listAll?rows:rows.slice(0,LIST_N)).map(r=>`<tr class="rw clk" data-open="${r.no}">
        <td class="nm">${esc(r.camp)}</td>
        <td>${fmtD(r.from)} ~ ${fmtD(r.to)}</td>
        <td${r.moved?` class="adjd" data-tip="신청 ${esc(r.moved.from)} → 확정 ${esc(r.moved.to)}"`:''}>${
          fmtD(r.date)} ${hh(r.hour)}</td>
        <td>${r.ch.join('·')}</td><td>${esc(r.gnb)}</td>
        <td>${r.cycle}</td><td>${r.offer}</td>
        <td class="r">${man(r.qty)}만</td>
        <td>${r.team} ${r.mk}</td>
        <td class="num">${fmtReq(r.reqAt)}</td>
        <td><span class="st ${r.status==='신청'?'applied':r.status==='조정 필요'?'needfix'
             :r.status==='취소'?'cancel':r.status==='발송 완료'?'sent':'confirmed'}${
             r.status==='확정'&&r.moved?' diff':''}"${
             r.status==='확정'&&r.moved?` title="신청 ${esc(r.moved.from)} → 확정 ${esc(r.moved.to)}"`:''
             }>${r.status==='신청'?'확정 대기':r.status}</span></td>
        <td class="rsn">${(()=>{
          /* 윗줄 = 이 사유가 누구 것인지, 아랫줄 = 사유 설명 */
          const cancByAdm=r.status==='취소'&&r.admNote;
          const adm=false;
          const from=cancByAdm?'담당자 취소':r.moved?'담당자 일정 변경':adm?'담당자 사유':r.reason;
          const txt =cancByAdm?r.admNote
                    :r.moved?`${r.moved.from} → ${r.moved.to}`
                    :adm?r.admNote:r.note;
          return from?`<span class="src">${esc(from)}</span>${txt?`<br>${esc(txt)}`:''}`:'—'})()}</td>
        </tr>`).join('')}
    </table></div>
    ${rows.length>LIST_N?`<div class="listmore"><button class="pill ghost sm" id="listMore">${
      listAll?'접기':`전체 보기 · 남은 ${rows.length-LIST_N}건`}</button></div>`:''}
    ${rows.length?'':'<div class="empty">해당하는 캠페인이 없습니다.</div>'}
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   캠페인 상태 정의
   ══════════════════════════════════════════════════════════════════════

   ── 확정 대기 ──
   신청 가능한 일정과 캐파 내 범위에 신청한 캠페인. 담당자의 '확정'을 기다린다.

   ── 조정 필요 ──
   원하는 날의 일 캐파가 모자라는데도 그 날을 유지하고 싶어 마케터가 '조정 요청'한 건.
     · 마케터  — 캠페인 신청 메인에 '조정 필요' 한 건 증가
     · 담당자  — 캠페인 관리하기에 '조정 필요' 한 건 증가
   → 관계자들과 협의 (시스템 밖)
   → 담당자가 둘 중 하나로 처리
       1) 일정 변경 — 발송일·시간대를 정해 확정
       2) 신청 취소 — 사유 필수

   ── 확정 ──
   담당자가 확정 대기 건을 '확정'함.

   ── 취소 ──
   담당자가 논의 없이 마케터의 신청을 임의로 취소하지 못하게 두 갈래로만 연다.
     1. 마케터 — 확정 이전(확정 대기 · 조정 필요) 본인 건을 스스로 철회. 사유 없음
     2. 담당자 — 당사자와 논의한 뒤 담당자 탭에서 취소. 사유 필수
          확정 대기 · 조정 필요 : 팝업에서 바로
          확정               : '수정하기'를 눌러 편집으로 들어간 뒤에만
   확정 건에 한 단계를 더 두는 이유는 이미 마케터에게 확정을 알린 건이기 때문이다
   (0728 미팅: "취소는 보통 안 하긴 해요 … 급히 취소하는 경우에는 시스템상에서
   캠페인을 중단하거나"). 마케터는 확정된 본인 건을 스스로 내리지 못한다.
   그래서 '사유가 남아 있으면 담당자 취소'가 성립한다 — 담당자 취소는 논의 결과라
   사유가 필수이고, 마케터 취소는 스스로 철회라 사유를 받지 않는다.

   ── 발송 완료 ──
   실제 발송이 끝난 뒤 발송 시스템이 찍는 상태. 이 대시보드는 그 전이를 만들지 않고
   더미 데이터로만 존재한다.
   ══════════════════════════════════════════════════════════════════════ */
const CANCELABLE=['신청','조정 필요'];

/* 확정 전인 건을 신청 폼으로 불러온다 (조정 필요 패널·리스트 상세 공통) */
function editReq(no){
  const r=requests.find(q=>q.no===no); if(!r) return;
  const len=rangeDays(r.from,r.to).length||1;
  /* 수정은 대개 '날짜를 옮기려고' 들어온다. 조회 기간을 원래 시작일 하루로 좁히면
     달력에 그 하루만 떠서 옮길 곳이 안 보였다 (0802 UT). 앞뒤로 일주일씩 열어 둔다. */
  const qF=(x=>x<TODAY?TODAY:x)(addDays(r.from,-7));
  const qT=(x=>x>'2026-09-30'?'2026-09-30':x)(addDays(r.from,7));
  Object.assign(draft,{qFrom:qF,qTo:qT,days:len,cycle:r.cycle,ch:[...r.ch],gnb:r.gnb,
    offer:r.offer,qty:r.qty,camp:r.camp,dept:r.team,mk:r.mk,note:r.note||'',
    date:r.from,hour:null,editNo:r.no});
  COND.forEach(k=>form[k]=Array.isArray(draft[k])?[...draft[k]]:draft[k]);
  openPanel=null; found=true; tab='apply';
  $('modalSlot').innerHTML='';
  toast(`수정 중 — ${r.camp}`); render();
}
const canCancel=r=>role==='mkt'&&CANCELABLE.includes(r.status)&&r.mk===ME.mk&&r.team===ME.team;

/* 팝업 배경을 눌러도 닫는다 — 배경 자신을 눌렀을 때만이라 안쪽 클릭은 유지된다 */
function bindOverlay(fn){
  const ov=document.querySelector('#modalSlot .modal');
  if(ov) ov.onclick=e=>{if(e.target===ov) fn()};
}

function cancelModal(no,ask){
  const r=requests.find(q=>q.no===no); if(!r) return;
  const ok=canCancel(r);
  $('modalSlot').innerHTML=`<div class="modal"><div class="box">
    <h3>${ask?'이 신청을 취소하시겠습니까?':esc(r.camp)}</h3>
    <div class="m-sub">${ask
      ? '취소하면 신청이 철회되고, 해당 날짜의 캐파와 시간대가 다시 예약 가능 상태로 변경됩니다. 이 작업은 되돌릴 수 없습니다.'
      : r.status==='확정' ? (r.moved
          ? `협의에 따라 담당자가 일정을 조정했습니다. (${r.moved.from} → ${r.moved.to})`
          : '확정된 캠페인입니다. 일정을 바꾸려면 담당자에게 문의해 주세요.')
      : r.status==='발송 완료' ? '발송이 완료된 캠페인입니다.'
      : r.status==='취소' ? (r.admNote
          ? '담당자가 취소한 캠페인입니다. 사유를 확인하고 필요하면 새로 신청해 주세요.'
          : '취소된 캠페인입니다.')
      : r.status==='조정 필요' ? '담당자가 일정을 조정하고 있습니다.'
      : '담당자 확정을 기다리는 중입니다.'}</div>
    <div class="herocard">
      ${ask?hrow('캠페인명',r.camp):''}
      ${hrow('상태',r.status==='신청'?'확정 대기':r.status)}
      ${hrow('기간',`${fmtD(r.from)} ~ ${fmtD(r.to)}`)}
      ${hrow('발송 일시',(r.cycle==='주기성'?`기간 내 매일 ${hh(r.hour)}`:`${fmtD(r.date)} ${hh(r.hour)}`)
        +(r.moved?`  (신청 ${r.moved.from})`:''))}
      ${hrow('채널 / GNB',`${r.ch.join(' · ')||'—'} / ${r.gnb||'—'}`)}
      ${hrow('주기 / 오퍼',`${r.cycle} / ${r.offer}`)}
      ${hrow(r.cycle==='주기성'?'1일 타겟수':'전체 타겟수',`${man(r.qty)}만 건`)}
      ${hrow('부서 · 마케터',`${r.team} ${r.mk}`)}
      ${hrow('신청 시각',fmtReq(r.reqAt))}
      ${r.status==='취소'&&r.admNote?hrow('취소 사유',r.admNote):''}
      ${r.moved?hrow('일정 변경',`${r.moved.from} → ${r.moved.to}`):''}
      ${r.reason?hrow('사유',r.reason+(r.note?` — ${r.note}`:'')):''}
    </div>
    <div class="m-act">
      <button class="pill quiet" id="cNo">${ask?'돌아가기':'닫기'}</button>
      ${ok&&!ask?`<button class="pill neutral" id="cEdit">수정하기</button>`:''}
      ${ok?`<button class="pill danger" id="cYes">신청 취소</button>`:''}
    </div></div></div>`;
  if(ok) $('cYes').onclick=()=>{
    if(!ask) return cancelModal(no,true);
    DB.set(r,{status:'취소',reason:'',note:'',admNote:''});
    $('modalSlot').innerHTML='';
    toast(`신청을 취소했습니다 — ${r.camp}`,true);
    render();
  };
  if(ok&&!ask) $('cEdit').onclick=()=>editReq(no);
  $('cNo').onclick=()=>$('modalSlot').innerHTML='';
  bindOverlay(()=>$('modalSlot').innerHTML='');
}

/* ── 신청 확인 팝업 ── */
const hrow=(k,v)=>`<div class="hr"><span>${k}</span><span>${esc(v)}</span></div>`;
const cfRow=(k,v)=>`<div class="cfg"><span>${k}</span><b>${v}</b></div>`;
function confirmModal(ask){
  const rep0=draft.cycle==='주기성';
  const from0=draft.date;
  const why=ask?dayCheck(draft,from0).why:'';
  $('modalSlot').innerHTML=`<div class="modal"><div class="box">
    <h3>${ask?'이 날짜로 조정 요청할까요?'
        :draft.editNo!=null?'수정 내용을 확인해 주세요':'신청 내용을 확인해 주세요'}</h3>
    <div class="m-sub">${ask
      ?`${esc(why)} — 담당자가 그 날의 캐파를 조율합니다.`
      :'발송 시간대는 확정 후 배정됩니다.'}</div>
    <div class="herocard">
      ${hrow('캠페인명',draft.camp)}
      ${hrow('부서 · 마케터',`${ME.team} · ${ME.mk}`)}
      ${(()=>{const f=draft.date, n=draft.days||1;
        return hrow('발송일',rep0?`${fmtD(f)} ~ ${fmtD(addDays(f,n-1))} 매일`:fmtD(f))
             + hrow(rep0?'발송 기간':'노출 기간',`${fmtD(f)} ~ ${fmtD(addDays(f,n-1))} · ${n}일`)})()}
      ${hrow('채널 / GNB',`${draft.ch.join(' · ')} / ${draft.gnb||'—'}`)}
      ${hrow('주기 / 오퍼',`${draft.cycle} · ${draft.offer}`)}
      ${hrow(rep0?'1일 타겟수':'전체 타겟수',`${man(draft.qty)}만 건`)}
      ${(()=>{const rm=remOn(draft,from0);
        return rm.length?hrow('이 날 잔여',rm.join(' · ')):''})()}
      ${ask?hrow('조정 요청 사유',draft.note):''}
    </div>
    <div class="m-act">
      <button class="pill neutral" id="mNo">수정하기</button>
      <button class="pill primary" id="mYes">${
        ask?'조정 요청하기':draft.editNo!=null?'수정 완료':'신청하기'}</button>
    </div></div></div>`;
  $('mNo').onclick=()=>$('modalSlot').innerHTML='';
  bindOverlay(()=>$('modalSlot').innerHTML='');
  $('mYes').onclick=()=>{
    /* 일회성은 시작일에 1회 발송한다 — 선택한 날이 곧 캠페인 시작일이다.
       노출 기간의 길이는 마케터가 입력한 그대로 유지하고, 기간을 통째로 옮긴다. */
    const from=draft.date, to=addDays(from,(draft.days||1)-1);
    const body={camp:draft.camp,from,to,ch:[...draft.ch],gnb:draft.gnb,
      /* 신청자는 로그인한 사람이다. 화면 입력에서 받지 않는다 —
         받으면 신청 건이 남의 것이 되어 본인 화면에서 사라진다 (0802 UT) */
      cycle:draft.cycle,offer:draft.offer,qty:draft.qty,team:ME.team,mk:ME.mk,
      date:from, hour:null,            /* 시간대는 담당자가 확정하며 배정한다 */
      status:ask?'조정 필요':'신청', adjBy:ask?'mkt':null,
      reason:ask?why:'', note:ask?draft.note.trim():'', admNote:'',
      reqAt:`${TODAY} ${(()=>{const t=new Date();
        return `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`})()}`};
    const ex=draft.editNo!=null?DB.find(draft.editNo):null;
    if(ex) DB.set(ex,body); else DB.add(body);
    $('modalSlot').innerHTML='';
    toast(ex ? `수정되었습니다 — ${body.camp}`
             : ask ? `조정 요청되었습니다 — ${fmtD(from)}`
                   : `신청되었습니다 — ${fmtD(from)}`, !!ask);
    /* 제출 뒤에는 조회 상태를 접는다 — 그대로 켜져 있으면 안 된 걸로 오인된다 */
    draft=EMPTY_DRAFT(); form=EMPTY_FORM(); found=false; calPick=null;
    scope='mine'; render();
  };
}

/* 팝오버 바깥 클릭 — 이름을 가진 함수라야 렌더마다 중복 등록되지 않고 떼어 낼 수 있다 */
function closeRange(){
  if(!rangeOpen) return;
  rangeOpen=false;
  if(role==='mkt'&&tab==='apply'){ $('page').innerHTML=renderApply(); bindApply() }
}

/* ── 캠페인 신청 탭 이벤트 바인딩 ── */
function bindApply(){
  const re=()=>{$('page').innerHTML=renderApply();bindApply()};
  /* 조회 기간 — 트리거를 누르면 팝오버가 열리고, '적용'을 눌러야 form 에 반영된다.
     고르는 동안 결과가 따라 바뀌면 오해를 부르기 때문이다 (0801 피드백과 같은 이유) */
  const rt=$('rangeTrig');
  if(rt) rt.onclick=e=>{e.stopPropagation(); rangeOpen=!rangeOpen;
    if(rangeOpen){ rangeDraft={from:form.qFrom,to:form.qTo,picking:'from'};
                   rangeMonth=(form.qFrom||TODAY).slice(0,7) }
    re()};
  const rp=$('rangePop');
  if(rp){
    rp.onclick=e=>e.stopPropagation();
    rp.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{
      if(x.dataset.rm){rangeMonth=x.dataset.rm; re()}});
    rp.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{
      rangeDraft.picking=x.dataset.pick; re()});
    rp.querySelectorAll('[data-rd]').forEach(x=>x.onclick=()=>{
      const d=x.dataset.rd, {from,picking}=rangeDraft;
      /* 종료를 고르는 중이고 시작보다 뒤면 기간이 닫힌다. 그 밖에는 새 시작으로 본다 */
      if(picking==='to'&&from&&d>=from){ rangeDraft.to=d; rangeDraft.picking='from' }
      else { rangeDraft.from=d; rangeDraft.to=''; rangeDraft.picking='to' }
      re()});
    $('rangePre').onchange=e=>{
      const r=presetRange(e.target.value);
      if(r){ rangeDraft={from:r[0],to:r[1],picking:'from'}; rangeMonth=r[0].slice(0,7) }
      re()};
    $('rangeOk').onclick=()=>{
      form.qFrom=rangeDraft.from; form.qTo=rangeDraft.to; rangeOpen=false; re()};
  }
  /* 바깥을 누르면 적용하지 않고 닫는다. 렌더마다 다시 붙으므로 먼저 떼어 낸다 */
  document.removeEventListener('click',closeRange);
  document.addEventListener('click',closeRange);
  $('fDays').oninput=e=>{form.days=Math.max(0,+e.target.value||0)};
  document.querySelectorAll('[data-ch]').forEach(x=>x.onchange=()=>{
    const v=x.dataset.ch, i=form.ch.indexOf(v);
    if(x.checked){if(i<0)form.ch.push(v)} else if(i>=0){form.ch.splice(i,1)}});
  document.querySelectorAll('[data-cy]').forEach(x=>x.onchange=()=>{form.cycle=x.dataset.cy;re()});
  document.querySelectorAll('[data-of]').forEach(x=>x.onchange=()=>{form.offer=x.dataset.of});
  $('fGnb').oninput=e=>form.gnb=e.target.value;
  $('fQty').oninput=e=>{form.qty=Math.max(0,+e.target.value||0)};
  $('findBtn').onclick=()=>{
    const miss=[];
    if(!form.qFrom||!form.qTo) miss.push('조회 기간');
    if(!form.days)             miss.push(form.cycle==='주기성'?'발송 기간':'노출 기간');
    if(!form.ch.length)        miss.push('채널');
    if(!form.cycle)            miss.push('주기');
    if(!form.offer)            miss.push('오퍼');
    if(!form.qty)              miss.push('타겟수');
    if(miss.length){toast(`${miss.join(' · ')}를 입력해 주세요.`,true); return}
    /* 이 시점의 조건만 결과에 반영한다 */
    COND.forEach(k=>draft[k]=Array.isArray(form[k])?[...form[k]]:form[k]);
    found=true; draft.date=null; draft.hour=null;
    re()};
  const rb=$('resetBtn'); if(rb) rb.onclick=()=>{
    const n=draft.editNo; draft=EMPTY_DRAFT(); draft.editNo=n;
    form=EMPTY_FORM(); found=false; re()};

  document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{draft.date=x.dataset.d;draft.hour=null;re()});
  document.querySelectorAll('[data-h]').forEach(x=>x.onclick=()=>{draft.hour=+x.dataset.h;re()});
  document.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{draft.hour=+x.dataset.pick;re()});
  document.querySelectorAll('[data-rec]').forEach(x=>x.onclick=()=>{draft.date=x.dataset.rec;draft.hour=null;re()});

  document.querySelectorAll('[data-sc]').forEach(x=>x.onclick=()=>{scope=x.dataset.sc;re()});
  document.querySelectorAll('[data-ls]').forEach(x=>x.onclick=()=>{listSt=x.dataset.ls;listAll=false;render()});
  const lm=$('listMore'); if(lm) lm.onclick=()=>{listAll=!listAll;render()};
  document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>cancelModal(+x.dataset.open,false));
  document.querySelectorAll('[data-cancel]').forEach(x=>x.onclick=e=>{
    e.stopPropagation(); cancelModal(+x.dataset.cancel,true)});
  document.querySelectorAll('[data-km]').forEach(x=>x.onclick=()=>{
    if(x.dataset.km) {kpiMonth=x.dataset.km; re()}});
  document.querySelectorAll('[data-panel]').forEach(x=>x.onclick=()=>{
    openPanel=openPanel===x.dataset.panel?null:x.dataset.panel;
    panelPins=new Set();
    if(openPanel){
      const p=PANELS[openPanel];
      if(p){
        const mine=requests.filter(r=>r.mk===ME.mk&&r.team===ME.team
          &&reqMonth(r)===kpiMonth&&p.st.includes(r.status));
        /* ① 지금 무엇이 새것인지 찍어 두고  ② '봤다'로 바꾼다.
           이번 화면에는 강조가 남고, 다음에 열면 원래 순서로 돌아간다 */
        panelPins=new Set(mine.filter(r=>r.moved&&r.seen===false).map(r=>r.no));
        mine.forEach(r=>r.seen=true);
      }
    }
    re()});
  document.querySelectorAll('[data-move]').forEach(x=>x.onclick=()=>editReq(+x.dataset.move));
  const ce=$('cancelEdit'); if(ce) ce.onclick=()=>{
    draft.editNo=null; draft.camp=''; draft.note=''; draft.date=null; draft.hour=null;
    found=false; toast('수정을 취소했습니다. 기존 신청은 그대로 있습니다.'); re()};

  const cf=$('fCamp');
  if(cf){
    cf.oninput=e=>draft.camp=e.target.value;
    /* 부서·마케터는 읽기 전용이라 입력 핸들러가 없다 — 값은 항상 ME 다 */
    const nt=$('fNote'); if(nt) nt.oninput=e=>draft.note=e.target.value;
    const sb=$('submitBtn');
    if(sb) sb.onclick=()=>{
      if(!draft.camp.trim()){toast('캠페인명을 입력해 주세요.',true);cf.focus();return}
      confirmModal();
    };
    /* 원하는 날이 캐파로 막혔을 때 — 그 날로 조정 요청을 보낸다 */
    const ab=$('askBtn');
    if(ab) ab.onclick=()=>{
      if(!draft.camp.trim()){toast('캠페인명을 입력해 주세요.',true);cf.focus();return}
      if(!draft.note.trim()){toast('조정 요청 사유를 입력해 주세요.',true); if(nt) nt.focus(); return}
      confirmModal(true);
    };
  }
}

/* ══════════════════════════════════════════════════════════════════════
   페이지 2 — 캘린더
   ══════════════════════════════════════════════════════════════════════ */
const MONTHS=['2026-06','2026-07','2026-08','2026-09'];
const monthDayList=m=>ALL.filter(x=>x.d.slice(0,7)===m).map(x=>x.d);
function monthDays(m){
  const [y,mm]=m.split('-').map(Number);
  const first=new Date(y,mm-1,1), lastD=new Date(y,mm,0).getDate();
  const lead=first.getDay(), cells=[];
  for(let i=lead;i>0;i--) cells.push({d:iso(new Date(y,mm-1,1-i)),out:true});
  for(let i=1;i<=lastD;i++) cells.push({d:iso(new Date(y,mm-1,i)),out:false});
  while(cells.length%7) cells.push({d:iso(new Date(y,mm,cells.length-lead-lastD+1)),out:true});
  return cells;
}
/* 채널은 여럿 중 하나(OR), 오퍼는 별개 축이므로 채널과 AND 로 건다 */
const passFilter=r=>{
  if(calFilter.ch.length&&!calFilter.ch.some(c=>r.ch.includes(c))) return false;
  if(calFilter.offer&&r.offer!==calFilter.offer) return false;
  return true;
};
/* 일회성 — 시작·종료 시점만 칸 안에 표기 */
function eventsOn(d){
  const out=[], m=calFilter.mode;
  requests.filter(r=>onCal(r)&&r.cycle!=='주기성'&&passFilter(r)).forEach(r=>{
    if(r.from===d&&m!=='end') out.push({r,t:'start'});
    else if(r.to===d&&m!=='start') out.push({r,t:'end'});
  });
  return out;
}

/* 주기성 — 기간 내내 매일 발송되므로 주 단위로 이어진 바를 그린다 */
function weekSpans(week){
  const a=week[0].d, b=week[6].d, m=calFilter.mode, segs=[];
  requests.filter(r=>onCal(r)&&r.cycle==='주기성'&&passFilter(r)).forEach(r=>{
    if(r.to<a||r.from>b) return;
    if(m==='start'&&!(r.from>=a&&r.from<=b)) return;
    if(m==='end'&&!(r.to>=a&&r.to<=b)) return;
    const si=week.findIndex(x=>x.d===r.from), ei=week.findIndex(x=>x.d===r.to);
    segs.push({r, s:si<0?0:si, e:ei<0?6:ei, head:r.from>=a, tail:r.to<=b});
  });
  const lanes=[];
  segs.forEach(g=>{
    let L=0;
    while(lanes[L]&&lanes[L].some(o=>!(g.e<o.s||g.s>o.e))) L++;
    (lanes[L]=lanes[L]||[]).push(g); g.lane=L;
  });
  return {segs, lanes:lanes.length};
}
function renderCal(){
  const mi=MONTHS.indexOf(calMonth);
  const cells=monthDays(calMonth);
  const mDays=monthDayList(calMonth);
  const inMonth=requests.filter(r=>onCal(r)&&passFilter(r)&&mDays.some(d=>activeOn(d,r)));
  return `<div class="wrap wide">
    <div class="card">
      <div class="card-hd"><div class="rule"></div>
        <div class="lbl"><span>이번 달 발송 현황</span><span>${calMonth.replace('-','.')}</span></div>
        <h2><span>채널 · 오퍼별 요약</span>
          <span class="badge">이 달 발송 ${inMonth.length}건</span></h2></div>
      ${chartFor(inMonth)}
    </div>
    <div class="card">
      <div class="card-hd"><div class="rule"></div>
        <div class="lbl"><span>캠페인 캘린더</span></div></div>
      <div class="calnav">
        <button class="arw" id="pm" ${mi<=0?'disabled':''}>‹</button>
        <span class="lab">${calMonth.replace('-','. ')}</span>
        <button class="arw" id="nm" ${mi>=MONTHS.length-1?'disabled':''}>›</button>
      </div>
      <div class="filters">
        <span class="fl">표시</span>
        ${[['all','시작+종료'],['start','시작만'],['end','종료만']].map(([k,n])=>
          `<button class="chip sm ${calFilter.mode===k?'on':''}" data-m="${k}">${n}</button>`).join('')}
        <span class="sep"></span>
        <span class="fl">채널</span>
        ${CH_LIST.map(c=>
          `<button class="chip sm ${calFilter.ch.includes(c)?'on':''}" data-f="${c}">${c}</button>`).join('')}
        <span class="sep"></span>
        <span class="fl">오퍼</span>
        ${['쿠폰','없음'].map(o=>
          `<button class="chip sm ${calFilter.offer===o?'on':''}" data-fo="${o}">${o}</button>`).join('')}
        ${calFilter.ch.length||calFilter.offer?`<button class="chip sm" data-f="__clear">필터 해제</button>`:''}
      </div>
      <div class="cal">
        <div class="calhd">${WD.map((w,i)=>`<div class="ch${i===0?' sun':''}">${w}</div>`).join('')}</div>
        ${(()=>{const wks=[];for(let i=0;i<cells.length;i+=7)wks.push(cells.slice(i,i+7));
          return wks.map((wk,wi)=>{
            const {segs}=weekSpans(wk);
            const colLanes=[0,0,0,0,0,0,0];
            segs.forEach(g=>{for(let i=g.s;i<=g.e;i++) colLanes[i]=Math.max(colLanes[i],g.lane+1)});
            /* 레인 1개 = 바 19px + 간격 3px (일회성 칩과 같은 높이) */
            return `<div class="calwk">
              <div class="wcells">${wk.map((c,ci)=>calCell(c,wi*7+ci,wks.length,colLanes[ci])).join('')}</div>
              ${segs.length?`<div class="wspans">${segs.map(g=>spanBar(g,wi,wks.length)).join('')}</div>`:''}
            </div>`}).join('')})()}
      </div>
      <div class="legend">
        <span><i style="background:var(--sk-orange-t10);border-left:2px solid var(--sk-orange)"></i>시작 캠페인</span>
        <span><i style="background:var(--l1);border-left:2px solid var(--locked-fill)"></i>종료 캠페인</span>
        <span><i style="background:var(--waiting-bg);border-left:2px solid var(--waiting-border)"></i>↻ 주기성 (기간 내 매일 같은 시간)</span>
      </div>
    </div>
  </div>`;
}
function calCell(c,idx,rows,lanes){
  const col=idx%7, row=Math.floor(idx/7);
  const flip=(col>=5?' rt':'')+(row>=rows-2?' up':'');
  const o=dayOf(c.d), evs=c.out?[]:eventsOn(c.d);
  const show=evs.slice(0,3), rest=evs.length-show.length;
  return `<div class="ccell${c.out?' out':''}${o&&o.dow===0?' sun':''}${c.d===TODAY?' today':''}"
      ${c.out?'':`data-cd="${c.d}"`}>
    <div class="cd">${+c.d.slice(8)}</div>
    ${c.out?'':(()=>{
      /* 마케터가 묻는 것은 '여기 넣을 수 있나' 하나다. 그 답은 잔여다.
         추천 카드·날짜 칸·일자 상세가 모두 잔여를 보여 주는데 월간 캘린더만 사용량이었다.
         값은 시스템이 판정에 쓰는 그 값(bannerRem)을 그대로 쓴다 —
         다른 숫자를 보이면 '잔여 100만'인 날에 80만이 막히는 일이 생긴다 (2026-08-04) */
      return `<div class="ccapline"><div class="capk">잔여 캐파</div>
        <div class="capv">배너 <b>${man(bannerRem(c.d))}</b>만, 쿠폰 <b>${man(couponRem(c.d))}</b>만</div>
      </div>`})()}
    ${lanes?`<div class="lanegap" style="height:${lanes*22}px"></div>`:''}
    ${show.map(e=>`<div class="ev ${e.rep?'rep':e.t}${flip}">${
        e.rep?'↻ ':e.t==='end'?'▪ ':''}${esc(e.r.camp)}
      <div class="tip"><b>${esc(e.r.camp)}</b>
        <div class="tr"><span>구분</span><span>${e.rep
          ? '주기성 · '+(e.t==='start'?'시작':e.t==='end'?'종료':'발송 중')
          : '일회성 · '+(e.t==='start'?'시작':'종료')}</span></div>
        <div class="tr"><span>기간</span><span>${fmtD(e.r.from)}~${fmtD(e.r.to)}</span></div>
        <div class="tr"><span>채널</span><span>${e.r.ch.join('·')||'—'}</span></div>
        <div class="tr"><span>오퍼</span><span>${e.r.offer}</span></div>
        <div class="tr"><span>${e.rep?'1일 모수':'모수'}</span><span>${man(e.r.qty)}만 건</span></div>
        <div class="tr"><span>발송</span><span>${hh(e.r.hour)}${e.rep?' 매일':''}</span></div>
        <div class="tr"><span>담당</span><span>${e.r.team} ${e.r.mk}</span></div>
      </div></div>`).join('')}
    ${rest>0?`<div class="cmore">+${rest}건 더</div>`:''}
  </div>`;
}
function spanBar(g,wi,rows){
  const r=g.r, flip=(g.s>=5?' rt':'')+(wi>=rows-2?' up':'');
  return `<div class="ev rep span${g.head?' head':''}${g.tail?' tail':''}${flip}" data-cd="${r.from}"
      style="grid-column:${g.s+1}/${g.e+2};grid-row:${g.lane+1}">↻ ${esc(r.camp)}
    <div class="tip"><b>${esc(r.camp)}</b>
      <div class="tr"><span>구분</span><span>주기성 · 매일 발송</span></div>
      <div class="tr"><span>기간</span><span>${fmtD(r.from)}~${fmtD(r.to)}</span></div>
      <div class="tr"><span>채널</span><span>${r.ch.join('·')||'—'}</span></div>
      <div class="tr"><span>오퍼</span><span>${r.offer}</span></div>
      <div class="tr"><span>1일 모수</span><span>${man(r.qty)}만 건</span></div>
      <div class="tr"><span>발송</span><span>${hh(r.hour)} 매일</span></div>
      <div class="tr"><span>담당</span><span>${r.team} ${r.mk}</span></div>
    </div></div>`;
}

function chartFor(rows){
  const mDays=monthDayList(calMonth);
  const chStat=CH_LIST.concat('쿠폰').map(c=>{
    const rs=c==='쿠폰'?rows.filter(r=>r.offer==='쿠폰'):rows.filter(r=>r.ch.includes(c));
    /* 모수는 그 달에 실제로 나가는 물량 — 주기성은 걸친 일수만큼 합산 */
    const q=rs.reduce((s,r)=>s+r.qty*mDays.filter(d=>activeOn(d,r)).length,0);
    return {c,n:rs.length,q};
  });
  const maxQ=Math.max(1,...chStat.map(s=>s.q));
  /* 막대는 전부 같은 색이다. 이 그래프가 답하는 것은 '무슨 채널인가'가 아니라
     '얼마나 나가는가'이고, 채널 이름은 왼쪽에 글자로 이미 적혀 있다.
     길이만으로 비교되게 두면 색이 뜻을 흐리지 않는다 (2026-08-04) */
  const [y,mm]=calMonth.split('-').map(Number), lastD=new Date(y,mm,0).getDate();
  const perDay=[...Array(lastD)].map((_,i)=>{
    const d=iso(new Date(y,mm-1,i+1));
    return {d,q:requests.filter(r=>onCal(r)&&activeOn(d,r)&&passFilter(r)).reduce((s,r)=>s+r.qty,0)};
  });
  const maxD=Math.max(1,...perDay.map(x=>x.q));
  return `<div class="chartbox">
    <div class="cbar">
      ${chStat.map(s=>`<div class="cbrow">
        <div class="cl">${s.c}</div>
        <div class="cbtrack"><b style="width:${s.q/maxQ*100}%"></b></div>
        <div class="cn">${s.n}건 · ${man(s.q)}만</div></div>`).join('')}
    </div>
    <div class="sparkwrap">
      <div class="st2">일자별 발송 모수</div>
      <div class="spark">${perDay.map(x=>
        `<div class="sb" data-tip="${+x.d.slice(8)}일 · ${man(x.q)}만 건">
          <b style="height:${x.q/maxD*100}%"></b></div>`).join('')}</div>
      <div class="sparkx">${perDay.map((x,i)=>
        `<span>${(i+1)%5===0||i===0?i+1:''}</span>`).join('')}</div>
    </div>
  </div>`;
}

/* ── 일자 상세 (먼슬리뷰에서 날짜 클릭 → 구체화) ── */
function renderDay(d){
  const onDay=requests.filter(r=>onCal(r)&&activeOn(d,r)).sort((a,b)=>a.hour-b.hour);

        <div><div class="sv">배너 잔여</div><div class="sd">${man(bannerRem(d))}만 건</div></div>

      </div>
      <div class="segnote" style="margin:4px 0 8px">이 날짜의 발송 확정 캠페인</div>
      ${onDay.length?`<div class="daylist">${onDay.map(r=>`<div class="dayrow">
          <span class="dh2 num">${hh(r.hour)}</span>

/* ══════════════════════════════════════════════════════════════════════
   페이지 3 — 캠페인 관리 (담당자)
   · 마케터가 1차 배치해 신청한 건을 확인하고 확정
   · 조정 요청 들어온 건의 일정을 조정해서 확정
   ══════════════════════════════════════════════════════════════════════ */

/* ── 오늘 처리할 일 ──
   알림을 메일로 보내면 담당자 받은편지함에 일이 하나 더 쌓인다.
   이미 보고 있는 화면 안에서 푼다 — 외부 연동 없이 데이터만으로 된다.
   (기술회의 2026-08-03 · T-02)

   급한 순서는 '발송일이 얼마나 가까운가'다. 상태가 아니라 시간이 기준이다.
   지난 날짜 건은 원래 없어야 하지만(MAINTENANCE §3), 생기면 가장 먼저 보여
   데이터가 어긋났다는 것을 담당자와 우리가 동시에 알게 한다. */
function admAlerts(){
  const pend=r=>['신청','조정 필요'].includes(r.status);
  const D1=addDays(TODAY,1);
  const rows=[
    ['hot','지난 날짜 미처리',requests.filter(r=>pend(r)&&r.from<TODAY)],
    ['hot','오늘 발송 · 미확정',requests.filter(r=>pend(r)&&r.from===TODAY)],
    ['warn','내일 발송 · 미확정',requests.filter(r=>pend(r)&&r.from===D1)],
    ['calm','조정 필요',requests.filter(r=>r.status==='조정 필요'&&r.from>D1)],
  ].filter(([,,list])=>list.length);

  if(!rows.length) return `<div class="card">
    <div class="card-hd"><div class="rule"></div><div class="lbl"><span>오늘 처리할 일</span></div></div>
    <div class="alnone">지금 처리할 건이 없습니다.</div></div>`;

  /* 건이 많으면 이름을 다 늘어놓지 않는다 — 3개까지만 보이고 나머지는 숫자로 남긴다.
     알림이 목록이 되면 그 자체가 또 하나의 처리 대상이 된다. */
  const chips=list=>list.slice(0,3).map(r=>
      `<button class="alitem" data-am="${r.no}">${esc(r.camp)} · ${fmtD(r.from)}</button>`).join('')
    +(list.length>3?`<span class="almore">외 ${list.length-3}건</span>`:'');

  return `<div class="card">
    <div class="card-hd"><div class="rule"></div>
      <div class="lbl"><span>오늘 처리할 일</span><span>${fmtD(TODAY)} 기준</span></div></div>
    <div class="alerts">
      ${rows.map(([tone,label,list])=>`<div class="alrow">
        <span class="aldot ${tone}"></span>
        <span class="allbl">${label}</span>
        <span class="alcnt num">${list.length}건</span>
        <span class="alitems">${chips(list)}</span>
      </div>`).join('')}
    </div></div>`;
}

/* ── 담당자 요약 네 칸의 내역 ──
   마케터 화면과 같은 방식으로 펼친다. 다만 축이 다르다 —
   마케터는 '내가 이 달에 넣은 것'(신청일 기준), 담당자는 '이 달에 나가는 것'(발송 시작일 기준).
   숫자가 서로 달라 보이는 이유가 이것이다 (DECISIONS D-03 과 같은 결). */
const ADM_PANELS={
  wait:{st:['신청'],           ttl:'확정 대기', badge:'', act:'확정하기'},
  adj :{st:['조정 필요'],       ttl:'조정 필요', badge:'', act:'조정하기'},
  conf:{st:['확정','발송 완료'], ttl:'확정',     badge:'',                 act:'상세 보기'},
  canc:{st:['취소'],           ttl:'취소',     badge:'',                 act:''},
};
function admStatePanel(key){
  const p=ADM_PANELS[key]; if(!p) return '';
  const rows=requests.filter(r=>r.from.slice(0,7)===kpiMonth&&p.st.includes(r.status))
    .sort((a,b)=>a.reqAt<b.reqAt?1:a.reqAt>b.reqAt?-1:0);
  if(!rows.length) return `<div class="card"><div class="empty">이 달에 ${p.ttl} 건이 없습니다.</div></div>`;
  const chip=st=>st==='신청'?'applied':st==='조정 필요'?'needfix'
    :st==='취소'?'cancel':st==='발송 완료'?'sent':'confirmed';
  return `<div class="card adjcard">
    <div class="card-hd"><div class="rule"></div>
      <div class="lbl"><span>${p.ttl} 내역</span><span>${kpiMonth.replace('-','.')} 발송 시작</span></div>
      <h2><span>${rows.length}건</span>
        ${p.badge?`<span class="badge">${p.badge}</span>`:''}
        <span class="badge">신청 최신순</span></h2></div>
    ${rows.map(r=>`<div class="adjitem">
      <div class="adjhd"><b>${esc(r.camp)}</b>
        <span class="st ${chip(r.status)}">${r.status==='신청'?'확정 대기':r.status}</span>
        <span class="adjwhen">${r.cycle==='주기성'
          ? `${fmtD(r.from)}~${fmtD(r.to)} · 매일 ${hh(r.hour)}`
          : `${fmtD(r.date)} ${hh(r.hour)}`}</span></div>
      <div class="cfgrid">
        ${cfRow('부서 · 마케터',`${r.team} ${r.mk}`)}
        ${cfRow('기간',`${fmtD(r.from)} ~ ${fmtD(r.to)}`)}
        ${cfRow('채널 / GNB',`${r.ch.join('·')||'—'} / ${esc(r.gnb)||'—'}`)}
        ${cfRow('주기 / 오퍼',`${r.cycle} · ${r.offer}`)}
        ${cfRow(r.cycle==='주기성'?'1일 타겟수':'전체 타겟수',`${man(r.qty)}만 건`)}
        ${cfRow('신청 시각',fmtReq(r.reqAt))}
      </div>
      ${r.reason?`<div class="adjwhy"><span>사유</span>${esc(r.reason)}</div>`:''}
      ${r.note?`<div class="adjnote"><span>마케터 사유</span>${esc(r.note)}</div>`:''}
      ${r.admNote?`<div class="adjnote"><span>담당자 사유</span>${esc(r.admNote)}</div>`:''}
      ${p.act?`<div class="adjbtns">
        <button class="pill primary sm" data-am="${r.no}">${p.act}</button>
      </div>`:''}
    </div>`).join('')}</div>`;
}

function renderManage(){
  /* 담당자 화면은 캘린더가 주인공이므로 요약도 같은 축을 쓴다 — 발송 시작일 기준.
     (마케터 화면은 '내가 이 달에 넣은 것'이라 신청일 기준으로 다르다) */
  const ofMonth=r=>r.from.slice(0,7)===kpiMonth;
  const wait=requests.filter(r=>r.status==='신청'&&ofMonth(r));
  const adj =requests.filter(r=>r.status==='조정 필요'&&ofMonth(r));
  /* 발송 완료는 확정을 거쳐 나간 건이다. 따로 세면 어느 칸에도 안 들어가
     요약과 캘린더의 숫자가 어긋난다 (7월: 요약 4건 vs 캘린더 41건) */
  const conf=requests.filter(r=>['확정','발송 완료'].includes(r.status)&&ofMonth(r));
  const canc=requests.filter(r=>r.status==='취소'&&ofMonth(r));
  /* 지난달에 시작하는데 아직 확정 못 한 건 — 월을 넘겨 놓치지 않도록 알린다 */
  const carry=requests.filter(r=>['신청','조정 필요'].includes(r.status)&&r.from.slice(0,7)<kpiMonth);
  const mi=MONTHS.indexOf(kpiMonth);
  /* 내일 나가는데 아직 확정 안 된 건 — 오늘 손대지 않으면 놓친다 (DECISIONS D-07).
     제약이 아니라 알림으로 푼다는 원칙을 요약 칸에서 지킨다 */
  const waitD1=wait.filter(r=>r.from===addDays(TODAY,1)).length;
  const box=(k,v,hero,key,dot)=>`<div class="kpi${key?' clickable':''}${dot?' unseen':''}${
      key&&openPanel===key?' open':''}" ${key?`data-panel="${key}"`:''}>
    <div class="k">${k}${dot?`<i class="ndot" title="내일 발송 · 미확정 ${dot}건"></i>`:''}</div>
    <div class="v num">${v||'—'}</div></div>`;
  return `<div class="wrap wide">
    <div class="kpihd">
      <button class="arw" data-km="${MONTHS[mi-1]||''}" ${mi<=0?'disabled':''}>‹</button>
      <span class="kml num">${kpiMonth.replace('-','. ')}</span>
      <button class="arw" data-km="${MONTHS[mi+1]||''}" ${mi>=MONTHS.length-1?'disabled':''}>›</button>
      <span class="kmn">이 달 발송 ${wait.length+adj.length+conf.length+canc.length}건</span>
      ${carry.length?`<button class="chip sm" data-km="${MONTHS[mi-1]||''}">지난달 미처리 ${carry.length}건</button>`:''}
    </div>
    <div class="kpis">
      ${/* 순서는 마케터 화면과 같게 — 같은 것을 다르게 배열하면 안 된다.
            진행 흐름(대기 → 확정)을 따른다 (0802 UT) */''}
      ${/* 네 칸은 같은 무게다. 손이 필요한 것은 알림의 빨간 점과 숫자가 말한다 */''}
      ${box('확정 대기',wait.length,false,'wait',waitD1)}
      ${box('확정',conf.length,false,'conf')}
      ${box('조정 필요',adj.length,false,'adj')}
      ${box('취소',canc.length,false,'canc')}
    </div>
    ${openPanel?admStatePanel(openPanel):''}
    <div class="card">
      <div class="card-hd"><div class="rule"></div>
        <div class="lbl"><span>캠페인 관리</span></div></div>
      ${admCal()}
    </div>
  </div>`;
}

/* 발송 시작일 기준 월간 캘린더.
   칸마다 그 날 소진되는 캐파와, 그 날 시작하는 캠페인을 신청순으로 보여준다. */
function admCal(){
  const cells=monthDays(kpiMonth);
  /* 발송 완료는 이미 나간 건 — 확정과 섞이지 않게 따로 본다 */
  const dot=s=>s==='신청'?'wait':s==='조정 필요'?'need'
    :s==='취소'?'canc':s==='발송 완료'?'sent':'conf';
  const wks=[]; for(let i=0;i<cells.length;i+=7) wks.push(cells.slice(i,i+7));
  return `<div class="cal">
    <div class="calhd">${WD.map((w,i)=>`<div class="ch${i===0?' sun':''}">${w}</div>`).join('')}</div>
    ${wks.map(wk=>`<div class="calrow">${wk.map(c=>{
      if(c.out) return `<div class="ccell out"></div>`;
      const d=c.d, o=dayOf(d);
      /* 그 날 시작하는 건. 확정된 건은 발송 시각 순, 아직 처리 못 한 건은
         신청 순으로 아래에 따로 모은다 (0801 피드백) */
      const day=requests.filter(r=>r.status!=='취소'&&r.from===d);
      const done=day.filter(r=>r.hour!=null).sort((a,b)=>a.hour-b.hour);
      const todo=day.filter(r=>r.hour==null).sort((a,b)=>a.reqAt<b.reqAt?-1:1);
      /* 요약 숫자는 '마케터가 신청한 값' 그대로 — 아래 나열한 건들의 합과 같아야 한다.
         캐파 판정(live)에서는 조정 필요를 빼지만, 이 요약에서는 더해서 보여준다. */
      const bu=appliedOn(d,q=>q.ch.includes('배너'));
      const cu=appliedOn(d,q=>q.offer==='쿠폰');
      /* 빨강은 '이 채널이 실제로 한도를 넘었다'는 신호다.
         예전에는 '조정 필요 건이 이 채널을 쓴다'로 판정해, 배너만 넘친 날에
         멀쩡한 쿠폰까지 빨갛게 보였다 (2026-08-04) */
      const bOver=bu>CAPA['배너'].limit;
      const cOver=CAPA['쿠폰'].limit!=null&&cu>CAPA['쿠폰'].limit;
      return `<div class="ccell${d===TODAY?' today':''}${o&&o.dow===0?' sun':''}"
          ${isPast(d)?'':`data-drop="${d}"`}>
        <div class="cd num">${+d.slice(8)}</div>
        <div class="ccap">
          ${/* 캐파는 그 날 아무것도 안 나가도 적는다 — '0/400만'은 빈 칸이 아니라
                '400만이 통째로 남아 있다'는 정보다. 담당자가 자리를 찾을 때 보는 첫 숫자다.
                분수는 '남은 양'으로 읽히기 쉬워 맨 앞에 무엇을 센 값인지 적는다 (2026-08-04) */''}
          <div class="capk">신청 캐파</div>
          <div class="capv"><span class="${bOver?'over':''}">배너 <b>${
            man(bu)}</b>/${man(CAPA['배너'].limit)}</span>, <span class="${
            cOver?'over':''}">쿠폰 <b>${man(cu)}</b>/${man(CAPA['쿠폰'].limit)}만</span></div>
        </div>
        ${(()=>{const on=requests.filter(r=>live(r)&&activeOn(d,r)&&r.from!==d).length;
          return on?`<div class="cgo">↻ 주기성 발송 중 ${on}건</div>`:''})()}
        ${done.map(r=>`<div class="crow ${dot(r.status)}" data-am="${r.no}"
            title="${esc(r.camp)} · ${r.status}">
          <i></i><span class="cn">${esc(r.camp)}</span>
          <span class="cq num">${man(r.qty)}만</span>
          <span class="cs num">${hh(r.hour)}</span>
        </div>`).join('')}
        ${done.length&&todo.length?`<div class="csep"></div>`:''}
        ${todo.map(r=>`<div class="crow ${dot(r.status)}" data-am="${r.no}">
          <i></i><span class="cn">${esc(r.camp)}</span>
          <span class="cq num">${man(r.qty)}만</span>
          <span class="cs">${r.status==='신청'?'확정 대기':r.status}</span>
        </div>`).join('')}
      </div>`}).join('')}</div>`).join('')}
  </div>`;
}

/* ── 캐파가 모자랄 때 자리를 만드는 길 (0731 플로우를 캐파 기준으로 옮긴 것) ──
   0731 은 '그 시간대를 잡은 한 건'을 자동으로 찾아왔지만, 지금 제약은 하루 캐파라
   자리를 차지한 건이 하나로 특정되지 않는다. 그래서 그 날 건들을 세우고 담당자가 고른다. */

/* 어느 채널이 얼마나 모자란지 — 기간 중 가장 빠듯한 날 기준.
   배너와 쿠폰이 함께 넘칠 수 있으므로 채널별로 따로 돌려준다. */
function shortOf(r,span){
  const out=[];
  const scan=(name,remFn)=>{
    let amt=0, worst=span[0];
    span.forEach(d=>{const g=r.qty-remFn(d); if(g>amt){amt=g; worst=d}});
    if(amt>0) out.push({ch:name,amt,d:worst});
  };
  if(r.ch.includes('배너')) scan('배너',bannerRem);
  if(r.offer==='쿠폰')      scan('쿠폰',couponRem);
  return out;
}

/* 그 날 캐파를 쓰고 있는 다른 건들 — 하나를 옮기면 자리가 난다 */
function moversOn(r,span,byHour){
  return requests.filter(q=>q.no!==r.no&&live(q)&&q.status!=='조정 필요'

      /* 옮기는 중인 건은 이미 그 날·그 시간에서 빠졌어도 목록에 남겨 둔다 */
      &&(q.no===admSwap.no||span.some(d=>activeOn(d,q)))
      &&(byHour
          ? REC_HOURS.includes(swapView(q).hour)&&slotClash(r,q)
          : (r.ch.includes('배너')&&q.ch.includes('배너'))||(r.offer==='쿠폰'&&q.offer==='쿠폰')))
    .sort((a,b)=>byHour?(swapView(a).hour-swapView(b).hour):(b.qty-a.qty));
}

/* ── 빠른 일정 조정 (담당자) ──
   조정 필요 건은 그 날 캐파가 모자란 건이다. 담당자가 날짜를 하나씩 넣어보며
   되는 날을 찾아야 했고, 캐파가 찬 달에는 누르는 족족 막혔다.

   마케터 화면의 추천을 방향만 돌려 쓴다 — recTop 은 그대로다.
   범위는 신청일 앞뒤 3일. 마케터가 그 날을 원한 이유가 있으므로 멀리 가지 않는다.
   바닥은 '내일' — 당일 발송은 불가능하고 D-1 이 마지노선이다 (DECISIONS D-07).

   가중치에 '근접도'를 넣지 않았다. 대신 며칠 밀리는지를 화면에 적어 담당자가 고른다.
   규칙을 하나 더 넣으면 설명할 것과 검증할 것이 같이 늘어난다. */
function fixSuggest(r){
  const [lo,hi]=nearWin(r.from);
  if(clampD(lo)>clampD(hi)) return '';
  const top=recTop(3,r,clampD(lo),clampD(hi)).filter(x=>x.d!==r.from);
  const gap=d=>{
    const n=rangeDays(d<r.from?d:r.from, d<r.from?r.from:d).length-1;
    return d>r.from?`${n}일 뒤`:`${n}일 앞`;
  };
  return `<div class="fixrow"><span>빠른 일정 조정</span>
    <div class="sugwrap">
      ${top.length?`<div class="sugs">${top.map(x=>{
        const rm=remOn(r,x.d);
        return `<button type="button" class="sug" data-sug="${x.d}">
          <b>${fmtD(x.d)}</b>
          <span>${gap(x.d)}</span>
          ${rm.length?`<span>잔여 ${rm.join(' · ')}</span>`:''}
        </button>`}).join('')}</div>`
      :`<div class="sugnone">신청일 앞뒤 3일 안에는 옮길 수 있는 날이 없습니다.
          아래에서 다른 건을 옮겨 자리를 만들거나, 신청을 취소해야 합니다.</div>`}
    </div></div>`;
}

/* 조정 요청을 '그 날 그대로' 수락하는 경로.
   마케터가 날짜를 못 옮긴다고 한 건(대외 공지된 세일 오픈일 같은)은 이쪽이 유일한 답이다.

   담당자가 머리로 하던 계산 셋을 화면이 대신한다 —
     ① 얼마를 비워야 하나        ② 어느 걸 옮기면 충분한가      ③ 비켜 준 건은 어디로 가나
   ①②는 여기서, ③은 swapPanel 에서 같은 recTop 으로 답한다. */
/* 비켜 주는 건이 갈 수 있는 날.
   범위를 데이터 끝까지 열어 뒀더니 한산한 다음 달이 점수에서 이겨,
   8월에 400만이 비는 날을 두고 9월을 먼저 내밀었다. 점수는 '얼마나 멀리 가는가'를 보지 않는다.

   확정된 건을 한 달 밖으로 밀어내는 것은 자리를 만드는 게 아니라 다른 문제를 만드는 것이다.
   캠페인은 대개 그 달 안에서 도는 일이라 달을 넘기면 기획 자체가 어긋난다.
   그래서 같은 달을 먼저 보고, 없을 때만 넓힌다. 가중치는 건드리지 않는다. (2026-08-04) */
/* 날짜 추천의 창은 하나뿐이다 — 기준일 앞뒤 3일, 바닥은 '내일'.
   조정 필요 건을 옮길 때도, 비켜 주는 확정 건이 갈 곳을 찾을 때도 같은 규칙을 쓴다.
   화면마다 규칙이 다르면 담당자가 두 번 배워야 한다.

   바닥이 오늘이 아니라 내일인 이유 — 당일 발송은 불가능하고 D-1 이 마지노선이다 (D-07).
   창을 넓게 열면 한산한 다음 달이 점수에서 이겨, 8월에 400만이 비는데도 9월을 내민다.
   점수는 '얼마나 멀리 가는가'를 보지 않기 때문이다. 그래서 범위로 막는다. (2026-08-04) */
const nearWin=base=>[[addDays(TODAY,1), addDays(base,-3)].sort().pop(), addDays(base,3)];
const swapDest=(hd,n=3)=>{
  const [lo,hi]=nearWin(hd.from);
  if(clampD(lo)>clampD(hi)) return [];
  return recTop(n,hd,clampD(lo),clampD(hi)).filter(x=>x.d!==hd.from);
};
const dayGap=(base,d)=>{
  const n=rangeDays(d<base?d:base, d<base?base:d).length-1;
  return n===0?'같은 날':(d>base?`${n}일 뒤`:`${n}일 앞`);
};

function moverList(r,span,byHour,rSel){
  const ms=moversOn(r,span,byHour);
  if(!ms.length) return '';
  /* 어느 건을 옮길지는 시스템이 판정하지 않는다.
     실무에서는 조정 필요 건이 나오면 당사자들과 이야기한 뒤 담당자가 결정한다.
     화면은 후보와 수량만 늘어놓고, 판단은 사람이 한다 (2026-08-04) */
  const sorted=ms;
  return `<div class="movers">
    <div class="mvhd">확정 건 일정 변경</div>
    ${sorted.map(q=>`<div class="mv${admSwap.no===q.no?' on':''}">
      <span class="mvn">${esc(q.camp)}</span>
      <span class="mvcy${q.cycle==='주기성'?' rep':''}">${q.cycle}</span>
      <span class="mvq num">${man(q.qty)}만</span>
      <span class="mvt num">${hh(swapView(q).hour)}</span>
      ${/* 이미 고른 건은 다시 누를 일이 없다 — 테두리형으로 두면 아직 고를 수 있어 보인다.
            되돌리는 자리는 아래 패널의 '되돌리기'다 */''}
      <button class="pill ${admSwap.no===q.no?'picked':'ghost'} sm"
        ${admSwap.no===q.no?'disabled':`data-swapon="${q.no}"`}>일정 변경</button>
    </div>${admSwap.no===q.no?swapPanel(r,q,span,rSel):''}`).join('')}</div>`;
}

/* 비켜 줄 건의 새 자리 — 여기서 고르면 캐파 계산이 바로 옮긴 결과로 바뀐다 */
function swapPanel(r,hd,rSpan,rSel){
  const rep=hd.cycle==='주기성', hours=rep?REC_HOURS:HOURS;
  const n=rangeDays(hd.from,hd.to).length||1;
  const to=admSwap.from||hd.from;
  const swTo=admSwap.to||addDays(to,n-1);
  const swLen=rangeDays(to,swTo).length||1;
  const hSpan=rangeDays(to,swTo);
  const sel=admSwap.hour!=null?admSwap.hour:(hd.hour??hours[0]);
  /* 옮길 자리의 시간대 현황 — 자기 자신과 조정 요청 건은 빼고 센다 */
  const hAt={};
  hours.forEach(h=>hAt[h]=hSpan.reduce((n,d)=>n+requests.filter(q=>
    inScope(q)&&q.no!==hd.no&&activeOn(d,q)&&swapView(q).hour===h&&slotClash(hd,q)).length,0));
  /* 날짜를 옮겨도, 시간만 옮겨도 자리가 난다 — 17~19시가 다 찬 경우는 시간만 바꾸면 된다 */
  const moved=to!==hd.from||swTo!==hd.to, movedH=admSwap.hour!=null&&admSwap.hour!==hd.hour;
  const changed=moved||movedH;
  /* 옮길 자리가 이 건을 받아낼 수 있나 (swapView 가 이미 옮긴 것으로 세고 있다) */
  const badTo=hSpan.some(d=>(hd.ch.includes('배너')&&bannerRem(d)<0)
                          ||(hd.offer==='쿠폰'&&couponRem(d)<0));
  /* 옮기고 나면 조정 요청 건이 들어가나 */
  const fits=!rSpan.some(d=>(r.ch.includes('배너')&&bannerRem(d)<r.qty)
                          ||(r.offer==='쿠폰'&&couponRem(d)<r.qty));
  /* 비켜 주는 건이 갈 곳도 같은 규칙으로 고른다. 범위는 지금 자리 앞뒤 7일 —
     조정 요청 건보다 넉넉히 잡는다. 이 건은 '원해서' 그 날인 게 아니기 때문이다 */
  const sTop=swapDest(hd).filter(x=>x.d!==to);
  return `<div class="swap">
    ${sTop.length?`<div class="fixrow"><span>빠른 일정 조정</span>
      <div class="sugwrap"><div class="sugs">${sTop.map(x=>`
        <button type="button" class="sug sm" data-swapto="${x.d}">
          <b>${fmtD(x.d)}</b><span>${dayGap(hd.from,x.d)}</span>
          <span>잔여 ${remOn(hd,x.d).join(' · ')||'여유 있음'}</span>
        </button>`).join('')}</div></div></div>`:''}
    <div class="fixrow"><span>발송 일정 변경</span>
      <div class="fdates">
        ${rangeField('sw',to,swTo,swLen)}
        ${rep?`<span class="tl">매일 발송</span>`:''}
        ${moved?`<span class="tl moved">기존 일정 ${fmtD(hd.from)} ~ ${fmtD(hd.to)}</span>`:''}
      </div></div>
    <div class="fixrow"><span>${capLabel(hd)}</span>${gaugeRow(hSpan[0],hd,hd.qty,'선택건',hd)}</div>
    <div class="fixrow"><span>시간대</span>
      <div class="hgrid ${rep?'rec3':'adm'}">${hours.map(h=>
        `<div class="hslot ${hAt[h]?'busy':''}${h===sel?' on':''}" data-swh="${h}">
          <span class="hh">${h}시</span>
          <span class="hs">${h===sel?`선택`:hAt[h]?`${hAt[h]}건`:`가능`}</span></div>`).join('')}</div></div>
    ${badTo?`<div class="blockbox"><b>옮길 날짜도 캐파를 넘습니다</b>
      <div>다른 날짜를 골라 주세요.</div></div>`:''}
    <div class="adjbtns">
      ${/* 조정 요청 건의 시간대까지 정해져야 확정할 수 있다 —
            안 고르고 확정하면 첫 칸(새벽 1시)으로 들어간다 (2026-08-04) */''}
      <button class="pill primary sm" data-swapok="${hd.no}"
        ${changed&&!badTo&&fits&&rSel!=null?'':'disabled'}>두 건 함께 확정</button>
      <button class="pill ghost sm" data-swapno="1">되돌리기</button>
      ${!changed?`<span class="note">옮길 날짜나 시간을 골라 주세요.</span>`
        :!fits?`<span class="note">아직 자리가 모자랍니다.</span>`
        :rSel==null?`<span class="note">${esc(r.camp)}의 시간대를 골라 주세요.</span>`:''}
    </div></div>`;
}

/* ── 담당자 처리 팝업 ──
   상태에 따라 할 수 있는 일만 보여준다.
     확정 대기 · 조정 필요 → 발송일·시간대를 정해 확정 (필요하면 신청 취소)
     확정                  → 일정만 다시 조정
   신청한 날과 달라지면 moved 에 남겨 마케터가 바뀐 것을 알 수 있게 한다. */
/* 발송 기간 변경 — 시작과 끝을 한 컨트롤에서 고른다.
   위 카드에 신청 기간·신청 발송일이 이미 있으므로, 여기는 '바꾸는 자리'다 */
function rangePopAdm(key){
  const {from,to,picking}=dpRange;
  const cells=monthDays(dpMonth), mi=MONTHS.indexOf(dpMonth);
  const wks=[]; for(let i=0;i<cells.length;i+=7) wks.push(cells.slice(i,i+7));
  const off=d=>d<DMIN||d>DMAX||d<TODAY;
  const cls=d=>[from&&to&&d>from&&d<to?'inr':'', d===from?'edge f':'',
                d===to?'edge t':'', off(d)?'off':''].filter(Boolean).join(' ');
  return `<div class="dpop wide" data-arpanel="${key}">
    <div class="rpnav">
      <button type="button" class="arw" data-arm="${MONTHS[mi-1]||''}" ${mi<=0?'disabled':''}>\u2039</button>
      <span class="rpm num">${dpMonth.replace('-','. ')}</span>
      <button type="button" class="arw" data-arm="${MONTHS[mi+1]||''}" ${mi>=MONTHS.length-1?'disabled':''}>\u203a</button>
    </div>
    <div class="rphd">${WD.map((w,i)=>`<span${i===0?' class="sun"':''}>${w}</span>`).join('')}</div>
    ${wks.map(wk=>`<div class="rprow">${wk.map(c=>c.out
      ? `<span class="rd out"></span>`
      : `<button type="button" class="rd ${cls(c.d)}" data-arr="${c.d}"${
          off(c.d)?' disabled':''}>${+c.d.slice(8)}</button>`).join('')}</div>`).join('')}
    <div class="arfoot">
      <button type="button" class="rpf${picking==='from'?' on':''}" data-apick="from">
        <span class="rpk">시작</span><span class="rpv${from?'':' ph'}">${from?fmtD(from):'선택'}</span></button>
      <button type="button" class="rpf${picking==='to'?' on':''}" data-apick="to">
        <span class="rpk">종료</span><span class="rpv${to?'':' ph'}">${to?fmtD(to):'선택'}</span></button>
      <button type="button" class="pill primary sm" id="arOk"${from&&to?'':' disabled'}>적용</button>
    </div></div>`;
}
const rangeField=(key,a,b,n)=>`<span class="dpwrap">
  <button type="button" class="rangetrig dpt${dpOpen===key?' on':''}" data-dptrig="${key}">
    <svg class="rti" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="2.5" width="12" height="10.5" rx="1.5"/><path d="M1 6h12M4.5 1v3M9.5 1v3"/></svg>
    <span class="rtv">${fmtD(a)} ~ ${fmtD(b)} · ${n}일</span><span class="rtc">\u25be</span>
  </button>
  ${dpOpen===key?rangePopAdm(key):''}</span>`;

function admModal(no,st){


  const r=requests.find(q=>q.no===no); if(!r) return;
  if(r.status==='취소'||r.status==='발송 완료') return cancelModal(no,false);
  admFix.no=no;                       /* 이 건은 잔여 계산에서 뺀다 */
  const rep=r.cycle==='주기성', hours=rep?REC_HOURS:HOURS;
  const len=rangeDays(r.from,r.to).length||1;
  const s=st||{from:r.from,hour:r.hour,ask:false,why:''};
  /* 담당자가 바꾸는 중인 값 — 기록된 값(len)과 구분한다 */
  const wTo=s.to||addDays(s.from,len-1);
  const wLen=rangeDays(s.from,wTo).length||1;
  const span=rep?rangeDays(s.from,wTo):[s.from];
  /* 같은 시각에 같은 채널로 이미 배정된 건수 — 잠그지 않고 참고로만 보여준다.
     시스템이 막는 제약은 일 캐파 하나뿐이다 (0730 담당자 확인) */
  const at={};
  hours.forEach(h=>at[h]=span.reduce((n,d)=>n+requests.filter(q=>
    inScope(q)&&activeOn(d,q)&&swapView(q).hour===h&&slotClash(r,q)).length,0));
  /* 시간대는 기본값을 두지 않는다. 첫 칸(1시)이 미리 잡혀 있으면
     담당자가 고르지 않아도 새벽 1시로 확정돼, '퇴근 후 저녁' 기준과 어긋난다 (D-07).
     고르기 전에는 확정 버튼도 눌리지 않는다 (2026-08-04) */
  const sel=s.hour!=null?s.hour:(r.hour??null);
  const moved=s.from!==r.from||wTo!==r.to;
  /* 자기 자신을 뺀 잔여로 본다 — 이 건을 그 날에 넣을 수 있나 */
  const overCap=span.some(d=>(r.ch.includes('배너')&&bannerRem(d)<r.qty)
                           ||(r.offer==='쿠폰'&&couponRem(d)<r.qty));
  const done=r.status==='확정';
  /* 확정 건은 요약만 보여준다. 이미 자리를 잡은 건이라 캐파·시간대를 늘어놓을 이유가 없고,
     여는 이유는 대개 조정 요청 건에 자리를 내주려는 것이다 — 그때 '수정하기'로 펼친다. */
  const edit=!done||!!s.edit;
  /* 확정 대기는 캐파를 통과해 들어온 건이라 날짜를 바꿀 이유가 없다.
     담당자가 할 일은 시간대 배정과 확정뿐이고, 날짜를 바꾸는 것은 '일정 변경'이라
     성격이 다르다 (D-05). 조정 필요 건과 이미 확정된 건만 날짜를 연다. (2026-08-04) */
  const canMove=r.status!=='신청';
  /* 자리를 비켜 줄 건을 고르는 중이면 목록을 열어 두고, 단독 확정은 막는다 */
  const swapOn=admSwap.no!=null&&requests.some(q=>q.no===admSwap.no);
  /* 주기성은 17~19시에서만 배정한다. 세 칸이 다 차 있으면 담당자가 한 건을 옮길 수 있게 한다.
     시간대는 제약이 아니므로(0730 담당자 확인) 막지 않고 알려만 준다. */
  const hourJam=!overCap&&rep&&hours.every(h=>at[h]>0);

  if(s.ask) return $('modalSlot').innerHTML=`<div class="modal"><div class="box">
      <h3>이 신청을 취소하시겠습니까?</h3>
      <div class="m-sub">취소하면 해당 날짜의 캐파가 다시 확보됩니다. 이 작업은 되돌릴 수 없습니다.</div>
      <div class="herocard">
        ${hrow('캠페인명',r.camp)}
        ${hrow('부서 · 마케터',`${r.team} ${r.mk}`)}
        ${hrow('발송 기간',`${fmtD(r.from)} ~ ${fmtD(r.to)}`)}
        ${hrow(rep?'1일 타겟수':'전체 타겟수',`${man(r.qty)}만 건`)}
      </div>
      <div class="reasonfld" style="margin-top:14px">
        <label>취소 사유</label>
        <textarea id="amWhy" rows="2"
          placeholder="예: 마케터와 협의해 이번 건은 진행하지 않기로 했습니다">${esc(s.why)}</textarea>
      </div>
      <div class="m-act">
        <button class="pill quiet" id="amBack">돌아가기</button>
        <button class="pill danger" id="amCancelOk">신청 취소</button>
      </div></div></div>`, bindAm(no,s);

  /* 다시 그리기 전에 스크롤 위치를 챙겨 뒀다가 되돌린다 */
  const _sc=(()=>{const b=document.querySelector('#modalSlot .box'); return b?b.scrollTop:0})();
  $('modalSlot').innerHTML=`<div class="modal"><div class="box wide">
    <h3>${esc(r.camp)}</h3>
    <div class="m-sub">${r.team} ${r.mk} · 신청 ${fmtReq(r.reqAt)}
      <span class="st ${r.status==='신청'?'applied':r.status==='조정 필요'?'needfix':'confirmed'}"
        style="margin-left:8px">${r.status==='신청'?'확정 대기':r.status}</span></div>
    <div class="herocard">
      ${hrow('신청 기간',`${fmtD(r.from)} ~ ${fmtD(r.to)} · ${len}일`)}
      ${hrow('신청 발송일',rep?`${fmtD(r.from)} 부터 매일`:fmtD(r.from))}
      ${hrow('채널 / GNB',`${r.ch.join(' · ')||'—'} / ${r.gnb||'—'}`)}
      ${hrow('주기 / 오퍼',`${r.cycle} · ${r.offer}`)}
      ${hrow(rep?'1일 타겟수':'전체 타겟수',`${man(r.qty)}만 건`)}
      ${done?hrow('발송 시각',rep?`${hh(r.hour)} 매일`:`${fmtD(r.from)} ${hh(r.hour)}`):''}
      ${r.note?hrow('마케터 사유',r.note):''}
      ${r.reason?hrow('조정 요청',r.reason):''}
    </div>
    ${edit?`
    ${/* 날짜를 바꿀 수 없는 건(확정 대기)은 이 줄을 적지 않는다 —
          위 「신청 기간」·「신청 발송일」과 같은 값을 세 번째로 반복할 뿐이다 (2026-08-04) */''}
    ${canMove?`<div class="fixrow" style="margin-top:14px"><span>발송 일정 변경</span>
      <div class="fdates">
        ${rangeField('am',s.from,wTo,wLen)}
        ${rep?`<span class="tl">매일 발송</span>`:''}
      </div></div>`:''}
    ${/* 초과 사유는 '캐파' 라벨 바로 아래에 붙인다 — 무엇에 대한 이야기인지가
          라벨로 이미 정해져 있어 따로 블록을 세울 필요가 없다.
          라벨이 '캐파'라 사유에서 그 단어를 다시 적지 않는다 (2026-08-04) */''}
    <div class="fixrow"><span>${capLabel(r)}${overCap?shortOf(r,span).map(g=>
      `<em class="capnote">${g.ch} ${man(g.amt)}만 초과${
        span.length>1?`<br>${fmtD(g.d)}`:''}</em>`).join(''):''}</span>${
      gaugeRow(span[0],r,r.qty,'신청건')}</div>
    ${overCap?fixSuggest(r):''}
    ${/* 캐파를 넘긴 상태에서는 시간대를 고를 수 없다 — 골라도 확정이 안 된다.
          눌러도 아무 일이 안 일어나는 컨트롤은 고장으로 읽힌다.
          자리가 나면(날짜를 옮기거나 다른 건을 비켜 주면) 바로 살아난다 (2026-08-04) */''}
    <div class="fixrow"><span>시간대</span>
      <div class="hgrid ${rep?'rec3':'adm'}${overCap?' locked':''}">${hours.map(h=>
        `<div class="hslot ${overCap?'ro ':''}${at[h]?'busy':''}${h===sel?' on':''}"${
          overCap?'':` data-amh="${h}"`}>
          <span class="hh">${h}시</span>
          <span class="hs">${overCap?(at[h]?`${at[h]}건`:'—'):(h===sel?`선택`:at[h]?`${at[h]}건`:`가능`)}</span></div>`).join('')}</div>
    </div>
    ${rep?`<div class="segnote">주기성은 17~19시 중에서 배정합니다.</div>`:''}
    ${hourJam?`<div class="segnote">17~19시가 모두 차 있습니다.</div>`:''}
    ${overCap||hourJam||swapOn?moverList(r,span,hourJam,sel):''}`:''}
    <div class="m-act">
      <button class="pill quiet" id="amNo">닫기</button>
      ${/* 확정 전(확정 대기·조정 필요)은 바로, 확정 건은 '수정하기'를 거친 뒤에만 —
            이미 마케터에게 확정을 알린 건이라 한 단계를 더 둔다 */
        ['신청','조정 필요'].includes(r.status)||(done&&edit)
        ?`<button class="pill danger" id="amCancel">신청 취소</button>`:''}
      ${done&&!edit
        ?`<button class="pill primary" id="amEdit">수정하기</button>`
        :`<button class="pill primary" id="amOk" ${overCap||swapOn||sel==null?'disabled':''}>${
            done?'일정 변경':'확정'}</button>`}
    </div></div></div>`;
  (()=>{const b=document.querySelector('#modalSlot .box'); if(b&&_sc) b.scrollTop=_sc})();
  bindAm(no,s);
}

function bindAm(no,s){
  const r=requests.find(q=>q.no===no);
  const rep=r.cycle==='주기성', len=rangeDays(r.from,r.to).length||1;
  const close=()=>{dpOpen=null;admFix.no=null; noSwap(); $('modalSlot').innerHTML=''};
  /* 옮기던 중에 바깥으로 나가면 그 선택도 함께 버린다 (close 가 noSwap 을 한다) */
  bindOverlay(close);

  /* ── 선점 건 일정 변경 (0731 플로우) ── */
  document.querySelectorAll('[data-swapon]').forEach(x=>x.onclick=()=>{
    const hd=requests.find(q=>q.no===+x.dataset.swapon); if(!hd) return;
    admSwap={no:hd.no,from:hd.from,to:hd.to,hour:hd.hour}; admModal(no,s)});
  document.querySelectorAll('[data-swh]').forEach(x=>x.onclick=()=>{
    admSwap.hour=+x.dataset.swh; admModal(no,s)});
  document.querySelectorAll('[data-swapno]').forEach(x=>x.onclick=()=>{
    noSwap(); admModal(no,s)});

  /* 두 건 함께 — 비켜 준 건은 확정을 유지한 채 옮기고, 조정 요청 건은 그 자리에 확정 */
  document.querySelectorAll('[data-swapok]').forEach(x=>x.onclick=()=>{
    const hd=DB.find(+x.dataset.swapok); if(!hd) return;
    const hn=rangeDays(hd.from,hd.to).length||1, hWas=`${fmtD(hd.from)} ~ ${fmtD(hd.to)}`;
    const hf=admSwap.from, ht=admSwap.to||addDays(admSwap.from,hn-1);
    const hp={from:hf,to:ht,date:hf,
      moved:{from:hWas,to:`${fmtD(hf)} ~ ${fmtD(ht)}`,by:'adm',peer:r.camp}};
    if(admSwap.hour!=null) hp.hour=admSwap.hour;

    const rWas=`${fmtD(r.from)} ~ ${fmtD(r.to)}`;
    const rp={hour:s.hour!=null?s.hour:r.hour,
      status:'확정',reason:'',note:'',adjBy:null};
    if(s.from!==r.from){const nf=s.from, nt=addDays(s.from,len-1);
      Object.assign(rp,{from:nf,to:nt,date:nf,
        moved:{from:rWas,to:`${fmtD(nf)} ~ ${fmtD(nt)}`,by:'adm'}})}
    /* 두 건은 한 번에 반영한다 — 하나만 들어가면 그 날 캐파가 잠깐 어긋난다 */
    DB.setMany([[hd,{...hp,seen:false}],[r,{...rp,seen:false}]]);
    close(); toast(`두 건을 확정했습니다 — ${r.camp} · ${hd.camp} ${fmtD(hd.from)}`); render()});
  const wy=$('amWhy'); if(wy) wy.oninput=e=>s.why=e.target.value;
  const bk=$('amBack'); if(bk) bk.onclick=()=>admModal(no,{...s,ask:false});
  const ck=$('amCancelOk'); if(ck) ck.onclick=()=>{
    if(!s.why.trim()){toast('취소 사유를 입력해 주세요.',true); wy&&wy.focus(); return}
    DB.set(r,{status:'취소',admNote:s.why.trim(),reason:'',adjBy:null,seen:false});
    close(); toast(`신청을 취소했습니다 — ${r.camp}`,true); render()};
  /* 날짜 선택기 — 열기·달 이동·고르기. 상태를 바꾸는 경로는 기존과 같다 */
  document.querySelectorAll('[data-dptrig]').forEach(x=>x.onclick=e=>{
    e.stopPropagation();
    const k=x.dataset.dptrig;
    dpOpen=dpOpen===k?null:k;
    if(dpOpen){
      dpMonth=(k==='am'?s.from:(admSwap.from||r.from)).slice(0,7);
      if(k==='am') dpRange={from:s.from,to:s.to||addDays(s.from,
        (rangeDays(r.from,r.to).length||1)-1),picking:'from'};
      else {
        const hd=DB.find(admSwap.no);
        const hf=admSwap.from||(hd&&hd.from);
        dpRange={from:hf,to:admSwap.to||(hd?addDays(hf,(rangeDays(hd.from,hd.to).length||1)-1):hf),
                 picking:'from'};
      }
    }
    admModal(no,s)});
  /* 범위 고르기 — 종료를 고르는 중이고 시작보다 뒤면 기간이 닫힌다 */
  document.querySelectorAll('[data-arr]').forEach(x=>x.onclick=e=>{
    e.stopPropagation();
    const d=x.dataset.arr, {from,picking}=dpRange;
    if(picking==='to'&&from&&d>=from){ dpRange.to=d; dpRange.picking='from' }
    else { dpRange.from=d; dpRange.to=''; dpRange.picking='to' }
    admModal(no,s)});
  document.querySelectorAll('[data-apick]').forEach(x=>x.onclick=e=>{
    e.stopPropagation(); dpRange.picking=x.dataset.apick; admModal(no,s)});
  document.querySelectorAll('[data-arm]').forEach(x=>x.onclick=e=>{
    e.stopPropagation(); if(x.dataset.arm){dpMonth=x.dataset.arm; admModal(no,s)}});
  const _ar=$('arOk');
  if(_ar) _ar.onclick=e=>{ e.stopPropagation();
    const {from,to}=dpRange, where=dpOpen; dpOpen=null;
    const f=from<TODAY?TODAY:from;
    if(where==='sw'){ admSwap.from=f; admSwap.to=to; admModal(no,s) }
    else admModal(no,{...s,from:f,to}) };
  document.querySelectorAll('.dpop').forEach(x=>x.onclick=e=>e.stopPropagation());
  document.querySelectorAll('[data-dpm]').forEach(x=>x.onclick=e=>{
    e.stopPropagation(); if(x.dataset.dpm){dpMonth=x.dataset.dpm; admModal(no,s)}});
  /* 팝오버 바깥을 누르면 닫는다 */
  const _box=document.querySelector('#modalSlot .box');
  if(_box) _box.addEventListener('click',()=>{ if(dpOpen){dpOpen=null; admModal(no,s)} });
  /* 추천 날짜도 날짜 입력과 같은 경로를 탄다 — 상태가 한 곳에서만 바뀐다 */
  document.querySelectorAll('[data-sug]').forEach(x=>x.onclick=()=>
    admModal(no,{...s,from:x.dataset.sug}));
  document.querySelectorAll('[data-swapto]').forEach(x=>x.onclick=()=>{
    const hd=DB.find(admSwap.no), n=hd?(rangeDays(hd.from,hd.to).length||1):1;
    admSwap.from=x.dataset.swapto; admSwap.to=addDays(x.dataset.swapto,n-1);
    admModal(no,s)});
  document.querySelectorAll('[data-amh]').forEach(x=>x.onclick=()=>
    admModal(no,{...s,hour:+x.dataset.amh}));
  const cn=$('amCancel'); if(cn) cn.onclick=()=>admModal(no,{...s,ask:true});
  const ed=$('amEdit'); if(ed) ed.onclick=()=>admModal(no,{...s,edit:true});
  const no2=$('amNo'); if(no2) no2.onclick=close;
  const ok=$('amOk'); if(ok) ok.onclick=()=>{
    const hours=rep?REC_HOURS:HOURS;
    const sel=s.hour!=null?s.hour:(r.hour??hours[0]);
    if(sel==null){toast('시간대를 골라 주세요.',true); return}
    const was=`${fmtD(r.from)}${rep?` ~ ${fmtD(r.to)}`:''}`;
    const patch={hour:sel,status:'확정',reason:'',note:'',adjBy:null};
    if(s.from!==r.from||wTo!==r.to){
      const nf=s.from, nt=wTo;
      Object.assign(patch,{from:nf,to:nt,date:nf,
        moved:{from:was,to:`${fmtD(nf)}${rep?` ~ ${fmtD(nt)}`:''}`,by:'adm'}});
    }
    DB.set(r,{...patch,seen:false});
    close(); toast(`${fmtD(r.from)} ${hh(sel)} 로 확정했습니다 — ${r.camp}`); render()};
}

function bindManage(){
  document.querySelectorAll('[data-km]').forEach(x=>x.onclick=()=>{
    if(x.dataset.km){kpiMonth=x.dataset.km; render()}});
  document.querySelectorAll('[data-am]').forEach(x=>x.onclick=()=>admModal(+x.dataset.am));
  document.querySelectorAll('[data-panel]').forEach(x=>x.onclick=()=>{
    openPanel=openPanel===x.dataset.panel?null:x.dataset.panel; render()});

  /* ── 드래그로 날짜 옮기기 ──
     클릭 경로는 그대로 둔다. 드래그는 그 위에 얹는 것이라 키보드로도 쓸 수 있다.
     드롭이 곧 확정은 아니다 — 기존 확정 모달을 열어 캐파와 시간대를 다시 보이고,
     담당자가 '확정'을 눌러야 반영된다. 실수로 끌었을 때 되돌릴 자리가 필요하다. */
  document.querySelectorAll('.crow[data-am]').forEach(el=>{
    /* 이미 나갔거나 취소된 건은 옮길 수 없다 */
    if(el.classList.contains('sent')||el.classList.contains('canc')) return;
    el.draggable=true;
    el.ondragstart=e=>{
      e.dataTransfer.setData('text/plain',el.dataset.am);
      e.dataTransfer.effectAllowed='move';
      el.classList.add('dragging');
      document.body.classList.add('dnd');
    };
    el.ondragend=()=>{el.classList.remove('dragging'); document.body.classList.remove('dnd');
      document.querySelectorAll('.dropon').forEach(c=>c.classList.remove('dropon'))};
  });
  document.querySelectorAll('[data-drop]').forEach(cell=>{
    cell.ondragover=e=>{e.preventDefault(); e.dataTransfer.dropEffect='move';
      cell.classList.add('dropon')};
    cell.ondragleave=()=>cell.classList.remove('dropon');
    cell.ondrop=e=>{
      e.preventDefault(); cell.classList.remove('dropon');
      document.body.classList.remove('dnd');
      const no=+e.dataTransfer.getData('text/plain'), to=cell.dataset.drop;
      const r=DB.find(no);
      if(!r) return;
      if(to===r.from){toast('같은 날짜입니다.'); return}
      admModal(no,{from:to,edit:true});
    };
  });
}

/* ══════════════════════════════════════════════════════════════════════
   렌더
   ══════════════════════════════════════════════════════════════════════ */
function render(){
  $('roleMkt').classList.toggle('on',role==='mkt');
  $('roleAdm').classList.toggle('on',role==='adm');
  renderTabs();
  if(tab==='apply'){ $('page').innerHTML=renderApply(); bindApply(); }
  else if(tab==='cal'&&calDay){
    $('page').innerHTML=renderDay(calDay);
    $('backCal').onclick=()=>{calDay=null;render()};
    $('prevD').onclick=()=>{calDay=addDays(calDay,-1);calMonth=calDay.slice(0,7);render()};
    $('nextD').onclick=()=>{calDay=addDays(calDay,1);calMonth=calDay.slice(0,7);render()};
    const ah=$('applyHere');
    if(ah) ah.onclick=()=>{
      /* 날짜만 물려주고 조건 입력 상태로 보낸다.
         조회 기간을 하루로 잠그면 비교할 후보가 없어 추천이 성립하지 않는다.
         다른 화면과 같은 창(앞뒤 3일·바닥은 내일)을 열어 준다 (2026-08-04) */
      const [lo,hi]=nearWin(calDay);
      form=EMPTY_FORM(); draft=EMPTY_DRAFT();
      form.qFrom=clampD(lo); form.qTo=clampD(hi);
      calPick=calDay;
      calDay=null; tab='apply'; found=false; render();
    };
  }
  else if(tab==='cal'){
    $('page').innerHTML=renderCal();
    const mi=MONTHS.indexOf(calMonth);
    $('pm').onclick=()=>{calMonth=MONTHS[mi-1];render()};
    $('nm').onclick=()=>{calMonth=MONTHS[mi+1];render()};
    document.querySelectorAll('[data-cd]').forEach(x=>x.onclick=()=>{calDay=x.dataset.cd;render()});
    document.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{calFilter.mode=x.dataset.m;render()});
    document.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{
      const v=x.dataset.f;
      if(v==='__clear'){calFilter.ch=[];calFilter.offer=''}
      else{const i=calFilter.ch.indexOf(v); i<0?calFilter.ch.push(v):calFilter.ch.splice(i,1)}
      render()});
    /* 오퍼는 한 번 더 누르면 해제된다 */
    document.querySelectorAll('[data-fo]').forEach(x=>x.onclick=()=>{
      calFilter.offer=calFilter.offer===x.dataset.fo?'':x.dataset.fo; render()});
  }
  else { $('page').innerHTML=renderManage(); bindManage(); }
}
$('roleMkt').onclick=()=>{role='mkt';openPanel=null;$('roleMkt').classList.add('on');$('roleAdm').classList.remove('on');
  if(tab==='manage') tab='apply'; render()};
$('roleAdm').onclick=()=>{role='adm';openPanel=null;$('roleAdm').classList.add('on');$('roleMkt').classList.remove('on');
  tab='manage'; render()};

/* 먼저 더미로 한 번 그려서 화면이 비지 않게 하고, 서버가 있으면 받아서 다시 그린다.
   실시간 변경도 같은 자리로 들어온다 (DB.onChange → render). */
DB.onChange(()=>{if(DB.isRemote()&&DB.isReady()) render()});
render();
if(DB.isRemote()) DB.connect().then(ok=>{
  if(ok) console.log('[DB] 서버 연결 · 실시간 구독 시작');
}).catch(e=>{console.error('[DB] 연결 실패',e);
  toast('서버에 연결하지 못해 로컬 데이터로 표시합니다.',true)});
</script>
